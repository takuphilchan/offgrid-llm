<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OffGrid</title><link rel="stylesheet" href="app-dialog.css"></head><body>
<main role="dialog" aria-labelledby="title" aria-describedby="message detail" aria-modal="true">
<header><h1 id="title"></h1><button id="close" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
<div class="body"><p id="message"></p><p id="detail" dir="auto"></p><label id="remember-row" hidden><input id="remember" type="checkbox"><span id="remember-label"></span></label>
<div id="secret-fields" hidden><label class="secret-row"><span id="secret-label"></span><input id="secret" type="password" maxlength="4096" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="secret-error"></label><label class="secret-row" id="secret-confirm-row" hidden><span id="secret-confirm-label"></span><input id="secret-confirm" type="password" maxlength="4096" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="secret-error"></label><p id="secret-error" role="alert" hidden></p></div></div>
<footer id="actions"></footer></main></body></html>
