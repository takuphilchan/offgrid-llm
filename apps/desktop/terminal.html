<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>OffGrid Terminal</title><link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css"><link rel="stylesheet" href="terminal.css"></head>
<body>
<header><button id="chat" title="Chat" aria-label="Chat"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg><span>Chat</span></button><div id="tabs" role="tablist" aria-label="Terminals"></div><button id="new" popovertarget="launch-menu" title="New terminal" aria-label="New terminal"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button><div class="tools"><button id="search" title="Search terminal output" aria-label="Search terminal output"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21l-4.4-4.4M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0"/></svg></button><button id="hide" title="Return to Chat" aria-label="Return to Chat"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5v16h14V4h-4M12 16V4m-4 4 4-4 4 4"/></svg></button></div></header><div id="launch-menu" popover aria-label="New terminal"><button id="cli" title="Open a shell with OffGrid commands ready" aria-label="OffGrid CLI"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l6 7-6 7M13 19h7"/></svg><span>OffGrid CLI</span></button><button id="agent" title="Open OffGrid Agent and choose a profile" aria-label="Agent"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6M19 13a3 3 0 1 0 0 6 3 3 0 0 0 0-6M5 13a3 3 0 1 0 0 6 3 3 0 0 0 0-6M12 9v7m-4 0h8"/></svg><span>Agent</span></button><button id="shell">PowerShell</button></div>
<div id="find" hidden><input id="query" type="search" aria-label="Search terminal output" placeholder="Search terminal output"><button id="previous" title="Previous match" aria-label="Previous match"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4m-6 6 6-6 6 6"/></svg></button><button id="next" title="Next match" aria-label="Next match"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16m-6-6 6 6 6-6"/></svg></button><button id="find-close" title="Close search" aria-label="Close search"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div id="notice" role="status"></div><main id="panes"><section id="empty" aria-labelledby="terminal-welcome-title"><div class="terminal-welcome"><h1 id="terminal-welcome-title">Work in your terminal</h1><p>Run OffGrid commands or start an agent conversation.</p><div class="terminal-launch-options"><button id="start"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l6 7-6 7M13 19h7"/></svg><span><strong>OffGrid CLI</strong><small>Run commands in a local folder</small></span><span aria-hidden="true">&#8594;</span></button><button id="start-agent"><svg class="terminal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/><path d="M12 8v5m-7 2v-2h14v2"/></svg><span><strong>Agent</strong><small>Choose a profile and describe a task</small></span><span aria-hidden="true">&#8594;</span></button></div><p class="terminal-welcome-note">Choose a folder to start. Commands use your computer's permissions.</p></div></section></main>
<footer><span id="identity">Local terminal · not sandboxed</span><span id="hint">Ctrl+Shift+C copy · Ctrl+C interrupt</span></footer>
<script src="node_modules/@xterm/xterm/lib/xterm.js"></script><script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script><script src="node_modules/@xterm/addon-search/lib/addon-search.js"></script><script src="terminal-renderer.js"></script></body></html>
