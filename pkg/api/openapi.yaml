      required: [version, revision, delete_after, legal_hold]
      properties:
        version: { type: integer, enum: [1] }
        revision: { type: integer, minimum: 1 }
        delete_after: { type: integer, format: int64, minimum: 0, maximum: 253402300799, description: UTC Unix seconds; zero retains until explicit deletion. }
        legal_hold: { type: boolean, description: Prevents document deletion, expiry and removal of associated import evidence. }
