openapi: 3.1.0
info:
  title: OffGrid Local API
  version: 1.0.0
  description: Stable contract shared by the OffGrid service, web UI, desktop app, CLI, and external agents.
servers:
  - url: http://127.0.0.1:11611
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /api/v2/user-preferences:
    get:
      operationId: getUserPreferences
      responses:
        '200':
          description: Current actor/workspace defaults. Revision zero means no saved defaults; this read creates no state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
  /api/v2/user-preferences/commands:
    post:
      operationId: configureUserPreferences
      description: Replaces preferences only. Empty payload inherits service defaults. Does not change accepted runs, restrictions, host grants or memory consent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferencesCommand' }
      responses:
        '202':
          description: Committed preference command, or the identical recorded receipt on retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '400': { description: Invalid envelope or unsupported preference. }
        '409': { description: Revision or request identity conflict. }
  /api/v2/conversations:
    get:
      operationId: listCanonicalConversations
      parameters:
        - { in: query, name: after, schema: { type: string } }
      responses:
        '200':
          description: Actor/workspace scoped page; observing does not create a default project or dispatch work.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalConversationPage' }
    post:
      operationId: createCanonicalConversation
      description: Preview admission must be enabled. Creates a conversation or explicitly imports an owned inactive legacy session. Creates a private default project when none is selected. No profile or model call is required. Imports retain source bytes and atomically switch write authority.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCommand' }
      responses:
        '202':
          description: Command committed with revision, event and outbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '200':
          description: Identical recorded retry; no execution is resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '409': { description: Request identity conflicts with previously accepted content. }
        '503': { description: New admission disabled; existing resources remain readable and controllable. }
  /api/v2/conversations/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getCanonicalConversation
      responses:
        '200':
          description: Current authoritative conversation snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CanonicalConversation' }
        '404': { description: Conversation unavailable in this actor/workspace. }
  /api/v2/conversations/{id}/commands:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: commandCanonicalConversation
      description: Target must match the path. Identical retries return the original receipt before checking mutable resource readiness. New work is committed with its run before the existing coordinator can dispatch it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCommand' }
      responses:
        '202':
          description: Accepted command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '200':
          description: Previously accepted command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '409': { description: Revision or request identity conflict. }
        '422': { description: Required model or scoped resource unavailable. }
        '503': { description: New admission disabled. }
  /api/v2/conversations/{id}/events:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: query, name: after, schema: { type: integer, format: int64, minimum: 0 } }
      - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
    get:
      operationId: getCanonicalConversationEvents
      responses:
        '200':
          description: Ordered page. Expired cursors include history_gap and a current snapshot. GET never approves, continues or dispatches work.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlEventPage' }
  /api/v2/conversations/{id}/inputs:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: query, name: after, schema: { type: integer, format: int64, minimum: 0 } }
      - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
    get:
      operationId: getConversationInputs
      responses:
        '200':
          description: Ordered durable inbox state. Observation never prepares, resumes or dispatches execution. Result retrieval retains its own source-access checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationInboxPage' }
        '400': { description: Invalid cursor or limit. }
        '404': { description: Conversation unavailable in this actor/workspace. }
    post:
      operationId: submitConversationInput
      description: Accepts text independently of model readiness. Preview admission must be enabled for new input; identical retries return their original receipt. Pending-question answers and approvals use existing work controls.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationInputCommand' }
      responses:
        '202':
          description: Input, conversation event and affected work fences committed. Execution is service-owned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '200':
          description: Recorded identical receipt; no new dispatch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '400': { description: Invalid input or envelope. }
        '403': { description: Focused work sources unavailable. }
        '404': { description: Conversation or focused work unavailable. }
        '409': { description: Revision or request identity conflict. }
        '422': { description: Pending-question answers require their existing work control. }
        '503': { description: New input admission disabled or service storage unavailable. }
  /api/v2/conversations/{id}/inputs/{input_id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: input_id, required: true, schema: { type: string } }
    get:
      operationId: getConversationInput
      responses:
        '200':
          description: Accepted input and its delivery/incorporation state, including any preparation limitation. No execution is resumed by this read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationInboxEntry' }
        '404': { description: Input unavailable in this conversation and actor/workspace. }
  /api/v2/conversations/{id}/inputs/{input_id}/commands:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: input_id, required: true, schema: { type: string } }
    post:
      operationId: controlConversationInput
      description: Stop withdraws unapplied input, separately from stopping work. Continue resumes the pinned interrupted foreground attempt and its remaining budget. Revalidate explicitly approves applying the saved exact correction against the specified current work instruction version. No command grants host access.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationInputControlCommand' }
      responses:
        '202':
          description: Control committed. Stop remains stopping until active operations and hold release settle. Already applied input returns its recorded outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '200':
          description: Recorded identical control receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '400': { description: Invalid envelope or control. }
        '403': { description: Current actor or source access does not permit continuation or revalidation. Stop remains available to the authorized owner. }
        '404': { description: Input unavailable. }
        '409': { description: State, revision or request identity conflict. }
  /api/v2/conversations/{id}/configuration:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getCanonicalConversationConfiguration
      responses:
        '200':
          description: Resolved preferences and provenance. This response is not a host grant or proof of live resource authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveConversationPreferences' }
  /api/v2/projects:
    post:
      operationId: createConversationProject
      description: Creates private preferences and resource references. Does not grant resource access or enroll execution hosts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCommand' }
      responses:
        '202':
          description: Committed project command or its recorded identical receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '409': { description: Request identity conflict. }
    get:
      operationId: listConversationProjects
      parameters:
        - { in: query, name: after, schema: { type: string } }
      responses:
        '200':
          description: Private scoped project metadata. Membership grants no access.
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ConversationProject' } }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
  /api/v2/projects/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getConversationProject
      parameters:
        - { in: query, name: revision, schema: { type: integer, minimum: 1 }, description: Omit for the current project; supply to inspect an immutable admitted revision. }
      responses:
        '200':
          description: Project preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationProject' }
  /api/v2/projects/{id}/commands:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: commandConversationProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCommand' }
      responses:
        '202':
          description: Committed revision or previously recorded identical command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '409': { description: Revision or request identity conflict. }
  /api/v2/results/{id}:
    get:
      operationId: getConversationResult
      description: Retrieve immutable output with settlement provenance. Requires current owner and source access. Reads never resume execution. Byte offsets must start at a UTF-8 boundary; a tiny limit returns at least one complete character.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 65536, default: 4096 } }
      responses:
        '200':
          description: Bounded saved output
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationResultPage' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/work-items:
    get:
      operationId: listConversationWorkItems
      parameters:
        - { in: query, name: after, schema: { type: string } }
      responses:
        '200':
          description: Scoped work identities and current state.
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ConversationWorkItem' } }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
  /api/v2/work-items/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getConversationWorkItem
      responses:
        '200':
          description: Work identity and current run. Host grant material remains private.
          content:
            application/json:
              schema:
                type: object
                required: [work, run]
                properties:
                  work: { $ref: '#/components/schemas/ConversationWorkItem' }
                  run: { $ref: '#/components/schemas/AgentRunResponse' }
  /api/v2/work-items/{id}/changes:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: query, name: after, schema: { type: string } }
      - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 64, default: 32 } }
    get:
      operationId: listWorkChanges
      description: Lists retained proposals and tested candidates, including unavailable-source status. Reading never grants access, dispatches or integrates work.
      responses:
        '200':
          description: Owned work changes without host grants or private paths.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkChangeList' }
  /api/v2/work-items/{id}/changes/{change_id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: change_id, required: true, schema: { type: string } }
      - { in: query, name: view, schema: { type: string, enum: [files, validation, integration, recovery, content, preserved], default: files } }
      - { in: query, name: offset, schema: { type: integer, format: int64, minimum: 0 } }
      - { in: query, name: limit, description: Maximum 64 entries or 65536 content bytes., schema: { type: integer, minimum: 1, maximum: 65536 } }
      - { in: query, name: hash, description: Required result or observed retained-file SHA-256 for byte pages., schema: { type: string } }
      - { in: query, name: artifact, description: Required recovery artifact identity for preserved byte pages., schema: { type: string } }
    get:
      operationId: inspectWorkChange
      description: Reads exact captured evidence through current source access. No dispatch, recovery command, integration or new grant occurs. Content is base64 encoded; next_offset is an entry offset or byte offset according to view.
      responses:
        '200':
          description: Bounded authorized evidence. Validation and file integration are not semantic task-completion claims.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkChangeDetail' }
        '403': { description: Source authority is unavailable or revoked. }
        '404': { description: Owned work or change reference was not found. }
        '409': { description: Native evidence is unavailable or does not match the captured reference. }
  /api/v2/work-items/{id}/events:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: query, name: after, schema: { type: integer, format: int64, minimum: 0 } }
      - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
    get:
      operationId: getConversationWorkEvents
      responses:
        '200':
          description: Work events committed alongside run state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlEventPage' }
  /api/v2/work-items/{id}/commands:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: commandConversationWork
      description: Commits graph fences and command receipt before cancellation. Controls require no model slot. Stop and Pause remain available after source revocation with content redacted. Continuation preserves consumed budgets and requires settled, recoverable state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkControlCommand' }
      responses:
        '202':
          description: Accepted control. Stopping and pausing remain pending until active operations settle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '200':
          description: Identical recorded retry; no control is re-applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '409': { description: Changed revision, conflicting request identity, or unresolved execution state. }
  /api/v2/workers:
    get:
      operationId: listWorkerSessions
      parameters:
        - { in: query, name: after, schema: { type: string } }
      responses:
        '200':
          description: Scoped worker metadata, excluding revoked-source content.
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkerSession' } }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
  /api/v2/workers/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getWorkerSession
      responses:
        '200':
          description: Worker assignment, stable identity and run history. Completion is separate from verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerSession' }
  /api/v2/workers/{id}/commands:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: commandWorkerSession
      description: Messages fence outdated proposals and are applied once at a checkpoint. Continue creates another run under the same worker and root allowance; stopped workers require an explicit user continuation. Source access is rechecked; no grant is inherited from membership.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerCommand' }
      responses:
        '202':
          description: Committed worker command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '200':
          description: Previously committed identical command; not applied twice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationCommandReceipt' }
        '409': { description: Revision conflict, unsettled operation, closed session, or work no longer eligible for this command. }
  /api/v2/workers/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: query, name: after, schema: { type: integer, format: int64, minimum: 0 } }
      - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
    get:
      operationId: getWorkerMessages
      responses:
        '200':
          description: Ordered durable mailbox with accepted, delivered, applied and abandoned states.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerMessagePage' }
  /api/v2/workers/{id}/events:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: query, name: after, schema: { type: integer, format: int64, minimum: 0 } }
      - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
    get:
      operationId: getWorkerEvents
      responses:
        '200':
          description: Ordered worker control events; reading never delivers or applies messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlEventPage' }
  /api/v2/models/import/gguf:
    post:
      operationId: importOfflineGGUF
      description: Explicit offline single-file GGUF upload into the connected workspace. Requires model management authority. Bounded header checks and a stored SHA256 do not establish tensor validity, runtime compatibility or qualification. No overwrite, automatic model selection, loading or companion download. Requires gguf-offline-import-v1 capability.
      parameters:
        - in: query
          name: filename
          required: true
          schema: { type: string, maxLength: 240 }
        - in: query
          name: size
          required: true
          schema: { type: integer, minimum: 1048576, maximum: 34359738368 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: File installed. A failed inventory refresh does not undo publication; inspect installed models before attempting another import.
          content:
            application/json:
              schema:
                type: object
                required: [model_id, filename, size, sha256, inventory_refreshed]
                properties:
                  model_id: { type: string }
                  filename: { type: string }
                  size: { type: integer }
                  sha256: { type: string }
                  inventory_refreshed: { type: boolean }
        '401': { description: Authentication required. }
        '403': { description: Model management permission required. }
        '409': { description: Existing filename or model identity preserved. }
        '422': { description: Unsupported name, size or single-file GGUF header. }
        '503': { description: Storage unavailable; no existing file overwritten. }
  /api/v2/execution/pairing:
    post:
      operationId: pairExecutionHost
      description: Preview-gated authenticated native-supervisor setup. Issues a two-minute single-use actor/workspace ticket, not a folder grant. The trusted local host must independently approve the scope and verify its pinned worker before using the private host transport. Never log or export the ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Single-use setup ticket; Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionPairing' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/execution/revoke:
    post:
      operationId: revokeExecutionHost
      description: Revoke exactly the authenticated actor's host reference in this workspace. Does not undo effects or establish that a disconnected native process stopped; the native supervisor closes its owned worker when the bridge ends. Inspect uncertain operations rather than replaying them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reference]
              properties:
                reference: { $ref: '#/components/schemas/ExecutionReference' }
      responses:
        '200':
          description: Service-side authority revoked, not an undo or native-stop guarantee.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/execution/workspaces:
    get:
      operationId: listExecutionWorkspaces
      description: Inspect only ready, already locally approved execution workspaces owned by the authenticated actor in this service workspace. No folder path submission or implicit service-directory authority. Enrollment and platform qualification remain gated.
      responses:
        '200':
          description: Ready actor-scoped workspace references; credentials are never included.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces, protocol]
                properties:
                  protocol: { type: integer, const: 1 }
                  workspaces: { type: array, items: { $ref: '#/components/schemas/ExecutionWorkspace' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/inference/prepare:
    post:
      operationId: prepareInferenceModel
      description: Load the selected installed GGUF chat model through normal chat permission, memory admission and the shared scheduler. No generation, tool execution, default-model change or workflow qualification. Cancellation releases this caller's demand; preparation still required by live callers is retained. Native provider preparation is not supported by this endpoint yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model]
              properties:
                model: { type: string, minLength: 1 }
      responses:
        '200':
          description: Selected runtime prepared; it remains subject to subsequent admission and runtime availability.
          content:
            application/json:
              schema:
                type: object
                required: [model, prepared, context_window, elapsed_ms]
                properties:
                  model: { type: string }
                  prepared: { type: boolean }
                  context_window: { type: integer }
                  elapsed_ms: { type: integer, format: int64 }
        '400': { description: Invalid request or unavailable chat model. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Chat permission required. }
        '503': { description: Runtime preparation or memory admission failed; no generation dispatched. }
  /api/v2/models:
    get:
      operationId: listTypedModels
      description: Shared installed inventory. Requires model-read permission; legacy IDs remain unchanged and speech is never a chat model.
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/ModelCategory' } }
      responses:
        '200':
          description: Installed legacy files and packages, including damaged package records.
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models: { type: array, items: { $ref: '#/components/schemas/InstalledTypedModel' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v2/models/catalog:
    get:
      operationId: typedModelCatalog
      description: Shared curated catalog or explicit public Hugging Face search. Search results are leads, not compatible packages.
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/ModelCategory' } }
        - { name: source, in: query, schema: { type: string, enum: [curated, huggingface] } }
        - { name: q, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        '200':
          description: Typed curated variants or repository metadata.
          content:
            application/json:
              schema:
                type: object
                required: [models, repositories]
                properties:
                  models: { type: array, items: { $ref: '#/components/schemas/TypedCatalogModel' } }
                  repositories:
                    type: array
                    items:
                      type: object
                      required: [id, downloads, likes]
                      properties:
                        id: { type: string }
                        downloads: { type: integer, format: int64 }
                        likes: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: Public source unavailable; check service connectivity. }
  /api/v2/models/discover:
    get:
      operationId: discoverSpeechPackages
      description: Bounded public repository listing pinned to a full commit. No weight download or code execution.
      parameters:
        - { name: repository, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Supported complete variants and explanations for incomplete layouts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackageDiscovery' }
        '422': { description: Unsupported source, incomplete listing or source identity mismatch. }
  /api/v2/models/resolve:
    post:
      operationId: resolveModelPackage
      description: Model-management permission required. Resolve a curated ID or discovered immutable variant; bounded small data may be fetched, never weights. Preview expires after ten minutes and is actor-bound. Missing runtime is disclosed, not installed automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveModelRequest' }
      responses:
        '200':
          description: Complete data manifest, provenance, license notices and disk/runtime preflight.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelResolution' }
        '403': { description: Model management permission required. }
        '422': { description: Source or package cannot be resolved safely. }
        '507': { description: Insufficient staging and recovery space. }
  /api/v2/models/operations:
    get:
      operationId: listModelOperations
      description: Actor-scoped durable package operations; administrators can inspect all. Legacy file downloads retain their compatible v1 progress projection in the same store.
      responses:
        '200':
          description: Persisted operations; reading never restarts them.
          content:
            application/json:
              schema:
                type: object
                required: [operations]
                properties:
                  operations: { type: array, items: { $ref: '#/components/schemas/ModelOperation' } }
    post:
      operationId: submitModelOperation
      description: Management permission required. Persist before acceptance; same actor/request ID and payload returns the original operation, conflicting reuse is 409. Repair uses an earlier completed source-bound operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, action]
              properties:
                request_id: { type: string, minLength: 8, maxLength: 128 }
                expectations: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/OutcomeExpectation' }, description: Optional caller-authored outcomes; no access grant. Native workflows only. }
                action: { type: string, enum: [install, repair] }
                resolution_id: { type: string, description: Required for install. }
                source_operation_id: { type: string, description: Required for exact-source repair. }
      responses:
        '202':
          description: Durably accepted, not necessarily installed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelOperation' }
        '409': { description: Conflicting request/source, expired preview, or package already owned by an operation. }
        '503': { description: Acceptance could not be persisted; no worker started. }
  /api/v2/models/operations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getModelOperation
      responses:
        '200':
          description: Operation snapshot with aggregate and per-artifact progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelOperation' }
        '404': { description: Not found or owned by another actor. }
  /api/v2/models/operations/{id}/{action}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [cancel, resume, discard] } }
    post:
      operationId: controlModelOperation
      description: Management permission and actor/admin ownership required. Cancel settles before Resume; restart never resumes automatically. Discard tombstones inactive work before removing its staging, not user documents or installed packages.
      responses:
        '200':
          description: New snapshot; cancelling means the worker has not settled yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelOperation' }
        '409': { description: Active work or lifecycle conflict. }
  /api/v2/models/packages:
    get:
      operationId: listModelPackages
      description: Managed speech package inventory; model-read permission required. Installation is not runtime compatibility or qualification.
      responses:
        '200':
          description: Inventory including damaged packages that need repair.
          content:
            application/json:
              schema:
                type: object
                required: [packages]
                properties:
                  packages: { type: array, items: { $ref: '#/components/schemas/ModelPackageState' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: importModelPackage
      description: Model-management permission required. Stream manifest first, then one part per artifact in manifest order, using its exact path as the form name. No extra parts. Limits 1 MiB manifest, 2048 artifacts, 32 GiB total data. No runtime installation or code execution.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { $ref: '#/components/schemas/ModelPackageManifest' }
              additionalProperties: { type: string, format: binary }
      responses:
        '201':
          description: Complete package verified and activated; not an asynchronous acceptance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelPackageState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Model management permission required. }
        '409': { description: Immutable revision already installed. }
        '413': { description: Upload limit exceeded. }
        '422': { description: Invalid manifest or incomplete, corrupt, or unsafe artifacts. }
  /api/v2/models/packages/{id}/{revision}/{operation}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: revision, in: path, required: true, schema: { type: string } }
      - { name: operation, in: path, required: true, schema: { type: string, enum: [verify, remove] } }
    post:
      operationId: manageModelPackage
      description: Model-management permission required. Verify checks all managed bytes; remove refuses an active lease and removes only this revision.
      responses:
        '200':
          description: Verification evidence or removal result.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ModelPackageState' }
                  - { type: object, required: [removed], properties: { removed: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Model management permission required. }
        '404': { description: Revision not installed. }
        '409': { description: Package is leased by active work. }
        '422': { description: Integrity verification failed; existing files preserved. }
  /v1/search:
    get:
      operationId: searchPublicModels
      description: Explicit online search of public GGUF repositories. Requires model permissions. No hardware size cap.
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Repository metadata; file lists are fetched on selection, not for every result.
          content:
            application/json:
              schema:
                type: object
                required: [total, results]
                properties:
                  total: { type: integer }
                  results: { type: array, items: { $ref: '#/components/schemas/DiscoveredModel' } }
        '400': { description: Invalid search query or limit. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: Upstream search unavailable; this is not an empty successful search. }
  /v1/search/files:
    get:
      operationId: listPublicModelFiles
      parameters:
        - { name: repo, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: GGUF choices with repository-scoped local IDs and exact sizes when available; first 1000 tree entries.
          content:
            application/json:
              schema:
                type: object
                required: [repo, files]
                properties:
                  repo: { type: string }
                  files: { type: array, items: { $ref: '#/components/schemas/DiscoveredFile' } }
        '400': { description: Invalid repository name. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: Upstream file discovery unavailable. }
  /api/v2/work/search:
    get:
      operationId: searchWork
      summary: Search authorized conversation names and root task requests
      description: Metadata only; does not search message bodies or artifact contents. Returns at most 20 matches. Partial indicates a scan, time, storage or result limit; refine the query. No execution or replay occurs.
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 256 }
      responses:
        '200':
          description: Authorized work metadata, sorted newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkSearchResponse'
        '400': { description: Invalid query }
        '403': { description: No permission to search either work type }
        '405': { description: Method not allowed }
  /api/v2/system:
    get:
      operationId: getSystemIdentity
      security: []
      responses:
        '200':
          description: Public product identity and implemented client contracts, without private runtime state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemIdentity' }
  /api/v2/runtime:
    get:
      operationId: getInferenceRuntimeReadiness
      description: Reports engine preparation separately from model readiness; requires models permission. No download is started.
      responses:
        '200':
          description: Runtime preparation status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InferenceRuntimeReadiness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Native inference preparation unavailable }
    post:
      operationId: prepareInferenceRuntime
      description: Requires models management permission. Checks the configured runtime or downloads the pinned CPU/Metal engine. Bounded to five minutes; disconnect cancels the request. Poll GET for progress. Does not load a model or prove a first answer.
      responses:
        '200':
          description: Engine prepared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InferenceRuntimeReadiness' }
        '409':
          description: Another preparation is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InferenceRuntimeReadiness' }
        '503':
          description: Preparation failed or unavailable; query status before retrying
        '401': { $ref: '#/components/responses/Unauthorized' }
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Runtime health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/users/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authentication state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: Session cleared
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string } }
  /v1/models:
    get:
      operationId: listModels
      responses:
        '200':
          description: Installed models
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Model' }
  /v1/catalog:
    get:
      operationId: listCatalog
      responses:
        '200':
          description: Curated model catalog
          content:
            application/json:
              schema:
                type: object
                required: [total, models]
                properties:
                  total: { type: integer }
                  models:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogModel' }
  /v1/models/download:
    post:
      operationId: downloadModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelDownloadRequest' }
      responses:
        '200':
          description: Download accepted
          content:
            application/json:
              schema:
                type: object
                required: [success, status, file_name]
                properties:
                  success: { type: boolean }
                  status: { type: string }
                  file_name: { type: string }
                  message: { type: string }
        '409': { $ref: '#/components/responses/Error' }
  /v1/models/download/progress:
    get:
      operationId: getDownloadProgress
      responses:
        '200':
          description: Download state keyed by destination filename
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: '#/components/schemas/DownloadProgress' }
  /v1/models/download/cancel:
    post:
      operationId: cancelDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name]
              properties: { file_name: { type: string } }
      responses:
        '200':
          description: Cancellation result
          content:
            application/json:
              schema:
                type: object
                required: [success, cancelled]
                properties:
                  success: { type: boolean }
                  cancelled: { type: boolean }
                  message: { type: string }
  /v1/models/download/discard:
    post:
      operationId: discardDownload
      description: Discard an inactive failed, cancelled or interrupted GGUF download and its exact temporary files. Installed artifacts are preserved. Requires model management permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file_name]
              properties: { file_name: { type: string } }
      responses:
        '200':
          description: Partial data and saved entry removed, or entry already absent
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: { success: { type: boolean } }
        '409':
          description: Download is active or is not discardable
        '500':
          description: Partial file or history removal failed; retry is safe
  /v1/models/delete:
    delete:
      operationId: deleteModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id]
              properties: { model_id: { type: string } }
      responses:
        '200':
          description: Model deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: { success: { type: boolean }, message: { type: string } }
  /v1/models/verify:
    get:
      operationId: verifyModel
      parameters:
        - in: query
          name: model
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Full-file SHA-256 result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
  /v1/sessions:
    get:
      operationId: listSessions
      description: Lists owned conversations; sessions:all administrators and local single-user mode can also access unowned legacy conversations.
      responses:
        '200':
          description: Durable conversations
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/ChatSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSession
      description: Creates a conversation owned by the authenticated caller. Names are installation-wide unique; an existing name returns 409 without overwriting history. Client-supplied ownership is ignored. Services advertising session-history-seed-v1 accept optional completed user/assistant history atomically, without executing inference or importing task authority. History is limited to 1024 messages, 8 MiB text and 12 MiB encoded images; the whole body is limited to 32 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                model_id: { type: string }
                history:
                  type: array
                  maxItems: 1024
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
                      images:
                        type: array
                        maxItems: 4
                        items: { $ref: '#/components/schemas/SessionImage' }
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}:
    parameters:
      - $ref: '#/components/parameters/SessionName'
    get:
      operationId: getSession
      description: Returns 404 for an absent conversation or one owned by another user unless the caller has sessions:all.
      responses:
        '200':
          description: Durable conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSession
      description: Requires ownership or sessions:all; other users' conversations return 404. Linked agent work requires ownership. Active linked work requires an explicit retain or stop choice; stop waits for confirmed quiescence and never resolves uncertain effects. Canonical jobs and minimal deduplication records survive deletion. Plain generation still returns 409 while active.
      parameters:
        - { name: work, in: query, schema: { type: string, enum: [retain, stop] }, description: Retain linked jobs in the inspector or request stopping before deletion. }
        - { name: canonical_id, in: query, schema: { type: string }, description: Explicit migrated conversation identity. Required with revision to delete a canonical conversation; legacy writers remain fenced. }
        - { name: revision, in: query, schema: { type: integer, minimum: 1 }, description: Current canonical conversation revision. Concurrent changes return 409. A repeated deletion with the same identity finishes retained file cleanup. }
      responses:
        '200':
          description: Conversation deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: { success: { type: boolean }, message: { type: string }, work_retained: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/attachments:
    parameters:
      - $ref: '#/components/parameters/SessionName'
    get:
      operationId: listSessionAttachments
      description: Owner-scoped source metadata only. Does not return extracted text or publish files to Knowledge.
      responses:
        '200':
          description: Retained conversation files
          content:
            application/json:
              schema:
                type: object
                required: [attachments]
                properties:
                  attachments: { type: array, items: { $ref: '#/components/schemas/SessionAttachment' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: uploadSessionAttachment
      parameters:
        - { name: ocr_language, in: query, schema: { type: string }, description: 'Ordered pinned pack IDs joined by +, up to three; encode + as %2B in URLs. Single selection requires document-ocr-language-selection-v1; mixed selection requires document-ocr-mixed-languages-v1. Retained across prepare retries.' }
      description: Uploads and prepares a private source. Up to eight files, 50 MiB per file, 100 MiB per conversation and 500 MiB per owner. Failed extraction retains the original and returns its attachment identity with an error. No automatic Knowledge publication, model download or filesystem grant.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Prepared attachment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionAttachmentResult' }
        '422':
          description: Extraction failed; any accepted original is retained under the returned identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionAttachmentResult' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503':
          description: Reader queue is full or its wait expired (document_busy); the returned source is retained for explicit retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionAttachmentResult' }
  /v1/sessions/{name}/attachments/{attachment_id}:
    parameters:
      - $ref: '#/components/parameters/SessionName'
      - { name: attachment_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteSessionAttachment
      description: Deletes an unused source. Saved-history references or an active turn return 409. Removing a draft chip is a separate client action and must not delete a history source.
      responses:
        '200':
          description: Source removed
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties: { removed: { type: boolean } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/attachments/{attachment_id}/prepare:
    parameters:
      - $ref: '#/components/parameters/SessionName'
      - { name: attachment_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: prepareSessionAttachment
      parameters:
        - { name: text_only, in: query, schema: { type: boolean, default: false }, description: Explicitly accept available native text with unread image content disclosed. Does not certify full extraction. }
      description: Retry extraction from the retained digest-verified original. Ready revisions are immutable. Does not generate an answer.
      responses:
        '200':
          description: Prepared attachment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionAttachmentResult' }
        '422':
          description: Source unavailable or extraction failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionAttachmentResult' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503':
          description: Reader queue is full or its wait expired (document_busy); original bytes remain unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionAttachmentResult' }
  /v1/sessions/{name}/attachments/{attachment_id}/preview:
    parameters:
      - { name: revision, in: query, schema: { type: string, pattern: '^[a-f0-9]{64}$' }, description: Pin retained attachment text to this published revision. Images remain the immutable original. Omit to inspect the current revision. }
      - $ref: '#/components/parameters/SessionName'
      - { name: attachment_id, in: path, required: true, schema: { type: string } }
      - { name: sha256, in: query, schema: { type: string }, description: Expected original digest; mismatch rejects delivery. }
      - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000 }, description: Render a PDF page or single PNG/JPEG image (page 1) as PNG; omit for source units with retained OCR text. }
      - { name: thumbnail, in: query, schema: { type: boolean }, description: With page, return a bounded 192 by 256 pixel PNG preview with source identity. Never runs OCR. }
    get:
      operationId: getSessionAttachmentPreview
      description: Read-only owner-scoped local preview, including partial native text. Never indexes, downloads language data or generates an answer.
      responses:
        '200':
          description: Source units or bounded PDF/image page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentPreview' }
            image/png:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/attachments/{attachment_id}/passage:
    parameters:
      - $ref: '#/components/parameters/SessionName'
      - { name: attachment_id, in: path, required: true, schema: { type: string } }
      - { name: revision, in: query, required: true, schema: { type: string } }
      - { name: start, in: query, required: true, schema: { type: integer, minimum: 0 } }
      - { name: end, in: query, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getSessionAttachmentPassage
      description: Owner-scoped exact UTF-8 passage from a pinned extraction revision, after original digest verification. Maximum 256 KiB. Does not infer a page number or verify a model claim.
      responses:
        '200':
          description: Exact retained passage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentPassage' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/attachments/{attachment_id}/structure:
    parameters:
      - $ref: '#/components/parameters/SessionName'
      - { name: attachment_id, in: path, required: true, schema: { type: string } }
      - { name: revision, in: query, required: true, schema: { type: string, maxLength: 128 }, description: Pinned attachment revision, distinct from the structured extraction revision returned in the response. }
      - { name: unit, in: query, schema: { type: string, maxLength: 128 } }
      - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 200000 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      - { name: relationship_offset, in: query, schema: { type: integer, minimum: 0, maximum: 400000 } }
      - { name: navigation_offset, in: query, schema: { type: integer, minimum: 0, maximum: 200000 } }
      - { name: corrections, in: query, schema: { type: boolean }, description: Explicitly request owner editing controls for the current revision. Historical revisions remain read-only. }
    get:
      operationId: getSessionAttachmentStructure
      description: Owner-scoped, digest-verified structured inspection of the retained private source. Read-only by default; corrections=true exposes editing only to the owner for the current revision. Does not reparse or publish to Knowledge. Legacy sources without retained structure return unavailable. Response is no-store.
      responses:
        '200':
          description: Bounded immutable block and relationship page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentStructurePage' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/attachments/{attachment_id}/corrections:
    parameters:
      - $ref: '#/components/parameters/SessionName'
      - { name: attachment_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: correctSessionAttachment
      description: Owner-only correction; publishes a derived revision while preserving originals and historical citations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, extraction_revision, edits]
              properties:
                expected_revision: { type: string, pattern: '^[a-f0-9]{64}$' }
                extraction_revision: { type: string, maxLength: 128 }
                edits:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: object
                    required: [block_id, expected_text_sha256, text]
                    properties:
                      block_id: { type: string }
                      expected_text_sha256: { type: string }
                      text: { type: string }
      responses:
        '200':
          description: Published correction receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionAttachmentResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/attachments/{attachment_id}/revisions:
    parameters:
      - $ref: '#/components/parameters/SessionName'
      - { name: attachment_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSessionAttachmentRevisions
      description: Bounded revision metadata under current source access, newest first.
      responses:
        '200':
          description: Retained revision history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentRevisionHistory' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/attachments/{attachment_id}/original:
    parameters:
      - $ref: '#/components/parameters/SessionName'
      - { name: attachment_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSessionAttachmentOriginal
      description: Owner-scoped digest-verified original, delivered as a download with no-store and nosniff headers.
      responses:
        '200':
          description: Original bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/generate:
    parameters:
      - $ref: '#/components/parameters/SessionName'
    post:
      operationId: generateSessionTurn
      description: Requires session ownership (or sessions:all) and chat permission. Requested knowledge additionally requires rag permission. Without agent, existing JSON or stream behavior is unchanged; stream=true sends phase/delta then persisted done or error. With agent, requires exact ownership, pins the profile and restrictions, and returns 202 JSON with one linked canonical job regardless of stream. A stable request_id is required; retry identical input to retrieve the same job. Agent selection grants no access. Observe job events through the turn events endpoint; reconnect never resumes work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, description: Text is optional when images or files are attached; at most 64 KiB. }
                attachments: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/SessionAttachmentReference' }, description: Ordinary durable streaming only. References are owner-scoped and revision-bound; never silently omitted or granted tool authority. }
                images: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/SessionImage' }, description: Ordinary durable streaming only. Local vision model required; never silently discarded or used by agents. }
                model_id: { type: string }
                use_knowledge_base: { type: boolean, default: false }
                knowledge_documents: { type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 }, description: Optional explicit retrieval scope. Requires Knowledge enabled; unavailable sources fail without broader fallback. Agent turns may only narrow attached profile documents. }
                stream: { type: boolean, default: false }
                durable: { type: boolean, default: false, description: Persist admission and run independently of the stream connection. Reconnect using the turn endpoints. }
                request_id: { type: string, maxLength: 128, description: Required for durable streaming or agent selection (8–128 characters for agent turns). Identical agent retries retrieve the canonical job; different payload or deleted-history reuse returns 409. }
                agent: { $ref: '#/components/schemas/AgentSelection' }
                execution: { $ref: '#/components/schemas/ExecutionReference' }
                execution_request_version: { type: integer, enum: [1], description: Opt into requesting client-approved workspace access on the same job only when needed. This is not a grant. }
                restrictions: { $ref: '#/components/schemas/AgentResourceRestrictions' }
                computer_scope: { type: string, enum: [desktop], description: Optional on-demand desktop availability, not a grant. Requires an explicit approval policy. }
                computer_approval_mode: { type: string, enum: [ask_every_time, scoped_changes, full_task], description: Proposed action policy only; existing host consent remains required. }
                profile: { type: string, enum: [interactive, extended], default: interactive, description: Streaming chat context profile. Interactive uses min(OFFGRID_CHAT_CONTEXT, effective service context); extended uses the service context. History is not truncated. }
                max_tokens: { type: integer, minimum: 1, maximum: 4096, default: 1024, description: Streaming response token budget. }
      responses:
        '200':
          description: Complete persisted turn as JSON, or SSE events ending with persisted done or error
          content:
            text/event-stream:
              description: Each SSE data field is a SessionStreamEvent JSON object. Heartbeat comments carry no data.
              x-event-schema: { $ref: '#/components/schemas/SessionStreamEvent' }
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [session, message]
                properties:
                  session: { $ref: '#/components/schemas/ChatSession' }
                  message: { $ref: '#/components/schemas/SessionMessage' }
        '202':
          description: Profile turn durably associated with its canonical job. Pending, interrupted and terminal retries never create a second job.
          headers:
            Location: { schema: { type: string }, description: Canonical jobs API URL. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkedAgentTurn' }
        '409': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/turn:
    parameters:
      - $ref: '#/components/parameters/SessionName'
    get:
      operationId: getSessionTurn
      responses:
        '200':
          description: Latest saved turn, or null. Restarted work is interrupted, never automatically replayed.
          content:
            application/json:
              schema:
                type: object
                required: [turn]
                properties:
                  turn:
                    anyOf:
                      - $ref: '#/components/schemas/SessionTurn'
                      - type: 'null'
                  job: { $ref: '#/components/schemas/AgentRunResponse' }
                  recovery_required: { type: boolean, description: Bookkeeping or saved-result attachment needs explicit recovery; never a request to rerun work. }
        '404': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/turn/events:
    parameters:
      - $ref: '#/components/parameters/SessionName'
      - { name: id, in: query, required: true, schema: { type: string } }
    get:
      operationId: followSessionTurn
      description: Observation only. Plain turns replay partial output and live deltas. Linked agent turns use the canonical jobs event protocol (snapshot/activity/done); inspect job_id to choose the protocol. Slow/disconnected readers do not control execution. Replayed snapshots replace previous state, never append duplicate output.
      responses:
        '200':
          description: Session phase/delta/done/error SSE stream
          content:
            text/event-stream:
              schema: { type: string }
        '409': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/turn/cancel:
    parameters:
      - $ref: '#/components/parameters/SessionName'
    post:
      operationId: cancelSessionTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties: { id: { type: string } }
      responses:
        '200': { description: Cancellation requested for this exact turn. Refresh for terminal state. }
        '409': { $ref: '#/components/responses/Error' }
  /v1/document-ocr-languages:
    get:
      operationId: getChatOCRLanguages
      description: Read-only OCR readiness for authenticated Chat users. No pack installation or document content access.
      responses:
        '200':
          description: Pinned language catalog, installation states and explicit unsupported interface locales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OCRLanguageReadiness' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/documents/ocr-languages:
    get:
      operationId: getOCRLanguages
      description: Requires Knowledge read permission. Reports reviewed offline OCR language packs independently of runtime qualification; never returns filesystem paths or pack bytes.
      responses:
        '200':
          description: Language installation and document runtime states
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OCRLanguageReadiness' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: importOCRLanguage
      description: Requires Knowledge management permission. Explicitly imports up to 32 MiB of pinned language data into this service workspace. No downloads, executable code, inference or automatic reindexing. Only a supported digest is accepted, and active imports retain their immutable snapshot.
      parameters:
        - { name: language, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 33554432 }
      responses:
        '200':
          description: Verified durable installation; qualification remains separate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OCRLanguageReadiness' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/documents/imports:
    get:
      operationId: getDocumentImports
      description: Requires Knowledge management permission. Without id returns the most recent 100 imports owned by the authenticated actor; with id returns that actor's exact record. Never returns original bytes. Restart marks in-flight imports interrupted without replay.
      parameters:
        - { name: id, in: query, schema: { type: string } }
        - { name: view, in: query, description: With id, extraction returns owner-scoped partial document pages for review only. Never indexes or resumes work., schema: { type: string, enum: [extraction] } }
      responses:
        '200':
          description: Saved import or recent import list
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/DocumentImport' }
                  - { $ref: '#/components/schemas/DocumentImportExtraction' }
                  - type: object
                    required: [imports]
                    properties:
                      imports: { type: array, items: { $ref: '#/components/schemas/DocumentImport' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: prepareDocumentImport
      description: Without id, accept and retain a bounded multipart upload before extraction; returns 202 without starting a worker. Reusing an Idempotency-Key with the same actor/name/bytes returns the same record, changed bytes conflict. With id and action=retry, process the retained source synchronously with durable progress; action=cancel invalidates pending publication. A completed retry returns saved success without replay. Request cancellation retains progress and original bytes for explicit recovery.
      parameters:
        - { name: ocr_language, in: query, schema: { type: string }, description: Explicit pinned pack ID on initial acceptance only; retries retain the saved selection. }
        - { name: collection_id, in: query, schema: { type: string }, description: Explicit destination on acceptance. Requires collection_revision. Mandatory for JSON attachment publication; omission retains legacy workspace behavior only for multipart uploads. New clients use /v1/collections/imports. }
        - { name: collection_revision, in: query, schema: { type: integer, minimum: 1 }, description: Reviewed destination audience; checked at acceptance and publication. }
        - { name: id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string, enum: [retry, cancel] } }
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128 } }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentAttachmentImport'
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Original durably accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentImport' }
        '200':
          description: Import processed or cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentImport' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { description: Reader/import queue unavailable (document_busy) or packaged reader unavailable. Inspect saved state; no automatic replay., $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '426': { description: Attachment publication requires destination audience review (collection_review_required). Upgrade the client; do not fall back to shared publication., $ref: '#/components/responses/Error' }
    delete:
      operationId: removeDocumentImport
      description: Remove the actor's import record and pending original, invalidating in-flight publication. Does not delete an already published Knowledge document or backups.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Import record removed
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/documents/retention:
    get:
      operationId: getDocumentRetention
      description: Requires Knowledge read access and current document visibility. Returns no-store, revision-bound retention metadata.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
      responses:
        '200':
          description: Current retention policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRetention' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: setDocumentRetention
      description: Requires Knowledge management permission and private collection ownership. Both expiry and legal hold must be explicit. Old revisions conflict. No expiry is assigned to legacy documents. The service processes up to 100 eligible documents per minute; held documents are retained. Backups and saved answers have separate retention.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 256 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRetention' }
      responses:
        '200':
          description: Updated retention policy with incremented revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRetention' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/document-analyses:
    post:
      operationId: createDocumentAnalysis
      description: Creates an owner-private durable comparison of two exact Knowledge extraction revisions. Requires Knowledge read permission and current access to both sources. No model or embedding download is needed. Other analysis workflows return 501 in this build. Reuse request_key only with identical ordered sources; inspect status after an uncertain response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_key, workflow, sources]
              properties:
                request_key: { type: string, minLength: 1, maxLength: 128 }
                workflow: { type: string, enum: [comparison] }
                sources: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/AnalysisSourceRef' } }
      responses:
        '202':
          description: Durable job accepted or its existing status returned; completion is separate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentAnalysis' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: getDocumentAnalysis
      description: With id, return owner-private status and source-unit accounting under current access to every source. Without id, list bounded owner-private history, omitting jobs with inaccessible sources. Refresh pagination after concurrent additions or deletions. Complete means retained text/cell traversal finished without recorded extraction gaps; it does not certify visual or semantic interpretation.
      parameters:
        - { name: id, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 256, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
      responses:
        '200':
          description: Current durable status
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/DocumentAnalysis' }
                  - { $ref: '#/components/schemas/DocumentAnalysisHistory' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/document-analyses/results:
    get:
      operationId: getDocumentAnalysisResults
      description: Bounded deterministic differences for one committed unit pair. Interrupted work may expose completed checkpoints with its incomplete job status. Source access is rechecked. Repeated or unmatched text is represented as removals/additions, not guessed semantic equivalence.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: step, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 400000, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200':
          description: One page of committed differences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentAnalysisResults' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/document-analyses/source:
    get:
      operationId: getDocumentAnalysisSource
      description: Opens a server-retained change citation under current access to both documents. Validates revision, unit, block, UTF-8 range and SHA-256. Returns at most 256 KiB of text with explicit truncation; formulas and external references are never executed.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: step, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: change, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 400000 } }
        - { name: side, in: query, required: true, schema: { type: string, enum: [before, after] } }
      responses:
        '200':
          description: Verified retained source text and optional native cell metadata
          content:
            application/json:
              schema:
                type: object
                required: [analysis_id, document_id, citation, text, truncated]
                properties:
                  analysis_id: { type: string }
                  document_id: { type: string }
                  citation: { $ref: '#/components/schemas/AnalysisCitation' }
                  text: { type: string }
                  truncated: { type: boolean }
                  cell: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/document-analyses/export:
    get:
      operationId: exportDocumentAnalysis
      tags: [Knowledge]
      summary: Export a finished comparison with exact evidence and coverage
      description: >-
        Requires current access to both pinned sources and ownership of the job.
        Returns an all-or-nothing UTF-8 artifact, limited to 8 MiB, with its SHA-256.
        JSON is an ordered array of typed records; CSV includes explicit evidence
        columns and exact metadata JSON; Markdown uses inert fenced source text.
        All source pairs, changes, unresolved gaps and revision references are
        retained. Incomplete extraction remains incomplete. CSV formula-like
        display cells are apostrophe-prefixed; metadata_json retains exact text.
        Exported copies have separate retention and cannot be recalled by source
        deletion or access revocation. A content-free preparation event is audited;
        it does not prove the client saved a file. No inference model is invoked.
      parameters:
        - {name: id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: format, in: query, required: true, schema: {type: string, enum: [json, csv, markdown]}}
      responses:
        '200':
          description: Verified export artifact; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [analysis_id, format, content, sha256]
                properties:
                  analysis_id: {type: string}
                  format: {type: string, enum: [json, csv, markdown]}
                  content: {type: string, description: Complete UTF-8 artifact, at most 8 MiB}
                  sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        '400': {description: Invalid ID or format}
        '404': {description: Job or current source access unavailable}
        '409': {description: Comparison traversal has not finished}
        '429': {description: Export concurrency or artifact size limit}
        '503': {description: Export could not be prepared}
  /v1/document-analyses/synthesis/export:
    get:
      operationId: exportDocumentSynthesis
      tags: [Knowledge]
      summary: Export draft summary or requirements candidates for review
      description: >-
        Requires current access to all pinned sources and ownership of the job.
        Returns an all-or-nothing UTF-8 artifact, limited to 8 MiB, with its SHA-256.
        JSON is an ordered array of typed records; CSV includes explicit evidence
        columns and exact metadata JSON; Markdown uses inert fenced source text.
        All source units, candidates, conditions, exceptions and gaps are
        retained. Exact citations do not certify model claims. Human review decisions
        and attribution are included separately from model verification. CSV formula-like
        display cells are apostrophe-prefixed; metadata_json retains exact text.
        Exported copies have separate retention and cannot be recalled by source
        deletion or access revocation. A content-free preparation event is audited;
        it does not prove the client saved a file. No inference model is invoked.
      parameters:
        - {name: id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: format, in: query, required: true, schema: {type: string, enum: [json, csv, markdown]}}
      responses:
        '200':
          description: Verified export artifact; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [analysis_id, format, content, sha256]
                properties:
                  analysis_id: {type: string}
                  format: {type: string, enum: [json, csv, markdown]}
                  content: {type: string, description: Complete UTF-8 artifact, at most 8 MiB}
                  sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        '400': {description: Invalid ID or format}
        '404': {description: Job or current source access unavailable}
        '409': {description: Candidate traversal has not finished}
        '429': {description: Export concurrency or artifact size limit}
        '503': {description: Export could not be prepared}
  /v1/document-analyses/synthesis/review:
    get:
      operationId: getDocumentSynthesisReview
      tags: [Knowledge]
      summary: Read the latest human review of a pinned draft section
      parameters:
        - {name: id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: batch, in: query, required: true, schema: {type: integer, minimum: 0, maximum: 100000}}
        - {name: revision, in: query, schema: {type: integer, minimum: 0, maximum: 256, default: 0}, description: Zero selects the latest review; a positive value selects an immutable historical review}
      responses:
        '200':
          description: Current review or revision zero with unreviewed decisions; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SynthesisReview'}
        '404': {description: Private analysis or current source access unavailable}
    post:
      operationId: saveDocumentSynthesisReview
      tags: [Knowledge]
      summary: Append a human review revision without changing model output
      description: >-
        Requires the private analysis owner and current access to all sources.
        Pins batch identity and response digest. expected_revision provides optimistic
        concurrency; zero is an unreviewed section. Checked sections require a keep
        or exclude decision for every candidate. Notes are limited to 2048 UTF-8
        bytes each. At most 256 revisions per section and 8 MiB per job are retained.
        Records the authenticated author and time. Review does not certify complete
        extraction or independent semantic accuracy. Read after an uncertain write;
        do not automatically replay. History follows source retention and holds.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SynthesisReviewRequest'}
      responses:
        '200':
          description: Saved review; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SynthesisReview'}
        '400': {description: Invalid decision or pinned identity}
        '404': {description: Private analysis or source access unavailable}
        '409': {description: Stale review revision or unfinished traversal}
        '429': {description: Review storage limit reached}
  /v1/document-analyses/synthesis/compositions:
    get:
      operationId: getDocumentCompositions
      summary: Read private composition status or paginated history for one analysis
      parameters:
        - {name: id, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: analysis_id, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Status when id is supplied, otherwise history for analysis_id; no-store
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/DocumentComposition'}
                  - {$ref: '#/components/schemas/DocumentCompositionHistory'}
        '404': {description: Private analysis or current source access unavailable}
    post:
      operationId: createDocumentComposition
      summary: Compose a summary from pinned section drafts and human review revisions
      description: >-
        Summary analyses only. Explicit installed local model and language. No tools,
        remote services or downloads. Current source access is checked before preparation
        and at every checkpoint. Excluded candidates are never model inputs. Durable
        bounded merges preserve original-source links and omitted-input gaps. New prose
        requires semantic review; input review decisions do not approve it. An owner-scoped
        request_key is idempotent. After an uncertain write inspect history before retrying.
        Changed reviews stop further merges; completed historical reports remain readable
        with reviews_current false. Source deletion and legal holds cover derived reports.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentCompositionRequest'}
      responses:
        '202':
          description: Authenticated bounded response; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentComposition'}
        '400': {description: Invalid input}
        '404': {description: Private analysis or current source access unavailable}
        '409': {description: Unfinished traversal, changed reviews or stale state}
        '429': {description: Capacity limit}
  /v1/document-analyses/synthesis/compositions/export:
    get:
      operationId: exportDocumentComposition
      summary: Export a bounded draft summary with original candidates, review snapshots and gaps
      parameters:
        - {name: id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: format, in: query, required: true, schema: {type: string, enum: [json, csv, markdown]}}
      responses:
        '200':
          description: At most 8 MiB of content with SHA-256; source access rechecked; export audit recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentAnalysisExport'}
        '404': {description: Private analysis or current source access unavailable}
        '409': {description: Composition not finished}
        '429': {description: Export size or concurrency limit}
  /v1/document-analyses/synthesis/compositions/report:
    get:
      operationId: getDocumentCompositionReport
      summary: Read a bounded draft report with coverage gaps
      parameters:
        - {name: id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        '200':
          description: Authenticated bounded response; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentCompositionReport'}
        '400': {description: Invalid input}
        '404': {description: Private analysis or current source access unavailable}
        '409': {description: Unfinished traversal, changed reviews or stale state}
        '429': {description: Capacity limit}
  /v1/document-analyses/synthesis/compositions/evidence:
    get:
      operationId: getDocumentCompositionEvidence
      summary: Read up to eight original-source candidates for a composed section
      parameters:
        - {name: id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: section, in: query, required: true, schema: {type: integer, minimum: 0}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Authenticated bounded response; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentCompositionEvidence'}
        '400': {description: Invalid input}
        '404': {description: Private analysis or current source access unavailable}
        '409': {description: Unfinished traversal, changed reviews or stale state}
        '429': {description: Capacity limit}
  /v1/document-analyses/synthesis/compositions/cancel:
    post:
      operationId: cancelDocumentComposition
      summary: Cancel private work, including after source revocation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentAnalysisControl'}
      responses:
        '200':
          description: Authenticated bounded response; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentAnalysisAccepted'}
        '400': {description: Invalid input}
        '404': {description: Private analysis or current source access unavailable}
        '409': {description: Unfinished traversal, changed reviews or stale state}
        '429': {description: Capacity limit}
  /v1/document-analyses/synthesis/compositions/retry:
    post:
      operationId: retryDocumentComposition
      summary: Resume the first uncommitted merge with the same pinned model and reviews
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentAnalysisControl'}
      responses:
        '200':
          description: Authenticated bounded response; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentAnalysisAccepted'}
        '400': {description: Invalid input}
        '404': {description: Private analysis or current source access unavailable}
        '409': {description: Unfinished traversal, changed reviews or stale state}
        '429': {description: Capacity limit}
  /v1/document-analyses/cancel:
    post:
      operationId: cancelDocumentAnalysis
      description: Stops the owner's job without deleting committed evidence. An owner may cancel after losing source access; no source details are returned. Repeated cancellation is harmless.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentAnalysisControl' }
      responses:
        '200':
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentAnalysisAccepted' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/document-analyses/retry:
    post:
      operationId: retryDocumentAnalysis
      description: Resumes queued, interrupted, failed or cancelled work after its last committed unit checkpoint. Current access to every source is required. Never replays completed jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentAnalysisControl' }
      responses:
        '200':
          description: Resume accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentAnalysisAccepted' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/documents/structure:
    get:
      operationId: getDocumentStructure
      description: Read a verified immutable extraction under current collection access. Pin revision while paginating. Text and metadata are bounded and omissions explicit. Does not run extraction or download dependencies.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, maxLength: 256 } }
        - { name: revision, in: query, schema: { type: string, maxLength: 128 } }
        - { name: unit, in: query, schema: { type: string, maxLength: 128 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 200000, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: relationship_offset, in: query, schema: { type: integer, minimum: 0, maximum: 400000, default: 0 } }
        - { name: navigation_offset, in: query, schema: { type: integer, minimum: 0, maximum: 200000, default: 0 } }
      responses:
        '200':
          description: Revision-pinned block page; relationship pagination refers to links touching this block page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentStructurePage' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/documents/corrections:
    post:
      operationId: correctDocumentExtraction
      description: Requires Knowledge management and collection write access. Publishes an attributed child revision and replacement index atomically. Original bytes and older citations remain unchanged. Reuses embeddings only for identical text under the configured index identity. Author comes from authentication. Do not retry automatically after an unknown outcome; inspect the active revision first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [document_id, expected_revision, edits]
              properties:
                document_id: { type: string, minLength: 1, maxLength: 256 }
                expected_revision: { type: string, minLength: 1, maxLength: 128 }
                edits:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: object
                    additionalProperties: false
                    required: [block_id, expected_text_sha256, text]
                    properties:
                      block_id: { type: string }
                      expected_text_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                      text: { type: string, description: Complete replacement for a leaf block. Parent edits cannot remove linked evidence. Request body is limited to 2 MiB. }
      responses:
        '200':
          description: New extraction and index published
          content:
            application/json:
              schema:
                type: object
                required: [success, document]
                properties:
                  success: { type: boolean }
                  document: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/documents/source:
    get:
      operationId: getDocumentSource
      description: Requires knowledge read permission. Defaults to retained extracted text. format=original downloads the digest-verified uploaded bytes when retained. Available while inference is disabled. Legacy records never fabricate an original.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [text, original, preview], default: text } }
        - { name: sha256, in: query, schema: { type: string }, description: Expected original digest for preview requests. }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000 }, description: PDF page or PNG/JPEG image (page 1) for format=preview; omit for source units. }
        - { name: thumbnail, in: query, schema: { type: boolean }, description: With page and format=preview, return a bounded 192 by 256 pixel PNG preview with source identity. Never runs OCR. }
        - { name: start_byte, in: query, description: UTF-8 byte offset of a saved citation. Supply all five citation fields together; text format only., schema: { type: integer, minimum: 0 } }
        - { name: end_byte, in: query, description: Exclusive UTF-8 byte offset. Passage size is at most 800000 bytes., schema: { type: integer, minimum: 1 } }
        - { name: source_sha256, in: query, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
        - { name: extractor_revision, in: query, schema: { type: string, minLength: 1, maxLength: 512 } }
        - { name: content_hash, in: query, description: Saved passage content hash (first 16 bytes of SHA-256, hex encoded)., schema: { type: string, pattern: '^[a-f0-9]{32}$' } }
      responses:
        '200':
          description: Safe text preview (maximum 200000 Unicode characters), or the retained original as an attachment
          headers:
            X-OffGrid-Source-SHA256:
              description: SHA-256 of the exact original bytes; present only for format=original
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DocumentPreview'
                  - type: object
                    required: [document, content, truncated]
                    properties:
                      document: { $ref: '#/components/schemas/Document' }
                      content: { type: string }
                      truncated: { type: boolean }
                      citation_verified: { type: boolean, description: Present and true only after exact passage, source digest and extractor revision validation. }
            image/png:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      description: Requested knowledge requires rag permission in addition to chat. Disabled/failed retrieval returns 503 and no matching evidence returns 422 before inference or streaming begins. Turn off use_knowledge_base explicitly to request an ordinary answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: OpenAI-compatible non-streaming response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/document-analyses/synthesis:
    get:
      operationId: getDocumentSynthesis
      description: Read an owner-private candidate analysis, or history without id. Current source membership is checked; completed traversal remains awaiting_review, not an approved answer.
      parameters:
        - { name: id, in: query, schema: { type: string, maxLength: 128 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 256 } }
      responses:
        '200':
          description: Candidate job or authorized history
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/DocumentSynthesis' }
                  - { $ref: '#/components/schemas/DocumentSynthesisHistory' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createDocumentSynthesis
      description: Explicit local-model candidate summary or requirements traversal. Requires Chat and Knowledge permissions. No downloads or tools; immutable model/runtime identity, current source access, exact prompt counting and durable batch receipts. Semantic support and full-document qualification are separate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_key, workflow, sources, model, language]
              properties:
                request_key: { type: string, minLength: 1, maxLength: 128 }
                workflow: { type: string, enum: [summary, requirements] }
                sources: { type: array, minItems: 1, maxItems: 16, items: { $ref: '#/components/schemas/AnalysisSourceRef' } }
                model: { type: string, minLength: 1, maxLength: 256 }
                language: { type: string, pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8}){0,2}$' }
      responses:
        '202':
          description: Accepted candidate traversal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSynthesis' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/document-analyses/synthesis/results:
    get:
      operationId: getDocumentSynthesisResults
      description: At most two validated batch receipts. Raw model responses are private and never returned. Source quote identity is checked, not semantic entailment.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000 } }
      responses:
        '200':
          description: Candidate sections with exact source quotes and disclosed gaps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSynthesisResults' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/document-analyses/synthesis/retry:
    post:
      operationId: retryDocumentSynthesis
      description: Explicitly resume from the last committed batch with the original model identity. Cancel uses the existing document-analyses/cancel endpoint. No automatic inference replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties: { id: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { type: object, required: [accepted], properties: { accepted: { type: boolean, const: true } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/collections:
    get:
      operationId: getCollections
      description: List readable collections, read one policy, or page its owner-only audit. Global administrative permission does not grant private membership.
      parameters:
        - { name: id, in: query, schema: { type: string } }
        - { name: view, in: query, schema: { type: string, enum: [audit] } }
        - { name: after, in: query, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: Current authorized policies or at most 100 audit events after the given sequence
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/KnowledgeCollection' }
                  - type: object
                    required: [collections]
                    properties:
                      collections: { type: array, maxItems: 1024, items: { $ref: '#/components/schemas/KnowledgeCollection' } }
                  - type: object
                    required: [events]
                    properties:
                      events: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CollectionAuditEvent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCollection
      description: Create a private collection owned by the authenticated actor. Sharing is a separate revision-checked update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties: { name: { type: string, minLength: 1, maxLength: 256 } }
      responses:
        '201':
          description: Private collection created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeCollection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateCollection
      description: Owner-only replacement of name and membership. Both member lists must be explicit; stale revisions never retry automatically. The legacy workspace collection is immutable.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionUpdate' }
      responses:
        '200':
          description: Updated policy, committed atomically with its audit entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeCollection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/collections/imports:
    post:
      operationId: acceptCollectionImport
      description: Accept an original into an explicitly reviewed collection. This distinct route prevents older services silently importing into the shared workspace. Never fall back to the legacy import route. Retry processing through the returned durable import identity.
      parameters:
        - { name: ocr_language, in: query, schema: { type: string }, description: 'Ordered pinned pack IDs joined by +, up to three; encode + as %2B in URLs. Single selection requires document-ocr-language-selection-v1; mixed selection requires document-ocr-mixed-languages-v1.' }
        - { name: collection_id, in: query, required: true, schema: { type: string } }
        - { name: collection_revision, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentAttachmentImport' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        '202':
          description: Original retained under the reviewed audience; extraction has not started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentImport' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/documents/collection:
    get:
      operationId: getDocumentCollection
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Current binding and audience policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentCollection' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: moveDocumentCollection
      description: Move a document using the reviewed binding and both audience revisions. A private source requires its collection owner; the destination requires write access. No source bytes or extraction revisions change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionMove' }
      responses:
        '200':
          description: Confirmed document binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentCollection' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/documents:
    get:
      operationId: listDocuments
      responses:
        '200':
          description: Indexed documents
          content:
            application/json:
              schema:
                type: object
                required: [documents, count]
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                  count: { type: integer }
        '503': { $ref: '#/components/responses/Error' }
  /v1/rag/status:
    get:
      operationId: getRAGStatus
      description: Remains available when knowledge storage fails; reports enabled false and stats.storage_available false with an actionable error. No volatile fallback is used.
      responses:
        '200':
          description: Retrieval readiness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RAGStatus' }
  /v1/rag/enable:
    post:
      operationId: enableRAG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [embedding_model]
              properties: { embedding_model: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Knowledge retrieval enabled and activation persisted
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: { success: { type: boolean }, message: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/documents/ingest:
    post:
      operationId: ingestDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        '200':
          description: Document indexed
          content:
            application/json:
              schema:
                type: object
                required: [success, document]
                properties: { success: { type: boolean }, document: { $ref: '#/components/schemas/Document' } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/documents/reindex:
    post:
      operationId: reindexDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id]
              properties: { document_id: { type: string } }
      responses:
        '200':
          description: Document reindexed
          content:
            application/json:
              schema:
                type: object
                required: [success, document]
                properties: { success: { type: boolean }, document: { $ref: '#/components/schemas/Document' } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/agents/run:
    post:
      operationId: runAgent
      description: Starts a checkpointed run. Use async for a background task and poll by run ID. New runs cannot contain preapproved tools; approve the pending call on its existing run instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRunRequest' }
      responses:
        '200':
          description: Governed agent run status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '202':
          description: Persisted background run accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/agents/tasks:
    get:
      operationId: listAgentTasks
      responses:
        '200':
          description: Durable agent task states
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AgentTask' } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/agents/tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getAgentRun
      responses:
        '200':
          description: Authoritative run snapshot, including pending approval or uncertain tool call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAgentRun
      description: Owner-only removal of completed, failed or cancelled history. Active workers, pending approvals, interrupted and uncertain outcomes return 409. A durable scrubbed tombstone prevents event projections restoring history. Separate audit logs, backups and tool-created files are not erased.
      responses:
        '200':
          description: Removed from task and activity history
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: { success: { type: boolean } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/agent-schedules:
    get:
      operationId: listAgentSchedules
      responses:
        '200':
          description: Owned reviewed policies; inspection never dispatches work
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules: { type: array, items: { $ref: '#/components/schemas/AgentSchedule' } }
    post:
      operationId: createAgentSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentScheduleWrite' }
      responses:
        '201':
          description: Future policy saved with exact resources; no job created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSchedule' }
  /api/v2/agent-schedules/preview:
    get:
      operationId: previewAgentScheduleCalendar
      description: Read-only calendar projection from the service clock. Does not save, enable, authorize, claim or execute a schedule. Missing wall times are skipped; repeated wall times use the first instant.
      parameters:
        - { in: query, name: zone, required: true, schema: { type: string, maxLength: 128 } }
        - { in: query, name: hour, required: true, schema: { type: integer, minimum: 0, maximum: 23 } }
        - { in: query, name: minute, required: true, schema: { type: integer, minimum: 0, maximum: 59 } }
        - { in: query, name: weekdays, required: true, schema: { type: string, maxLength: 13 }, description: 'Comma-separated distinct weekdays, Sunday=0 through Saturday=6.' }
      responses:
        '200':
          description: Next three calendar instants; actual admission still depends on service and resource readiness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentCalendarPreview' }
        '400':
          description: Invalid or ambiguous calendar input
        '401':
          description: Authentication required
        '403':
          description: Chat permission required
  /api/v2/agent-schedules/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: inspectAgentSchedule
      parameters:
        - { in: query, name: revision, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Current or exact historical policy; never resumes work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSchedule' }
    put:
      operationId: reviseAgentSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentScheduleWrite' }
      responses:
        '200':
          description: New reviewed revision; old roots do not regain authority
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSchedule' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/agent-schedules/{id}/disable:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: disableAgentSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Policy revoked before stopping owned roots; unknown effects remain unknown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSchedule' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/agent-schedules/{id}/occurrences:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: listAgentScheduleOccurrences
      responses:
        '200':
          description: Bounded owned occurrence history and canonical job identities; no replay operation
          content:
            application/json:
              schema:
                type: object
                required: [occurrences]
                properties:
                  occurrences: { type: array, items: { $ref: '#/components/schemas/AgentScheduleOccurrence' } }
  /api/v2/agent-skills:
    get:
      operationId: listAgentSkills
      responses:
        '200':
          description: Owned skill metadata; no instructions or executable authority
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills: { type: array, items: { $ref: '#/components/schemas/AgentSkill' } }
    post:
      operationId: importAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSkillImport' }
      responses:
        '201':
          description: Immutable owned skill; never executed or attached automatically
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSkill' }
  /api/v2/agent-skills/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: inspectAgentSkill
      parameters:
        - { in: query, name: revision, required: true, schema: { type: integer, minimum: 1 } }
        - { in: query, name: digest, required: true, schema: { type: string } }
      responses:
        '200':
          description: Exact owned revision and inert files
          content:
            application/json:
              schema:
                type: object
                required: [skill, bundle, executable]
                properties:
                  skill: { $ref: '#/components/schemas/AgentSkill' }
                  bundle: { $ref: '#/components/schemas/AgentSkillBundle' }
                  executable: { type: boolean, const: false }
    put:
      operationId: reviseAgentSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSkillImport' }
      responses:
        '201':
          description: New revision; prior pinned revisions unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSkill' }
  /api/v2/agent-skills/{id}/review:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: reviewAgentSkillDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, digest]
              properties:
                expected_revision: { type: integer, minimum: 1 }
                digest: { type: string }
      responses:
        '201':
          description: User-reviewed copy with a new ID; still requires explicit profile attachment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSkill' }
  /api/v2/agent-memory/{profile}:
    parameters:
      - { in: path, name: profile, required: true, schema: { type: string } }
    get:
      operationId: inspectAgentMemory
      responses:
        '200':
          description: User inspection remains available when automatic use is disabled
          content:
            application/json:
              schema:
                type: object
                required: [consent, entries, deletion_scope]
                properties:
                  consent: { $ref: '#/components/schemas/AgentMemoryConsent' }
                  entries: { type: array, items: { $ref: '#/components/schemas/AgentMemoryEntry' } }
                  deletion_scope: { type: string }
    post:
      operationId: writeAgentMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentMemoryWrite' }
      responses:
        '200':
          description: Explicit user edit; does not enable automatic memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMemoryEntry' }
  /api/v2/agent-memory/{profile}/consent:
    parameters:
      - { in: path, name: profile, required: true, schema: { type: string } }
    put:
      operationId: changeAgentMemoryConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, enabled]
              properties:
                expected_revision: { type: integer, minimum: 0 }
                enabled: { type: boolean }
      responses:
        '200':
          description: Live monotonic consent; re-enable never reauthorizes old jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMemoryConsent' }
  /api/v2/agent-memory/{profile}/{id}:
    parameters:
      - { in: path, name: profile, required: true, schema: { type: string } }
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      operationId: deleteAgentMemory
      parameters:
        - { in: query, name: revision, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Live text and cached write responses cleared; historical task evidence not erased
          content:
            application/json:
              schema:
                type: object
                required: [deleted, historical_evidence_erased]
                properties:
                  deleted: { type: boolean, const: true }
                  historical_evidence_erased: { type: boolean, const: false }
  /api/v2/agent-profiles:
    get:
      operationId: listAgentProfiles
      parameters:
        - { in: query, name: archived, schema: { type: boolean } }
      responses:
        '200':
          description: Current actor-owned revisions in this workspace
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles: { type: array, items: { $ref: '#/components/schemas/AgentProfile' } }
    post:
      operationId: createAgentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentProfileWrite' }
      responses:
        '201':
          description: Immutable first revision; referenced resources were resolved without acquiring models or granting access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentProfile' }
        '422':
          description: Resources unavailable or outside actor authority
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentProfileValidation' }
  /api/v2/agent-profiles/resources:
    get:
      operationId: getAgentProfileResources
      responses:
        '200':
          description: Authorized tool references only; no connection credentials or transport configuration
          content:
            application/json:
              schema:
                type: object
                required: [tools, computer_permitted, connection_scope]
                properties:
                  tools: { type: object, additionalProperties: { $ref: '#/components/schemas/AgentCapabilityIdentity' } }
                  computer_permitted: { type: boolean }
                  connection_scope: { type: string, enum: [workspace-admin] }
  /api/v2/agent-profiles/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getAgentProfile
      parameters:
        - { in: query, name: revision, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Owned current or immutable historical revision, including archive status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentProfile' }
    delete:
      operationId: deleteAgentProfile
      description: Atomically delete an owned profile, its revisions, deletable standalone work and private profile memory after reviewing the current snapshot. Active work, canonical conversation work, schedules and dependent profiles or jobs block deletion. Shared files and backups remain separate retention domains.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, review_token]
              properties:
                expected_revision: { type: integer, minimum: 1 }
                review_token: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Deletion committed
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id: { type: string }
                  deleted: { type: boolean, const: true }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateAgentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentProfileWrite' }
      responses:
        '200':
          description: New immutable revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentProfile' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/turn/recover:
    parameters:
      - $ref: '#/components/parameters/SessionName'
    post:
      operationId: recoverSessionJobTurn
      description: Finish accepted linkage or attach an already saved canonical result. This operation does not resume inference, grant access or replay tools.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties: { id: { type: string } }
      responses:
        '200':
          description: Recovered conversation bookkeeping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkedAgentTurn' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '422':
          description: Resource validation failed without saving
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentProfileValidation' }
  /api/v2/agent-profiles/{id}/deletion:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: reviewAgentProfileDeletion
      responses:
        '200':
          description: Owner-scoped deletion counts and optimistic review token; no mutation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentProfileDeletionReview' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v2/agent-profiles/{id}/effective:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getEffectiveAgentProfile
      parameters:
        - { in: query, name: revision, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Current resource validation; readiness is not consent or native qualification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveAgentProfile' }
  /api/v2/agent-profiles/{id}/archive:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: archiveAgentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Removed from future selection; historical revisions and work are retained
          content:
            application/json:
              schema:
                type: object
                required: [id, archived]
                properties:
                  id: { type: string }
                  archived: { type: boolean, enum: [true] }
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/work:
    get:
      operationId: listWorkSummary
      description: Authorized root-job metadata and complete actor-job counts, without transcripts or tool arguments. Requires work-summary-v1. Stable newest-first pagination within the chosen bucket; counts do not include ordinary text-only conversation turns. Deletion and archive eligibility are advisory and rechecked by the mutation endpoint. Normal counts exclude archived jobs; the archived bucket retains original outcomes and evidence.
      parameters:
        - { name: bucket, in: query, schema: { type: string, enum: [all, attention, running, history, archived], default: all } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: query, in: query, schema: { type: string, maxLength: 512 }, description: Case-insensitive search of the bounded title. }
        - { name: id, in: query, schema: { type: string }, description: Exact root job identity for inspector metadata; does not alter scoped counts. }
      responses:
        '200':
          description: One authorized metadata page and unfiltered counts for the same actor scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/jobs:
    get:
      operationId: listDurableJobs
      responses:
        '200':
          description: Owner-scoped task history, including linked child tasks
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AgentTask' } }
    post:
      operationId: submitDurableTask
      description: Saves an owner-scoped task before execution. Identical actor/request ID retries return the original task; conflicting reuse returns 409. Computer access is requested as a durable interruption, not a submission prerequisite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt, request_id]
              anyOf:
                - required: [model]
                - required: [profile_id, profile_revision]
              properties:
                prompt: { type: string, minLength: 1, maxLength: 32000 }
                model: { type: string }
                profile_id: { type: string, description: Actor-owned profile; requires an explicit immutable profile_revision. }
                profile_revision: { type: integer, minimum: 1 }
                execution: { $ref: '#/components/schemas/ExecutionReference' }
                execution_request_version: { type: integer, enum: [1], description: Opt into on-demand client workspace selection. No folder or permission is inferred. }
                response_profile: { type: string, enum: [interactive, extended], description: Optional native job context selection. Interactive uses the Chat allocation; extended uses the model limit. Omission preserves legacy allocation. Pinned for the saved job; does not alter external-agent or service configuration. }
                restrictions: { $ref: '#/components/schemas/AgentResourceRestrictions' }
                request_id: { type: string, minLength: 8, maxLength: 128 }
                style: { type: string, enum: [react, cot, plan-execute] }
                max_iterations: { type: integer, minimum: 1, maximum: 50 }
                computer_approval_mode: { type: string, enum: [ask_every_time, scoped_changes, full_task], description: Proposed policy saved with the task, not host consent. An attached session must match. Omit for legacy local policy selection. }
                computer_scope: { type: string, enum: [desktop, selected_window], description: Proposed scope, not consent. New tasks can answer without host access. Relevant host work requests a matching grant before actions; selected-window scope preserves the limited v2 boundary. }
      responses:
        '202':
          description: Persisted task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/jobs/{id}/input:
    post:
      operationId: resolveDurableTaskAccess
      description: Attaches independently consented, owner-scoped host access to the same saved task. Never grants host permission, changes an approval policy, or repeats uncertain execution. Identical input/session retries are idempotent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input_id]
              oneOf:
                - required: [computer_session]
                  not: { required: [execution] }
                - required: [execution]
                  not: { required: [computer_session] }
              properties:
                input_id: { type: string }
                computer_session: { type: string }
                execution: { $ref: '#/components/schemas/ExecutionReference' }
      responses:
        '202':
          description: Persisted task resumed or previously resolved snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/jobs/{id}:
    delete:
      operationId: deleteDurableJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Terminal history removed; referenced children remain protected until the parent is removed
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      operationId: getDurableJobSnapshot
      description: Reads the existing owner-scoped agent task, including the latest durable event cursor. No separate task history is created.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Current persisted job snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/jobs/{id}/export:
    get:
      operationId: exportDurableJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Owner-scoped evidence snapshot; excludes private checkpoints and screenshot bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
  /api/v2/jobs/{id}/artifact:
    get:
      operationId: downloadTaskArtifact
      description: Checks current task ownership, a committed artifact reference, size and SHA256 before delivering an attachment. Digest knowledge alone does not grant access.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: digest, in: query, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      responses:
        '200':
          description: Verified artifact bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/jobs/{id}/recover-execution:
    post:
      operationId: recoverSavedExecutionReceipt
      description: Inspect only the saved original host intent and its authenticated journal evidence. Never claims or re-dispatches the operation, changes its arguments, renews a grant or resumes the job. Conclusive evidence moves an uncertain task to interrupted for explicit review. Missing, partial or still-dispatched evidence remains uncertain. A disconnected host may leave only locally retained evidence; Refresh never replays it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '202':
          description: Original receipt incorporated without replay; not overall workflow completion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/jobs/{id}/{action}:
    post:
      operationId: commandDurableJob
      description: All clients share the durable runner. Pause settles or labels in-flight effects uncertain. Takeover revokes the host session. Steering invalidates unexecuted proposals, is idempotent by request_id, and requires explicit resume. Reconnect requests fresh local consent, never an automatic retry. Archive and restore change visibility for inactive root jobs only, preserving original outcomes and evidence without resuming execution.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, deny, cancel, pause, resume, takeover, steer, reconnect, reconcile, archive, restore] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                approval_id: { type: string }
                call_id: { type: string }
                result: { type: string, maxLength: 16000 }
                request_id: { type: string, minLength: 8, maxLength: 128 }
                instruction: { type: string, maxLength: 16000 }
                mode: { type: string, enum: [app, browser] }
                target: { type: string, maxLength: 256 }
                url: { type: string, maxLength: 2048 }
                async: { type: boolean }
      responses:
        '202':
          description: Persisted task state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/jobs/{id}/events:
    get:
      operationId: replayDurableJobEvents
      description: Owner-only ordered activity metadata and current snapshots. Last-Event-ID resumes from a persisted sequence. An expired or ahead cursor receives an explicit snapshot_recovery event with the current snapshot and event_cursor. Snapshot recovery never repeats execution. Disconnect does not cancel a job. Event history retains the last 256 metadata entries; completed snapshots remain.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Last-Event-ID, in: header, schema: { type: string, pattern: '^[0-9]{1,19}$' } }
      responses:
        '200':
          description: SSE activity events contain TaskActivity; snapshot and snapshot_recovery events contain AgentRunResponse plus type. Event IDs are decimal sequence strings. Terminal snapshots close the stream.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/agents/tasks/{id}/events:
    get:
      operationId: streamAgentProgress
      summary: Stream durable agent snapshots without owning execution
      description: Starts with the latest saved snapshot, then sends changed snapshots and heartbeat comments. Reconnect to recover the latest bounded preview; this is not an event-history replay endpoint. Disconnect does not cancel work. Only the run owner can subscribe.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE data frames contain AgentRunResponse plus type=status, done, approval_required or error. A preview is provisional, never a completed answer. Terminal snapshots close the stream.
          content:
            text/event-stream:
              schema: { type: string }
        '404': { description: Run not found or not owned by the current actor }
        '503': { description: Agent storage unavailable }
  /v1/agents/tasks/{id}/{action}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: action
        required: true
        schema: { type: string, enum: [approve, deny, cancel, resume, reconcile] }
    post:
      operationId: changeAgentRun
      description: Requires the initiating actor. Approve/deny require the pending approval_id. Resume never replays an uncertain tool call; reconcile requires its call_id and a human-verified result. Expired approvals can be refreshed with resume. Reconciliation records a result without executing the tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                approval_id: { type: string }
                call_id: { type: string }
                result: { type: string }
                async: { type: boolean, default: false }
      responses:
        '200':
          description: Persisted run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '202':
          description: Continuation accepted on the same run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/agents/tools:
    get:
      operationId: listAgentTools
      parameters:
        - in: query
          name: all
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Agent tool catalog
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    patch:
      operationId: setAgentToolEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, enabled]
              properties: { name: { type: string }, enabled: { type: boolean } }
      responses:
        '200': { description: Tool state persisted }
  /v1/agents/mcp:
    get:
      operationId: listMCPServers
      responses:
        '200': { description: 'Active and saved MCP connections, including disconnected connections' }
    post:
      operationId: connectMCPServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties: { name: { type: string }, url: { type: string, format: uri } }
      responses:
        '200': { description: MCP server connected and persisted }
    delete:
      operationId: removeMCPServer
      description: Administrator only. Forget the saved connection, unregister its tools, and close its transport. Does not delete task history or undo dispatched actions. Idempotent.
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Connection removed
          content:
            application/json:
              schema:
                type: object
                required: [status, server, tools_removed]
                properties:
                  status: { type: string, enum: [removed] }
                  server: { type: string }
                  tools_removed: { type: integer, minimum: 0 }
        '400': { description: Connection name is required }
        '403': { description: Administrator access required }
        '500': { description: Persistence failed; connection retained }
  /v1/agents/mcp/test:
    post:
      operationId: testMCPServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties: { url: { type: string, format: uri } }
      responses:
        '200': { description: MCP connection test result }
  /v1/capabilities:
    get:
      operationId: listCapabilities
      responses:
        '200': { description: Governed capability descriptors }
  /v1/integrations:
    get:
      operationId: listExternalAgentIntegrations
      parameters:
        - in: query
          name: model
          schema: { type: string }
          description: Installed chat model to evaluate for integration readiness.
      responses:
        '200':
          description: First-party external agent provider integrations and their runtime readiness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationList' }
  /v1/integrations/{id}/setup:
    get:
      operationId: getExternalAgentIntegrationSetup
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]+$' }
        - in: query
          name: model
          schema: { type: string }
        - in: query
          name: base_url
          schema: { type: string, format: uri }
        - in: query
          name: max_output_tokens
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Ready-to-copy native provider setup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSetupResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/computer/status:
    get:
      deprecated: true
      operationId: getComputerStatus
      responses:
        '200':
          description: Computer-use driver and safety-controller status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputerStatus' }
  /api/v2/computer/status:
    get:
      operationId: getComputerStatusV2
      responses:
        '200':
          description: Computer safety-controller status; requires administrator access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputerStatus' }
  /api/v2/computer/capabilities:
    get:
      operationId: getComputerCapabilities
      responses:
        '200':
          description: Actual availability and qualification, not a promise of installed drivers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputerCapabilities' }
  /api/v2/computer/stop:
    post:
      operationId: stopComputer
      responses:
        '200':
          description: Emergency stop has been set; previously dispatched effects are not rolled back.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [stopped] }
        '202':
          description: Revocation requested; the companion must close its browser. Already dispatched effects may require reconciliation.
  /api/v2/computer/pairing:
    post:
      operationId: createComputerPairing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Empty for legacy enrollment. Protocol 3 requires both IDs from the actor-owned pending task, whose saved policy and scope are validated before enrollment. Enrollment alone does not grant access.
              properties:
                protocol_version: { type: integer, enum: [3] }
                run_id: { type: string }
                input_id: { type: string }
      responses:
        '200':
          description: Administrator-only single-use enrollment code, valid for two minutes. Never cache or log.
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_seconds, protocol_version]
                properties:
                  code: { type: string }
                  expires_seconds: { type: integer }
                  protocol_version: { type: integer }
  /api/v2/computer/sessions:
    get:
      operationId: listComputerSessions
      responses:
        '200':
          description: Live local computer sessions owned by the requesting administrator. Driver availability is not workflow qualification. Browser clients must not select native sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [id, origin, expires_at, remaining_actions, approval_mode]
                      properties:
                        id: { type: string }
                        origin: { type: string }
                        driver: { type: string, enum: [browser, windows-uia, macos-accessibility, linux-atspi] }
                        approval_mode: { type: string, enum: [ask_every_time, scoped_changes, full_task] }
                        target:
                          type: object
                          description: Companion-issued native identity. Protocol 2 binds one window; protocol 3 binds a task desktop, with actual targets separately bound at dispatch.
                          required: [id, os_session, process_generation, surface, driver]
                          properties:
                            id: { type: string }
                            os_session: { type: string }
                            process_generation: { type: string }
                            surface: { type: string }
                            driver: { type: string, enum: [windows-uia, macos-accessibility, linux-atspi] }
                        expires_at: { type: string, format: date-time }
                        remaining_actions: { type: integer }
                        state: { type: string, enum: [ready, awaiting_consent, in_use, finished, exhausted] }
                        run_id: { type: string }
                        input_id: { type: string }
                        desktop:
                          type: object
                          required: [workspace, binding]
                          properties:
                            workspace: { type: string }
                            binding:
                              type: object
                              required: [actor, task, companion, session, target]
                              properties:
                                actor: { type: string }
                                task: { type: string }
                                companion: { type: string }
                                session: { type: string }
                                target: { type: object, additionalProperties: { type: string } }
  /api/v2/computer/sessions/stop:
    post:
      operationId: stopComputerSession
      description: Revoke only the specified session owned by the requesting administrator. Idempotent; unknown or foreign IDs do not revoke any other session. Host shutdown is acknowledged independently; dispatched effects are not undone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id]
              properties:
                session_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: This actor's authority for the specified session is revoked.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [revoked] }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v2/computer/model-check:
    post:
      operationId: checkComputerModel
      description: Administrator-only, bounded two-step tool-call smoke check for the selected driver. Executes no computer actions. Not a qualification certificate. Concurrent identical tool checks share only in-flight work with independent cancellation; later calls repeat the check against the current runtime. Vision checks remain separate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string }
                driver: { type: string, enum: [browser, windows-uia, macos-accessibility, linux-atspi], default: browser }
      responses:
        '200':
          description: Completed compatibility check, including a negative result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputerModelCheck' }
        '503':
          description: Runtime unavailable or check timed out; retryable, not proof of incompatibility.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      timings: { $ref: '#/components/schemas/ComputerModelCheckTimings' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionName:
      in: path
      name: name
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    InferenceRuntimeReadiness:
      type: object
      description: Native engine preparation only. Ready verifies runtime startup flags, not model inference or workflow quality. Progress is service-local and is not durable across restart.
      required: [state, mode, gpu_detected, download_required, download_bytes, downloaded_bytes, revision]
      properties:
        state: { type: string, enum: [unchecked, missing, checking, downloading, installing, ready, failed, cancelled] }
        mode: { type: string, enum: [cpu, metal, nvidia, amd] }
        gpu_detected: { type: boolean }
        download_required: { type: boolean }
        download_bytes: { type: integer, format: int64 }
        downloaded_bytes: { type: integer, format: int64 }
        revision:
          type: string
          description: Pinned CPU/Metal fallback revision; not an inferred version of a separately configured engine.
        message: { type: string }
    ComputerModelCheckTimings:
      type: object
      description: Milliseconds for the shared synthetic tool check, not an individual observer's wait. Admission includes queue/model readiness; probe includes runtime metadata and synthetic generation. Excludes separate vision checks. Absent for a caller that cancels before the shared result completes.
      required: [admission_ms, probe_ms]
      properties:
        admission_ms: { type: integer, format: int64, minimum: 0 }
        probe_ms: { type: integer, format: int64, minimum: 0 }
    ComputerModelCheck:
      type: object
      required: [model, passed, code, message, retryable]
      properties:
        model: { type: string }
        passed: { type: boolean }
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        timings: { $ref: '#/components/schemas/ComputerModelCheckTimings' }
        vision:
          type: object
          required: [installed, passed, code, message, retryable]
          properties:
            installed: { type: boolean }
            passed: { type: boolean }
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        runtime:
          type: object
          properties:
            build: { type: string }
            template_sha256: { type: string }
            context: { type: integer }
            supports_tools: { type: boolean }
            supports_tool_calls: { type: boolean }
    DiscoveredModel:
      type: object
      required: [id, author, name, downloads, likes]
      properties:
        id: { type: string }
        author: { type: string }
        name: { type: string }
        downloads: { type: integer }
        likes: { type: integer }
    DiscoveredFile:
      type: object
      required: [id, file, size_bytes, quant, supported]
      properties:
        id: { type: string }
        file: { type: string }
        size_bytes: { type: integer }
        quant: { type: string }
        supported: { type: boolean }
        reason: { type: string }
    WorkSearchResponse:
      type: object
      required: [results, scopes, partial]
      properties:
        partial: { type: boolean }
        scopes:
          type: array
          items: { type: string, enum: [conversation_names, task_requests] }
        results:
          type: array
          maxItems: 20
          items:
            type: object
            required: [kind, id, title, updated_at]
            properties:
              kind: { type: string, enum: [chat, task] }
              id: { type: string }
              title: { type: string }
              updated_at: { type: string, format: date-time }
    SystemIdentity:
      type: object
      required: [product, version, revision, api_version, ui_build_id, capabilities]
      properties:
        product: { type: string, const: offgrid }
        version: { type: string }
        revision: { type: string }
        api_version: { type: integer, const: 2 }
        ui_build_id: { type: string, description: SHA-256 of the served UI index; empty when not installed. }
        desktop_bridge:
          type: object
          description: Renderer-to-desktop compatibility, not authorization. Missing legacy metadata is distinct from invalid metadata.
          required: [status]
          properties:
            status: { type: string, enum: [missing, invalid, ready] }
            schema_version: { type: integer }
            protocol: { type: integer }
            ui_build_id: { type: string }
        workspace_id: { type: string, description: Opaque persistent workspace namespace; not an authorization credential. }
        capabilities: { type: array, items: { type: string } }
    ChatStreamPhase:
      type: string
      enum: [queued, retrieving, loading, processing, generating, saving]
    ChatTimings:
      type: object
      required: [total_ms, ready_ms, queue_ms, load_ms, prompt_ms, first_text_ms, generation_ms, context_window]
      properties:
        total_ms: { type: integer }
        ready_ms: { type: integer }
        queue_ms: { type: integer }
        load_ms: { type: integer }
        prompt_ms: { type: integer }
        first_text_ms: { type: integer }
        generation_ms: { type: integer }
        context_window: { type: integer }
        completion_tokens: { type: integer }
        tokens_per_second: { type: number }
    SessionStreamEvent:
      oneOf:
        - type: object
          required: [type, phase]
          properties:
            type: { type: string, enum: [phase] }
            phase: { $ref: '#/components/schemas/ChatStreamPhase' }
        - type: object
          required: [type, delta]
          properties:
            type: { type: string, enum: [delta] }
            delta: { type: string }
        - type: object
          required: [type, session, message, metrics, finish_reason]
          properties:
            type: { type: string, enum: [done] }
            session: { $ref: '#/components/schemas/ChatSession' }
            message: { $ref: '#/components/schemas/SessionMessage' }
            metrics: { $ref: '#/components/schemas/ChatTimings' }
            finish_reason: { type: string, enum: [stop, length] }
        - type: object
          required: [type, error]
          properties:
            type: { type: string, enum: [error] }
            error: { type: string }
            error_code: { type: string, description: Optional machine-readable failure code. Unknown codes retain the supplied error message. }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              required: [message]
              properties:
                message: { type: string }
                type: { type: string }
                code: { type: string }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string }
        version: { type: string }
        uptime: { type: string }
        uptime_seconds: { type: integer, format: int64 }
        models: { type: object, additionalProperties: true }
        inference: { type: object, additionalProperties: true }
        scheduling: { $ref: '#/components/schemas/InferenceAdmissionStatus' }
        system: { type: object, additionalProperties: true }
    InferenceAdmissionStatus:
      type: object
      required: [policy, admitted, capacity, foreground_queued, background_queued, queue_capacity]
      properties:
        policy: { type: string }
        admitted: { type: integer, minimum: 0, description: Requests admitted before acquiring provider-family and runtime resources; not a count of active generations. }
        capacity: { type: integer, minimum: 1 }
        foreground_queued: { type: integer, minimum: 0 }
        background_queued: { type: integer, minimum: 0 }
        queue_capacity: { type: integer, minimum: 1 }
    PublicUser:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string }
    CurrentUser:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: { type: boolean }
        auth_required: { type: boolean, description: Whether workspace role permissions are enforced. }
        guest: { type: boolean }
        user:
          oneOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: 'null'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [user, expires_at, auth_method]
      properties:
        user: { $ref: '#/components/schemas/PublicUser' }
        token: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
        auth_method: { type: string }
    ModelPackageManifest:
      type: object
      additionalProperties: false
      required: [schema_version, id, revision, name, architecture, runtime, capabilities, languages, sample_rates, license, artifacts]
      properties:
        schema_version: { type: integer, const: 1 }
        id: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,95}$' }
        revision: { type: string, description: Immutable revision, not main/master/latest. }
        name: { type: string, maxLength: 200 }
        architecture: { type: string, enum: [whisper, piper, zipformer-streaming, kokoro, qwen3-asr, qwen3-tts, mlx-text, transformers-text] }
        model_family: { type: string, description: Pinned family identity required for text packages. }
        runtime:
          type: object
          additionalProperties: false
          required: [adapter, revision]
          properties:
            adapter: { type: string, enum: [whisper.cpp, piper, sherpa-onnx, qwen3-asr, qwen3-tts, mlx-lm, transformers] }
            revision: { type: string }
        capabilities:
          type: array
          items: { type: string, enum: [chat, transcription, streaming_recognition, speech_synthesis, incremental_synthesis] }
        languages: { type: array, minItems: 1, maxItems: 256, items: { type: string } }
        sample_rates: { type: array, maxItems: 16, description: Nonempty for speech packages; empty for text packages., items: { type: integer, minimum: 8000, maximum: 192000 } }
        license: { type: string, maxLength: 256 }
        voices:
          type: array
          maxItems: 1024
          items:
            type: object
            additionalProperties: false
            required: [id, language]
            properties:
              id: { type: string }
              language: { type: string }
        hardware_profiles:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [id, memory_bytes, evidence]
            properties:
              id: { type: string }
              memory_bytes: { type: integer, format: int64 }
              evidence: { type: string, description: Reference only, never self-certified qualification. }
        engine: { type: string, enum: [llama_cpp, mlx, transformers] }
        format: { type: string, enum: [gguf, mlx_safetensors, safetensors] }
        backend: { type: string }
        runner_revision: { type: string }
        adapter_revision: { type: string }
        modalities: { type: array, items: { type: string } }
        tool_calling: { type: string, enum: [qualified, unqualified, unsupported] }
        context_length: { type: integer, minimum: 0 }
        template_digest: { type: string }
        preprocessing: { type: array, items: { type: string } }
        artifacts:
          type: array
          minItems: 1
          maxItems: 2048
          items:
            type: object
            additionalProperties: false
            required: [path, role, size, sha256, license]
            properties:
              path: { type: string, maxLength: 240 }
              role: { type: string }
              size: { type: integer, format: int64, minimum: 1, maximum: 34359738368 }
              sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
              license: { type: string }
              source:
                type: object
                additionalProperties: false
                required: [repository, revision, path]
                properties:
                  repository: { type: string, format: uri }
                  revision: { type: string, description: Full immutable repository commit. }
                  path: { type: string }
    ModelPackageState:
      type: object
      required: [id, revision, installed, integrity, runtime_compatible, smoke_tested, qualified, provenance, in_use]
      properties:
        id: { type: string }
        revision: { type: string }
        manifest: { $ref: '#/components/schemas/ModelPackageManifest' }
        installed: { type: boolean }
        integrity: { type: string, enum: [unchecked, checked, failed] }
        verified_at: { type: string, format: date-time, description: Last check in this service process; runtime leases reverify. }
        runtime_compatible: { type: boolean }
        smoke_tested: { type: boolean }
        qualified: { type: boolean }
        provenance: { type: string, enum: [local_untrusted, repository_metadata, curated_manifest] }
        issue: { type: string }
        in_use: { type: integer, minimum: 0 }
        operation: { type: string }
    ModelCategory:
      type: string
      enum: [language, embeddings, speech_recognition, speech_generation]
    ModelReadiness:
      type: object
      required: [installed, integrity, runtime_compatible, smoke_tested, qualified]
      properties:
        installed: { type: boolean }
        integrity: { type: string, enum: [unchecked, checked, failed] }
        runtime_compatible: { type: boolean }
        smoke_tested: { type: boolean }
        qualified: { type: boolean }
        runtime_ready: { type: boolean }
        issue: { type: string }
    ModelProvenance:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
        repository: { type: string }
        revision: { type: string }
    ModelInstallationTarget:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, file]
          properties:
            kind: { type: string, const: legacy_file }
            file:
              type: object
              required: [model_id, repository, file, revision]
              properties:
                model_id: { type: string }
                repository: { type: string }
                file: { type: string }
                revision: { type: string }
                sha256: { type: string }
        - type: object
          additionalProperties: false
          required: [kind, package]
          properties:
            kind: { type: string, const: package }
            package: { $ref: '#/components/schemas/ModelPackageManifest' }
    TypedCatalogModel:
      type: object
      required: [id, name, description, category, capabilities, license, variants]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/ModelCategory' }
        capabilities: { type: array, items: { type: string } }
        license: { type: string }
        source_notices: { type: array, items: { type: string } }
        variants:
          type: array
          items:
            type: object
            required: [id, name, size_bytes, target, provenance, readiness]
            properties:
              id: { type: string }
              name: { type: string }
              size_bytes: { type: integer, format: int64 }
              target: { $ref: '#/components/schemas/ModelInstallationTarget' }
              provenance: { $ref: '#/components/schemas/ModelProvenance' }
              readiness: { $ref: '#/components/schemas/ModelReadiness' }
    InstalledTypedModel:
      type: object
      required: [id, name, kind, capabilities, readiness, provenance]
      properties:
        id: { type: string }
        revision: { type: string }
        name: { type: string }
        kind: { type: string, enum: [legacy_file, package] }
        category: { $ref: '#/components/schemas/ModelCategory' }
        capabilities: { type: array, items: { type: string } }
        engine: { type: string, enum: [llama_cpp, mlx, transformers] }
        format: { type: string, enum: [gguf, mlx_safetensors, safetensors] }
        backend: { type: string }
        readiness: { $ref: '#/components/schemas/ModelReadiness' }
        provenance: { $ref: '#/components/schemas/ModelProvenance' }
        package: { $ref: '#/components/schemas/ModelPackageState' }
        legacy: { $ref: '#/components/schemas/Model' }
    PackageDiscovery:
      type: object
      required: [repository, revision, license, choices]
      properties:
        repository: { type: string }
        revision: { type: string }
        license: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [id, architecture, name, supported]
            properties:
              id: { type: string }
              architecture: { type: string }
              name: { type: string }
              supported: { type: boolean }
              reason: { type: string }
    ResolveModelRequest:
      type: object
      additionalProperties: false
      properties:
        catalog_id: { type: string }
        repository: { type: string }
        revision: { type: string }
        variant: { type: string }
        architecture: { type: string }
    ModelResolution:
      type: object
      required: [id, expires_at, resolution, preflight]
      properties:
        id: { type: string }
        expires_at: { type: string, format: date-time }
        resolution:
          type: object
          required: [manifest, provenance, source_notices, transfer_bytes]
          properties:
            manifest: { $ref: '#/components/schemas/ModelPackageManifest' }
            provenance: { $ref: '#/components/schemas/ModelProvenance' }
            source_notices: { type: [array, 'null'], items: { type: string } }
            transfer_bytes: { type: integer, format: int64 }
        preflight:
          type: object
          required: [transfer_bytes, required_free_bytes, available_bytes, runtime, runtime_available, readiness, warnings]
          properties:
            transfer_bytes: { type: integer, format: int64 }
            required_free_bytes: { type: integer, format: int64 }
            available_bytes: { type: integer, format: int64 }
            runtime:
              type: object
              required: [adapter, revision]
              properties:
                adapter: { type: string }
                revision: { type: string }
            runtime_available: { type: boolean }
            readiness: { $ref: '#/components/schemas/ModelReadiness' }
            warnings: { type: array, items: { type: string } }
    ModelOperation:
      type: object
      required: [id, actor_id, request_id, request_digest, action, target, provenance, state, created_at, updated_at, artifacts, bytes_done, bytes_total, retained_bytes, discarded, activation_intent]
      properties:
        id: { type: string }
        actor_id: { type: string }
        request_id: { type: string }
        request_digest: { type: string }
        action: { type: string, enum: [install, repair] }
        target: { $ref: '#/components/schemas/ModelInstallationTarget' }
        provenance: { $ref: '#/components/schemas/ModelProvenance' }
        state: { type: string, enum: [queued, downloading, verifying, activating, complete, cancelling, cancelled, interrupted, failed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        bytes_done: { type: integer, format: int64 }
        bytes_total: { type: integer, format: int64 }
        retained_bytes: { type: integer, format: int64 }
        discarded: { type: boolean }
        activation_intent: { type: boolean }
        error_code: { type: string }
        message: { type: string }
        artifacts:
          type: array
          items:
            type: object
            required: [path, bytes_done, bytes_total, verified]
            properties:
              path: { type: string }
              bytes_done: { type: integer, format: int64 }
              bytes_total: { type: integer, format: int64 }
              verified: { type: boolean }
    Model:
      type: object
      required: [id]
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer, format: int64 }
        owned_by: { type: string }
        type: { type: string }
        size: { type: integer, format: int64 }
        size_gb: { type: string }
        loaded: { type: boolean }
        context_window: { type: integer, minimum: 1 }
        context_length: { type: integer, minimum: 1, description: OpenAI-compatible alias for context_window. }
        capabilities:
          type: array
          items: { type: string }
        capability_status:
          type: object
          additionalProperties: { type: string, enum: [declared, tested, unsupported, unknown] }
        engine: { type: string, enum: [llama_cpp, mlx, transformers] }
        format: { type: string, enum: [gguf, mlx_safetensors, safetensors] }
        backend: { type: string }
        runner_revision: { type: string }
        adapter_revision: { type: string }
        runtime_ready: { type: boolean }
        smoke_tested: { type: boolean }
        qualified: { type: boolean }
    IntegrationStatus:
      type: object
      required: [id, provider_id, plugin_id, name, description, transport, documentation_url, minimum_context, recommended_context, requires_tools, capabilities, ready, status, context_window, warnings]
      properties:
        id: { type: string }
        contract_revision: { type: string }
        readiness_scope: { type: string, enum: [service_model] }
        host_state: { type: string, enum: [not_inspected] }
        workflow_state: { type: string, enum: [unverified] }
        checks:
          type: array
          items:
            type: object
            required: [id, state, code, message]
            properties:
              id: { type: string }
              state: { type: string, enum: [passed, blocked] }
              code: { type: string }
              message: { type: string }
        provider_id: { type: string, const: offgrid }
        plugin_id: { type: string }
        name: { type: string }
        description: { type: string }
        transport: { type: string, const: openai-chat-completions }
        documentation_url: { type: string, format: uri }
        minimum_context: { type: integer, minimum: 1 }
        recommended_context: { type: integer, minimum: 1 }
        requires_tools: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        ready: { type: boolean }
        status: { type: string, enum: [ready, needs_configuration] }
        model_id: { type: string }
        context_window: { type: integer, minimum: 1 }
        warnings: { type: array, items: { type: string } }
    IntegrationList:
      type: object
      required: [provider, base_url, integrations]
      properties:
        provider: { type: string, const: offgrid }
        base_url: { type: string, format: uri }
        integrations:
          type: array
          items: { $ref: '#/components/schemas/IntegrationStatus' }
    IntegrationSetup:
      type: object
      required: [provider_id, plugin_id, install_command, format, config_file, content, verify]
      properties:
        provider_id: { type: string, const: offgrid }
        plugin_id: { type: string }
        install_command: { type: string }
        format: { type: string }
        config_file: { type: string }
        content: { type: string }
        environment: { type: object, additionalProperties: { type: string } }
        verify: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
    IntegrationSetupResponse:
      type: object
      required: [integration, setup]
      properties:
        integration: { $ref: '#/components/schemas/IntegrationStatus' }
        setup: { $ref: '#/components/schemas/IntegrationSetup' }
    CatalogModel:
      type: object
      required: [id, name, description, category, parameters, size, size_bytes, repo, file, quant, min_ram_gb, recommended, provider, type, license]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        parameters: { type: string }
        size: { type: string }
        size_bytes: { type: integer, format: int64 }
        repo: { type: string }
        file: { type: string }
        quant: { type: string }
        min_ram_gb: { type: integer }
        recommended: { type: boolean }
        provider: { type: string }
        type: { type: string }
        license: { type: string }
    ModelDownloadRequest:
      type: object
      required: [repository]
      properties:
        enable_knowledge: { type: boolean, default: false, description: Requires knowledge management permission as well as model management. Persist activation intent and enable knowledge after installation without relying on an attached page. Empty repository is allowed only for an already installed model. }
        repository: { type: string }
        file_name: { type: string }
        quantization: { type: string }
        model_id:
          type: string
          description: Stable catalog ID used for the collision-free local filename.
          pattern: '^[A-Za-z0-9._-]+$'
          maxLength: 128
    DownloadProgress:
      type: object
      required: [file_name, bytes_total, bytes_done, percent, speed, started_at, status]
      properties:
        bundle: { $ref: '#/components/schemas/GGUFBundle' }
        repository: { type: string }
        source_file: { type: string }
        model_id: { type: string }
        quantization: { type: string }
        enable_knowledge: { type: boolean }
        file_name: { type: string }
        bytes_total: { type: integer, format: int64 }
        bytes_done: { type: integer, format: int64 }
        percent: { type: number, minimum: 0, maximum: 100 }
        speed: { type: number, minimum: 0 }
        started_at: { type: integer, format: int64 }
        status: { type: string, enum: [downloading, finalizing, complete, failed, cancelled] }
        error: { type: string }
        error_code: { type: string, description: Stable machine-readable failure code for recovery and automation. }
    GGUFBundle:
      type: object
      description: Immutable download identity; complete files do not establish runtime or vision qualification.
      required: [schema_version, repository, revision, weights]
      properties:
        schema_version: { type: integer, const: 1 }
        repository: { type: string }
        revision: { type: string, pattern: '^[a-f0-9]{40}([a-f0-9]{24})?$' }
        weights: { $ref: '#/components/schemas/GGUFBundleArtifact' }
        projector: { $ref: '#/components/schemas/GGUFBundleArtifact' }
    GGUFBundleArtifact:
      type: object
      required: [path, role, size, sha256, source]
      properties:
        path: { type: string }
        role: { type: string, enum: [weights, projector] }
        size: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        license: { type: string }
        source:
          type: object
          required: [repository, revision, path]
          properties:
            repository: { type: string }
            revision: { type: string }
            path: { type: string }
    Verification:
      type: object
      required: [model_id, file_name, size, size_gb, sha256, verified]
      properties:
        model_id: { type: string }
        file_name: { type: string }
        size: { type: integer, format: int64 }
        size_gb: { type: string }
        sha256: { type: string }
        verified: { type: boolean }
        message: { type: string }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, developer, user, assistant, tool] }
        content:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              maxItems: 16
              items: { $ref: '#/components/schemas/ChatContentPart' }
        tool_call_id: { type: string }
        tool_calls:
          type: array
          items:
            type: object
            required: [id, type, function]
            properties:
              id: { type: string }
              type: { type: string, const: function }
              function:
                type: object
                required: [name, arguments]
                properties:
                  name: { type: string }
                  arguments: { type: string }
    ChatContentPart:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, text]
          properties:
            type: { type: string, const: text }
            text: { type: string, maxLength: 1048576 }
        - type: object
          additionalProperties: false
          required: [type, image_url]
          properties:
            type: { type: string, const: image_url }
            image_url:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  description: Bounded base64 data URL using image/png or image/jpeg. Remote and file URLs are rejected.
                detail: { type: string, enum: [auto, low, high] }
    SessionImage:
      type: object
      additionalProperties: false
      required: [name, data_url]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        data_url: { type: string, description: Local PNG/JPEG base64 data URL. Maximum 2 MiB decoded, 8192 pixels per edge and 32 megapixels. Remote/file URLs are forbidden. }
    DocumentEvidence:
      type: object
      required: [status, total_units, readable_units]
      properties:
        format: { type: string, description: Extractor format; independent of filename and index status. }
        status: { type: string, enum: [complete, text_only, partial] }
        total_units: { type: integer, minimum: 0 }
        readable_units:
          type: integer
          minimum: 0
          description: Units with usable native/qualified text, or confirmed empty units. A unit may also need visual review; this is not complete document understanding.
        review_units: { type: array, items: { type: integer } }
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string, description: Technical extraction detail; never instructions. }
              source_index: { type: integer }
    AttachmentRevisionHistory:
      type: object
      required: [id, current_revision, revisions]
      properties:
        id: { type: string }
        current_revision: { type: string }
        revisions:
          type: array
          maxItems: 65
          items:
            type: object
            required: [revision, extraction_revision]
            properties:
              revision: { type: string }
              extraction_revision: { type: string }
              parent_revision: { type: string }
              author: { type: string }
              created_at: { type: string, format: date-time }
    SessionAttachment:
      type: object
      required: [id, name, media_type, bytes, sha256, status, created_at]
      properties:
        parent_revision: { type: string }
        correction_author: { type: string }
        corrected_at: { type: string, format: date-time }
        ocr_language: { type: string, description: Explicit OCR pack selection retained across retries. Absent on legacy English records. }
        ocr_completed_pages: { type: integer, minimum: 0, maximum: 1000, description: Saved OCR page receipts reusable on explicit retry. Not an accuracy or full-extraction guarantee. }
        id: { type: string, pattern: '^file-[a-f0-9]{32}$' }
        name: { type: string, maxLength: 255 }
        media_type: { type: string }
        bytes: { type: integer, minimum: 1, maximum: 52428800 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [uploaded, ready, failed] }
        revision: { type: string, description: Immutable extracted-source identity when ready. }
        extraction_revision: { type: string, description: Immutable structured extraction retained with this source; absent for legacy or unstructured extraction. }
        error_code: { type: string }
        coverage: { type: string, enum: [native_text_only, partial_text_only], description: Explicitly accepted limited text. Native text excludes unread visuals; partial OCR remains uncertain and cannot establish exhaustive review. }
        evidence: { $ref: '#/components/schemas/DocumentEvidence' }
        created_at: { type: string, format: date-time }
    DocumentPreview:
      type: object
      required: [name, sha256, format, pages, units, state, error_code]
      properties:
        thumbnails_available: { type: boolean, description: This source supports bounded original-page thumbnails. Older services omit this field. }
        evidence: { $ref: '#/components/schemas/DocumentEvidence' }
        name: { type: string }
        sha256: { type: string }
        format: { type: string }
        pages: { type: integer }
        state: { type: string }
        error_code: { type: string }
        units:
          type: array
          items:
            type: object
            required: [kind, index, text, state, source_sha256, extractor_revision]
            properties:
              kind: { type: string }
              index: { type: integer }
              name: { type: string }
              text: { type: string }
              state: { type: string }
              source_sha256: { type: string }
              extractor_revision: { type: string }
              image_geometry:
                type: object
                description: 'Original encoded pixel grid for verified image documents. Preview pixels use the declared EXIF orientation; absent for unsupported geometry.'
                required: [width, height, orientation]
                properties:
                  width: { type: integer, minimum: 1, maximum: 8192 }
                  height: { type: integer, minimum: 1, maximum: 8192 }
                  orientation: { type: integer, minimum: 1, maximum: 8 }
    SessionAttachmentReference:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id: { type: string, pattern: '^file-[a-f0-9]{32}$' }
        revision: { type: string, pattern: '^[a-f0-9]{64}$' }
    SessionAttachmentResult:
      type: object
      properties:
        attachment: { $ref: '#/components/schemas/SessionAttachment' }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    SessionMessage:
      allOf:
        - $ref: '#/components/schemas/ChatMessage'
        - type: object
          required: [timestamp]
          properties:
            attachment_selections: { type: array, items: { $ref: '#/components/schemas/AttachmentSelection' } }
            timestamp: { type: string, format: date-time }
            attachments: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/SessionAttachmentReference' } }
            images: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/SessionImage' } }
            job_id: { type: string }
            turn_id: { type: string }
            knowledge_sources: { type: array, items: { $ref: '#/components/schemas/KnowledgePassage' } }
            knowledge_documents: { type: array, items: { type: string }, description: 'Retained source dependencies checked against current access; not an access grant.' }
    AttachmentPassage:
      type: object
      required: [id, revision, name, sha256, start_byte, end_byte, text]
      properties:
        id: { type: string }
        revision: { type: string }
        name: { type: string }
        sha256: { type: string }
        start_byte: { type: integer, minimum: 0 }
        end_byte: { type: integer, minimum: 1 }
        text: { type: string }
    AttachmentSelection:
      type: object
      description: Exact source revision and UTF-8 extracted-text byte ranges supplied for this answer. Excerpts are not a complete document review.
      required: [id, revision, name, mode, total_bytes, ranges]
      properties:
        extraction_revision: { type: string, description: Retained structured extraction identity, absent for legacy sources. }
        linked_evidence: { $ref: '#/components/schemas/AttachmentLinkedEvidence' }
        id: { type: string }
        revision: { type: string }
        name: { type: string }
        mode: { type: string, enum: [full_text, excerpts] }
        total_bytes: { type: integer, minimum: 0 }
        ranges:
          type: array
          items: { type: array, minItems: 2, maxItems: 2, items: { type: integer, minimum: 0 } }
    AttachmentLinkedEvidence:
      type: object
      description: Explicit structural dependencies in this saved attachment selection. Complete links do not imply complete extraction, exhaustive review or answer correctness. Absent on legacy sources.
      required: [extraction_revision, links_complete]
      properties:
        extraction_revision: { type: string }
        links_complete: { type: boolean }
        required_spans:
          type: array
          maxItems: 32
          items:
            type: object
            required: [start_byte, end_byte]
            properties:
              start_byte: { type: integer, minimum: 0 }
              end_byte: { type: integer, minimum: 0 }
        omitted_blocks: { type: array, maxItems: 16, items: { type: string } }
        limit_reached: { type: boolean }
    EvidenceReceipt:
      type: object
      description: Structural links supplied with this excerpt, independent of extraction coverage and answer correctness.
      required: [extraction_revision, group_id, links_complete]
      properties:
        extraction_revision: { type: string }
        block_ids: { type: array, maxItems: 128, items: { type: string } }
        group_id: { type: string }
        required_chunks: { type: array, maxItems: 16, items: { type: string } }
        omitted_blocks: { type: array, maxItems: 128, description: Known linked block identities not included by bounded expansion. May be capped; limit_reached remains true., items: { type: string } }
        links_complete: { type: boolean, description: False if explicit linked context was omitted or truncated. Never a full-document review guarantee. }
        limit_reached: { type: boolean }
    KnowledgePassage:
      type: object
      required: [document_id, name, chunk_id, content, content_hash]
      properties:
        retrieval_mode: { type: string, enum: [hybrid, semantic, lexical], description: Retrieval method, not an accuracy guarantee. }
        evidence_receipt: { $ref: '#/components/schemas/EvidenceReceipt' }
        evidence: { $ref: '#/components/schemas/DocumentEvidence' }
        source: { $ref: '#/components/schemas/KnowledgeSourceLocator' }
        document_id: { type: string }
        name: { type: string }
        chunk_id: { type: string }
        content: { type: string }
        content_hash: { type: string }
    KnowledgeSourceLocator:
      type: object
      description: Parser-derived source unit and exact UTF-8 byte offsets into retained extracted text. Absent for legacy indexes without verified unit structure.
      required: [kind, index, start_byte, end_byte, source_sha256, extractor_revision]
      properties:
        kind: { type: string, enum: [page, slide, sheet, section] }
        index: { type: integer, minimum: 1 }
        name: { type: string }
        cells: { type: array, description: Actual worksheet cell references intersecting this excerpt. Absent for non-spreadsheets and legacy indexes., items: { type: string, pattern: '^[A-Z]{1,3}[1-9][0-9]{0,6}$' } }
        start_byte: { type: integer, minimum: 0 }
        end_byte: { type: integer, minimum: 0 }
        source_sha256: { type: string }
        extractor_revision: { type: string }
    WorkControlCommand:
      type: object
      additionalProperties: false
      required: [request_id, target_id, expected_revision, kind, payload]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128 }
        target_id: { type: string }
        expected_revision: { type: integer, format: int64, minimum: 1 }
        kind: { type: string, enum: [stop, pause, correct, continue] }
        payload:
          type: object
          additionalProperties: false
          properties:
            instruction: { type: string, minLength: 1, maxLength: 16000, description: Required only for correct. No budget is replenished. }
    ConversationPreferences:
      type: object
      additionalProperties: false
      properties:
        model: { type: string, maxLength: 256 }
        profile_id: { type: string }
        profile_revision: { type: integer, minimum: 1 }
        restrictions: { $ref: '#/components/schemas/AgentResourceRestrictions' }
        delegation: { type: boolean }
    CanonicalConversation:
      type: object
      required: [id, revision, project_id, title, preferences, created_at, configuration_known]
      properties:
        pending_question: { $ref: '#/components/schemas/ConversationQuestion' }
        context_revision: { type: integer, format: int64, minimum: 0, description: Version of explicit project/folder selection. Ordinary messages do not advance it; late access approval preserves a newer selection. }
        configuration_known: { type: boolean, description: False when migrated browser-only configuration has no persisted evidence. }
        id: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        project_id: { type: string }
        title: { type: string }
        preferences: { $ref: '#/components/schemas/ConversationPreferences' }
        focused_work_id: { type: string }
        created_at: { type: string, format: date-time }
    ConversationQuestion:
      type: object
      description: Read-only projection of the focused work's pending primary clarification. Observation never answers or resumes work.
      required: [id, work_id, run_id, content]
      properties:
        id: { type: string }
        work_id: { type: string }
        run_id: { type: string }
        content: { type: string }
    CanonicalConversationPage:
      type: object
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CanonicalConversation' } }
        next_cursor: { type: string }
        has_more: { type: boolean }
    ConversationProject:
      type: object
      required: [id, revision, name, default, preferences]
      properties:
        id: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        default: { type: boolean }
        preferences: { $ref: '#/components/schemas/ConversationPreferences' }
        resources: { type: array, maxItems: 128, items: { $ref: '#/components/schemas/ProjectResourceReference' } }
        configuration_digest: { type: string, description: SHA-256 of the accepted project TOML bytes. Absent after an explicit service preference edit. }
        folder_identity: { type: string, description: Opaque host/folder identity. Project membership grants no access. }
        configuration_source: { type: string, enum: [file, service], description: Explicit service edits survive later folder refreshes. }
    ProjectResourceReference:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: { type: string, enum: [skill, knowledge, connection, instructions] }
        id: { type: string, maxLength: 512 }
        revision: { type: string, maxLength: 128, description: Skill revision number, Knowledge content hash, or connection tool schema revision. Omit to resolve and pin at admission. }
        required: { type: boolean }
    ResourceResolution:
      type: object
      required: [kind, id, selected, reason]
      properties:
        kind: { type: string }
        id: { type: string }
        revision: { type: string }
        required: { type: boolean }
        selected: { type: boolean }
        reason: { type: string }
    ProjectCommand:
      type: object
      additionalProperties: false
      required: [request_id, target_id, expected_revision, kind, payload]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128 }
        target_id: { type: string, description: Empty only for create_project. }
        expected_revision: { type: integer, minimum: 0, format: int64 }
        kind: { type: string, enum: [create_project, configure_project] }
        payload:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 256 }
            configuration_toml: { type: string, description: Version 1 UTF-8 project configuration, at most 64 KiB. Cannot be mixed with explicit preferences or resources. Unknown keys, authority, credentials and executable hooks are rejected. }
            preferences: { $ref: '#/components/schemas/ProjectPreferences' }
            resources: { type: array, maxItems: 128, items: { $ref: '#/components/schemas/ProjectResourceReference' } }
    UserDefaultValues:
      type: object
      additionalProperties: false
      properties:
        model: { type: string, maxLength: 256 }
        delegation: { type: boolean }
    UserPreferences:
      type: object
      required: [id, revision, preferences]
      properties:
        id: { type: string, const: user-defaults }
        revision: { type: integer, format: int64, minimum: 0 }
        preferences: { $ref: '#/components/schemas/UserDefaultValues' }
    UserPreferencesCommand:
      type: object
      additionalProperties: false
      required: [request_id, target_id, expected_revision, kind, payload]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128 }
        target_id: { type: string, const: user-defaults }
        expected_revision: { type: integer, format: int64, minimum: 0 }
        kind: { type: string, const: configure_user_preferences }
        payload: { $ref: '#/components/schemas/UserDefaultValues' }
    ProjectPreferences:
      type: object
      additionalProperties: false
      properties:
        model: { type: string, maxLength: 256 }
        delegation: { type: boolean }
        restrictions: { type: object, additionalProperties: false, description: Empty compatibility field only. Project preferences cannot grant or widen authority. }
    ConversationWorkItem:
      type: object
      required: [id, revision, project_id, project_revision, objective, acceptance, run_id, status, instruction_version, control_epoch, independently_verified]
      properties:
        id: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        project_id: { type: string }
        project_revision: { type: integer, format: int64 }
        objective: { type: string }
        acceptance: { type: array, items: { type: string } }
        run_id: { type: string }
        run_ids: { type: array, items: { type: string }, description: Ordered retained execution attempts. run_id identifies the current attempt; prior outcomes are not rewritten. }
        status: { type: string }
        instruction_version: { type: integer, minimum: 1 }
        control_epoch: { type: integer, minimum: 0 }
        result_reference: { type: string }
        independently_verified: { type: boolean, description: Completion does not imply independent verification. }
        worker_policy: { $ref: '#/components/schemas/WorkerPolicy' }
    WorkerPolicy:
      type: object
      description: Service-owned resource policy pinned at work admission; never an authority grant. Absent on older work, which retains version 1 defaults.
      required: [version, max_sessions, max_active, max_depth, initial_model_calls]
      properties:
        version: { type: integer, enum: [1] }
        max_sessions: { type: integer, minimum: 1, maximum: 32 }
        max_active: { type: integer, minimum: 1, maximum: 8 }
        max_depth: { type: integer, enum: [1] }
        initial_model_calls: { type: integer, minimum: 1, maximum: 50 }
    ConversationCommand:
      type: object
      additionalProperties: false
      required: [request_id, target_id, expected_revision, kind, payload]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128 }
        target_id: { type: string, description: Empty only when creating or importing a conversation. }
        expected_revision: { type: integer, format: int64, minimum: 0 }
        kind: { type: string, enum: [create_conversation, import_conversation, configure_conversation, rename_conversation, select_project, use_project_folder, clear_project_folder, link_work, focus_work, create_work] }
        payload:
          type: object
          additionalProperties: false
          properties:
            title: { type: string, maxLength: 256 }
            legacy_name: { type: string, maxLength: 256, description: Required only for import_conversation with empty target and revision zero. Imports an owned inactive legacy session transactionally and retains its original files. }
            work_id: { type: string, maxLength: 128, description: link_work attaches owned accessible work and focuses it. focus_work requires an existing link; omit work_id to clear focus. Neither command dispatches or copies grants. }
            project_id: { type: string }
            folder: { $ref: '#/components/schemas/ExecutionReference', description: Required only for use_project_folder. Resolves a live approved host and imports safe fixed-path project metadata. Does not create authority or rewrite existing work. }
            preferences: { $ref: '#/components/schemas/ConversationPreferences' }
            input:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 32000 }
                model: { type: string, maxLength: 256 }
                acceptance: { type: array, maxItems: 32, items: { type: string, minLength: 1, maxLength: 4096 } }
    ConversationCommandReceipt:
      type: object
      required: [request_id, target_id, revision, event_cursor]
      properties:
        input: { $ref: '#/components/schemas/ConversationInboxEntry' }
        user_preferences: { $ref: '#/components/schemas/UserPreferences' }
        request_id: { type: string }
        target_id: { type: string }
        revision: { type: integer, format: int64 }
        event_cursor: { type: integer, format: int64 }
        conversation: { $ref: '#/components/schemas/CanonicalConversation' }
        work: { $ref: '#/components/schemas/ConversationWorkItem' }
        project: { $ref: '#/components/schemas/ConversationProject' }
        worker: { $ref: '#/components/schemas/WorkerSession' }
        message: { $ref: '#/components/schemas/WorkerMessage' }
        import: { $ref: '#/components/schemas/ConversationImportManifest' }
    ConversationAttachment:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id: { type: string }
        revision: { type: string, pattern: '^[a-f0-9]{64}$' }
        page: { type: integer, minimum: 0, maximum: 100000, description: One-based page in the pinned extraction. Zero selects document retrieval. }
    ConversationKnowledgeSelection:
      type: object
      additionalProperties: false
      required: [document_id, revision]
      properties:
        document_id: { type: string, minLength: 1, maxLength: 256 }
        revision: { type: string, minLength: 1, maxLength: 128 }
        page: { type: integer, minimum: 1, maximum: 100000 }
        block_ids: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 128 } }
      description: Explicit page or block selection in an immutable Knowledge extraction. Exactly one scope is required; this cannot be combined with broad Knowledge retrieval.
    ConversationInboxInput:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        knowledge_selections: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/ConversationKnowledgeSelection' } }
        source_session: { type: string, maxLength: 256, description: Owning session whose canonical manifest matches this conversation. }
        attachments: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/ConversationAttachment' } }
        images: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/SessionImage' } }
        knowledge_documents: { type: array, maxItems: 16, items: { type: string } }
        use_knowledge: { type: boolean, description: Retrieve from currently permitted Knowledge within effective resource restrictions. }
        question_id: { type: string, description: Required for answer intent. Exact saved primary clarification identity; never authorizes host access. Omit for other intents. }
        content: { type: string, minLength: 1, maxLength: 32000 }
        model: { type: string, maxLength: 256 }
        intent: { type: string, enum: [message, correction, new_work, answer] }
        focused_work_id: { type: string, description: Omitted uses current focus. Empty string selects unbound conversation input. }
        origin: { type: string, enum: [typed, dictation, steering] }
    ConversationInputCommand:
      type: object
      additionalProperties: false
      description: Durable input envelope. Source inputs require conversation-source-inputs-v1 and are validated before acceptance. Inference starts separately. Answer intent binds an exact primary clarification; host approvals retain their existing access controls.
      required: [request_id, target_id, expected_revision, kind, payload]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128 }
        target_id: { type: string }
        expected_revision: { type: integer, format: int64, minimum: 1 }
        kind: { type: string, const: submit_input }
        payload: { $ref: '#/components/schemas/ConversationInboxInput' }
    ConversationInputControlCommand:
      type: object
      additionalProperties: false
      required: [request_id, target_id, expected_revision, kind, payload]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128 }
        target_id: { type: string, description: Input identity. }
        expected_revision: { type: integer, format: int64, minimum: 1, description: Current containing-conversation revision. }
        kind: { type: string, enum: [stop, continue, revalidate] }
        payload:
          type: object
          additionalProperties: false
          properties:
            instruction_version: { type: integer, minimum: 0, description: Required and positive for revalidate; must match the current focused work instruction version. Otherwise omit or use zero. }
    ConversationInboxEntry:
      type: object
      required: [id, sequence, conversation_id, conversation_revision, request_id, input, state, accepted_at]
      properties:
        question: { $ref: '#/components/schemas/ConversationQuestion' }
        context_unavailable: { type: boolean, description: Derived decision and result references withheld because actor or source access changed. Original user input and control state remain inspectable. }
        stopped_at: { type: string, format: date-time }
        hold_released_at: { type: string, format: date-time }
        revalidated_at: { type: string, format: date-time }
        revalidated_instruction_version: { type: integer, minimum: 1 }
        decision:
          $ref: '#/components/schemas/ConversationDecision'
        decision_issue:
          $ref: '#/components/schemas/ConversationDecisionIssue'
        delivery_issue:
          type: object
          required: [code, message, retry_at]
          properties:
            code: { type: string }
            message: { type: string }
            retry_at: { type: string, format: date-time }
        id: { type: string }
        sequence: { type: integer, format: int64 }
        conversation_id: { type: string }
        conversation_revision: { type: integer, format: int64 }
        request_id: { type: string }
        work_id: { type: string }
        instruction_version: { type: integer, minimum: 0 }
        input: { $ref: '#/components/schemas/ConversationInboxInput' }
        created_work_id: { type: string, description: Work admitted from this input. The original work_id still identifies the input's previous focus. }
        state: { type: string }
        run_id: { type: string }
        accepted_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        settled_at: { type: string, format: date-time }
        run_status: { type: string }
        result_reference: { type: string }
        incorporation: { type: string, enum: [answered, correction, new_work, worker_answer] }
        applied_at: { type: string, format: date-time }
        applied_instruction_version: { type: integer, minimum: 0 }
    ConversationDecision:
      type: object
      additionalProperties: false
      description: Durable foreground proposal. Only applied_at and applied_instruction_version confirm incorporation; a reply or recorded proposal alone does not.
      required: [kind, instruction_version]
      properties:
        kind: { type: string, enum: [answered, correction, new_work] }
        instruction_version: { type: integer, minimum: 0, description: Current work instruction version for a correction; otherwise zero. }
        expected_result: { type: string, maxLength: 4096, description: Required only for new_work. A proposed acceptance condition; the objective remains the exact accepted user input. }
    ConversationDecisionIssue:
      type: object
      required: [code, message, retry_at]
      properties:
        code: { type: string }
        message: { type: string }
        retry_at: { type: string, format: date-time }
    ConversationInboxPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ConversationInboxEntry' } }
        next_cursor: { type: integer, format: int64 }
        has_more: { type: boolean }
    ConversationImportManifest:
      type: object
      required: [version, legacy_name, conversation_id, source_sha256, authority, configuration_known, legacy_run_ids, imported_at]
      properties:
        version: { type: integer, const: 1 }
        legacy_name: { type: string }
        conversation_id: { type: string }
        source_sha256: { type: string }
        authority: { type: string, const: agent_control_store }
        configuration_known: { type: boolean }
        legacy_run_ids: { type: [array, 'null'], items: { type: string } }
        imported_at: { type: string, format: date-time }
    WorkerSession:
      type: object
      required: [id, revision, work_id, root_run_id, current_run_id, run_ids, assignment, assignment_version, status, stopped, closed]
      properties:
        question: { $ref: '#/components/schemas/WorkerQuestion' }
        id: { type: string }
        revision: { type: integer, format: int64 }
        work_id: { type: string }
        root_run_id: { type: string }
        current_run_id: { type: string }
        run_ids: { type: array, items: { type: string } }
        assignment_version: { type: integer, minimum: 1 }
        assignment:
          type: object
          required: [goal, expected_result, tools, depends_on, instruction_version, model_calls]
          properties:
            goal: { type: string }
            expected_result: { type: string }
            mode: { type: string, enum: [research, edit, test], description: Assignment execution mode. Older stored assignments may omit it. }
            reason: { type: string, maxLength: 2048, description: Recorded delegation rationale when supplied; absent for legacy assignments. }
            tools: { type: [array, 'null'], items: { type: string } }
            depends_on: { type: [array, 'null'], items: { type: string } }
            instruction_version: { type: integer }
            model_calls: { type: integer }
            profile_id: { type: string }
        status: { type: string }
        stopped: { type: boolean }
        closed: { type: boolean }
        result_reference: { type: string }
    WorkerCommand:
      type: object
      additionalProperties: false
      required: [request_id, target_id, expected_revision, kind, payload]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128 }
        target_id: { type: string }
        expected_revision: { type: integer, format: int64, minimum: 1 }
        kind: { type: string, enum: [message, stop, close, continue, answer] }
        payload:
          type: object
          additionalProperties: false
          properties:
            content: { type: string, minLength: 1, maxLength: 16000, description: Required for message, continue and answer. }
            question_id: { type: string, description: Required only for answer; identifies the exact pending question. }
    WorkerQuestion:
      type: object
      required: [id, worker_id, run_id, content, instruction_version, assignment_version, state, requested_at]
      properties:
        id: { type: string }
        worker_id: { type: string }
        run_id: { type: string }
        content: { type: string }
        instruction_version: { type: integer, minimum: 1 }
        assignment_version: { type: integer, minimum: 1 }
        state: { type: string, enum: [pending, answered] }
        requested_at: { type: string, format: date-time }
        answer_message_id: { type: string, description: Accepted answer's mailbox identity; consult its state for delivery and application. }
    WorkerMessage:
      type: object
      required: [id, worker_id, run_id, content, state, instruction_version, accepted_at]
      properties:
        question_id: { type: string }
        id: { type: string }
        worker_id: { type: string }
        run_id: { type: string }
        content: { type: string }
        state: { type: string, enum: [accepted, delivered, applied, abandoned] }
        instruction_version: { type: integer }
        accepted_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        applied_at: { type: string, format: date-time }
        abandoned_at: { type: string, format: date-time }
        resolution_reason: { type: string }
    WorkerMessagePage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkerMessage' } }
        next_cursor: { type: integer, format: int64 }
        has_more: { type: boolean }
    WorkChange:
      type: object
      required: [id, work_id, run_id, worker_run_id, kind, state, instruction_version, control_epoch, current, operation_count, validation_state, validation_count, integrated_count, available]
      properties:
        id: { type: string }
        work_id: { type: string }
        run_id: { type: string }
        worker_run_id: { type: string }
        kind: { type: string, enum: [proposal, candidate] }
        state: { type: string }
        instruction_version: { type: integer, format: int64 }
        control_epoch: { type: integer, format: int64 }
        current: { type: boolean }
        operation_count: { type: integer }
        validation_state: { type: string }
        validation_count: { type: integer }
        integration_id: { type: string }
        integrated_count: { type: integer }
        available: { type: boolean }
        limitation: { type: string }
    ConversationResultPage:
      type: object
      required: [id, run_id, instruction_version, control_epoch, status, independently_verified, evidence_steps, content, offset, next_offset, total_bytes, complete]
      properties:
        id: { type: string }
        run_id: { type: string }
        work_id: { type: string }
        worker_id: { type: string }
        conversation_id: { type: string }
        instruction_version: { type: integer, minimum: 0 }
        control_epoch: { type: integer, minimum: 0 }
        status: { type: string }
        independently_verified: { type: boolean }
        evidence_steps: { type: array, items: { type: integer } }
        content: { type: string }
        offset: { type: integer, minimum: 0 }
        next_offset: { type: integer, minimum: 0 }
        total_bytes: { type: integer, minimum: 0 }
        complete: { type: boolean }
    WorkChangeList:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkChange' } }
        next_cursor: { type: string }
        has_more: { type: boolean }
    WorkFileVersion:
      type: object
      required: [kind, bytes, mode]
      properties:
        kind: { type: string }
        bytes: { type: integer, format: int64 }
        mode: { type: integer }
        sha256: { type: string }
    WorkFileChange:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        kind: { type: string }
        base: { $ref: '#/components/schemas/WorkFileVersion' }
        result: { $ref: '#/components/schemas/WorkFileVersion' }
    WorkValidationCheck:
      type: object
      required: [id, state, request_digest, receipt_digest]
      properties:
        id: { type: string }
        state: { type: string }
        exit_code: { type: integer }
        request_digest: { type: string }
        receipt_digest: { type: string }
    WorkFileReceipt:
      type: object
      required: [ordinal, path, operation, state, dispatched, original_retained]
      properties:
        ordinal: { type: integer }
        path: { type: string }
        operation: { type: string }
        state: { type: string }
        dispatched: { type: boolean }
        original_retained: { type: boolean }
        displaced_digest: { type: string }
        result_digest: { type: string }
        error: { type: string }
    WorkChangeContent:
      type: object
      required: [sha256, bytes, offset, data]
      properties:
        sha256: { type: string }
        bytes: { type: integer, format: int64 }
        offset: { type: integer, format: int64 }
        data: { type: string, format: byte }
    WorkRecoveryFile:
      type: object
      required: [id, path, role, bytes]
      description: Observed retained content. Unconfirmed files do not prove a replacement occurred. Reads never restore files or settle uncertain work.
      properties:
        id: { type: string }
        path: { type: string }
        role: { type: string, enum: [displaced, unconfirmed] }
        bytes: { type: integer, format: int64 }
        sha256: { type: string }
        limitation: { type: string }
    WorkChangeDetail:
      type: object
      required: [change, view]
      properties:
        change: { $ref: '#/components/schemas/WorkChange' }
        view: { type: string, enum: [files, validation, integration, recovery, content, preserved] }
        files: { type: array, items: { $ref: '#/components/schemas/WorkFileChange' } }
        checks: { type: array, items: { $ref: '#/components/schemas/WorkValidationCheck' } }
        receipts: { type: array, items: { $ref: '#/components/schemas/WorkFileReceipt' } }
        recovery: { type: array, items: { $ref: '#/components/schemas/WorkRecoveryFile' } }
        content: { $ref: '#/components/schemas/WorkChangeContent' }
        next_offset: { type: integer, format: int64 }
        conflict_path: { type: string }
        error: { type: string }
    EffectiveConversationPreferences:
      type: object
      required: [model, delegation, restrictions, provenance, configuration_known, project_id, project_revision, resources]
      properties:
        folder:
          type: object
          required: [session, available, reason]
          description: Observed availability of the saved folder reference. No grant is restored by inspection.
          properties:
            session: { type: string }
            available: { type: boolean }
            reason: { type: string }
        user_preferences_revision: { type: integer, format: int64, minimum: 0 }
        project_id: { type: string }
        project_revision: { type: integer, format: int64 }
        resources: { type: array, items: { $ref: '#/components/schemas/ResourceResolution' } }
        configuration_known: { type: boolean }
        model: { type: string }
        delegation: { type: boolean }
        profile_id: { type: string }
        profile_revision: { type: integer }
        restrictions: { $ref: '#/components/schemas/AgentResourceRestrictions' }
        provenance: { type: object, additionalProperties: { type: string } }
    ControlEventPage:
      type: object
      required: [events, next_cursor, has_more, history_gap]
      properties:
        events:
          type: array
          items:
            type: object
            required: [cursor, target_id, revision, kind, recorded_at, payload]
            properties:
              cursor: { type: integer, format: int64 }
              target_id: { type: string }
              revision: { type: integer, format: int64 }
              kind: { type: string }
              recorded_at: { type: string, format: date-time }
              payload: { type: object, additionalProperties: true }
        next_cursor: { type: integer, format: int64 }
        has_more: { type: boolean }
        history_gap: { type: boolean }
        snapshot:
          oneOf:
            - { $ref: '#/components/schemas/CanonicalConversation' }
            - { $ref: '#/components/schemas/ConversationWorkItem' }
            - { $ref: '#/components/schemas/WorkerSession' }
    AgentSelection:
      type: object
      required: [id, revision]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 1 }
    AgentConversationConfiguration:
      type: object
      required: [version, profile, model, restrictions]
      properties:
        version: { type: integer, enum: [1] }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/AgentProfile' }
            - { type: 'null' }
        model: { type: string }
        restrictions: { $ref: '#/components/schemas/AgentResourceRestrictions' }
    AgentResourceRestrictions:
      type: object
      additionalProperties: false
      description: May only narrow the pinned profile. Omitted fields inherit; explicit empty lists disable that resource category. Instructions cannot widen these restrictions.
      properties:
        tools: { type: array, maxItems: 128, items: { $ref: '#/components/schemas/AgentToolReference' } }
        knowledge: { type: array, maxItems: 32, uniqueItems: true, items: { type: string } }
        computer: { type: boolean }
        execution: { $ref: '#/components/schemas/ExecutionPermissions', description: May only narrow profile and host ceilings. All false disables host tools; never creates access. }
    LinkedAgentTurn:
      type: object
      required: [turn, job]
      properties:
        turn: { $ref: '#/components/schemas/SessionTurn' }
        job: { $ref: '#/components/schemas/AgentRunResponse' }
    SessionTurn:
      type: object
      required: [id, prompt, model, profile, knowledge, max_tokens, status, phase, output]
      properties:
        agent: { $ref: '#/components/schemas/AgentSelection' }
        job_id: { type: string, description: Canonical job identity; observing it never executes work. }
        job_admission: { type: string, enum: [intent, linked], description: Durable conversation bookkeeping, not execution or consent. }
        id: { type: string }
        prompt: { type: string }
        attachments: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/SessionAttachmentReference' } }
        attachment_selections: { type: array, readOnly: true, items: { $ref: '#/components/schemas/AttachmentSelection' } }
        images: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/SessionImage' }, description: Pending or interrupted images; completed images are stored in the user message. }
        model: { type: string }
        profile: { type: string }
        knowledge: { type: boolean }
        knowledge_documents: { type: array, items: { type: string } }
        knowledge_sources: { type: array, items: { $ref: '#/components/schemas/KnowledgePassage' } }
        max_tokens: { type: integer }
        status: { type: string, enum: [pending, running, completed, failed, cancelled, interrupted, waiting_for_input, waiting_for_approval, waiting_for_children, uncertain] }
        phase: { type: string }
        output: { type: string }
        error: { type: string }
        error_code: { type: string, description: Optional machine-readable failure code retained for recovery. }
        finish_reason: { type: string }
        metrics: { $ref: '#/components/schemas/ChatTimings' }
    ChatSession:
      type: object
      required: [name, model_id, messages, created_at, updated_at]
      properties:
        canonical_id: { type: string, description: Stable conversation identity after the canonical ownership switch. }
        control_revision: { type: integer, format: int64, minimum: 1 }
        turn: { $ref: '#/components/schemas/SessionTurn' }
        jobs:
          type: array
          items:
            type: object
            required: [turn_id, job_id]
            properties:
              turn_id: { type: string }
              job_id: { type: string }
        name: { type: string }
        owner_id:
          type: string
          readOnly: true
          description: Authenticated owner assigned by the service. Absent for legacy/local sessions, which require sessions:all in authenticated mode.
        model_id: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/SessionMessage' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        seed: { type: integer, format: int64 }
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ChatMessage' }
        stream: { type: boolean, default: false }
        response_format:
          type: object
          additionalProperties: false
          required: [type]
          description: Explicit text/JSON constraint supported by the llama.cpp chat path. Constrained formats cannot be combined with tools; unsupported providers reject before generation.
          properties:
            type: { type: string, enum: [text, json_object, json_schema] }
            json_schema:
              type: object
              additionalProperties: false
              required: [name, schema]
              properties:
                name: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
                description: { type: string }
                strict: { type: boolean }
                schema: { type: object, additionalProperties: true, description: Bounded JSON schema with local references only. }
        stream_options:
          type: object
          properties:
            include_usage: { type: boolean, default: false }
        tools:
          type: array
          items:
            type: object
            required: [type, function]
            properties:
              type: { type: string, const: function }
              function:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  description: { type: string }
                  parameters: { type: object, additionalProperties: true }
        tool_choice: {}
        parallel_tool_calls:
          type: boolean
          description: Whether the runtime may produce multiple tool calls in one response. Omission preserves its default.
        use_knowledge_base: { type: boolean, default: false }
    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer, format: int64 }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [index, message]
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason: { type: [string, 'null'] }
    AnalysisSourceRef:
      type: object
      additionalProperties: false
      required: [document_id, revision]
      properties:
        document_id: { type: string, minLength: 1, maxLength: 256 }
        revision: { type: string, minLength: 1, maxLength: 128 }
        original_sha256: { type: string, pattern: '^[a-f0-9]{64}$', description: Required for retained originals; omitted only for legacy text. }
    AnalysisCitation:
      type: object
      required: [source, revision, unit_id, span, text_sha256]
      properties:
        source: { type: integer, minimum: 0, maximum: 15 }
        revision: { type: string }
        unit_id: { type: string }
        block_id: { type: string }
        span: { $ref: '#/components/schemas/DocumentSpan' }
        text_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    AnalysisUnitPair:
      type: object
      required: [alignment]
      properties:
        before_unit: { type: string }
        after_unit: { type: string }
        alignment: { type: string, enum: [sheet_name, position, unmatched] }
    DocumentAnalysisExport:
      type: object
      required: [analysis_id, format, content, sha256]
      properties:
        analysis_id: {type: string}
        format: {type: string, enum: [json, csv, markdown]}
        content: {type: string, description: At most 8 MiB of UTF-8 content}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    DocumentCompositionRequest:
      type: object
      required: [request_key, analysis_id, model, language]
      properties:
        request_key: {type: string}
        analysis_id: {type: string}
        model: {type: string}
        language: {type: string}
    DocumentComposition:
      type: object
      required: [id, analysis_id, plan_id, source_plan_id, model, state, attempt, completed_steps, total_steps, reviews_current, created_at, updated_at]
      properties:
        id: {type: string}
        analysis_id: {type: string}
        plan_id: {type: string}
        source_plan_id: {type: string}
        model: {$ref: '#/components/schemas/SynthesisModelIdentity'}
        state: {type: string, enum: [queued, running, interrupted, cancelled, failed, awaiting_review]}
        attempt: {type: integer, minimum: 0}
        completed_steps: {type: integer, minimum: 0, maximum: 65536}
        total_steps: {type: integer, minimum: 0, maximum: 65536}
        reviews_current: {type: boolean}
        error_code: {type: string}
        created_at: {type: string}
        updated_at: {type: string}
    DocumentCompositionHistory:
      type: object
      required: [analysis_id, items, next_offset]
      properties:
        analysis_id: {type: string}
        items: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/DocumentComposition'}}
        next_offset: {type: [integer, 'null'], minimum: 0}
    CompositionSection:
      type: object
      required: [text, contributors, verification]
      properties:
        text: {type: string}
        contributors: {type: integer, minimum: 0, maximum: 65536}
        verification: {type: string, const: source_identity_only}
    CompositionGapCount:
      type: object
      required: [code, count]
      properties:
        code: {type: string}
        count: {type: integer, minimum: 0}
    DocumentCompositionReport:
      type: object
      required: [composition, source_units, sections, gaps, extraction_gaps, candidate_gaps, unrepresented_batches, semantic_review_required]
      properties:
        composition: {$ref: '#/components/schemas/DocumentComposition'}
        source_units: {type: integer, minimum: 0}
        sections: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/CompositionSection'}}
        gaps: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/CompositionGapCount'}}
        extraction_gaps: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/CompositionGapCount'}}
        candidate_gaps: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/CompositionGapCount'}}
        unrepresented_batches: {type: integer, minimum: 0, maximum: 100000}
        semantic_review_required: {type: boolean, const: true}
    CompositionInput:
      type: object
      required: [id, batch, batch_id, candidate_index, candidate_sha256, review_revision, decision, section_checked]
      properties:
        id: {type: string}
        batch: {type: integer, minimum: 0, maximum: 100000}
        batch_id: {type: string}
        candidate_index: {type: integer, minimum: 0, maximum: 31}
        candidate_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        review_revision: {type: integer, minimum: 0, maximum: 256}
        decision: {type: string, enum: [keep, unreviewed]}
        section_checked: {type: boolean}
    CompositionEvidenceItem:
      type: object
      required: [input, candidate]
      properties:
        input: {$ref: '#/components/schemas/CompositionInput'}
        candidate: {$ref: '#/components/schemas/SynthesisCandidate'}
    DocumentCompositionEvidence:
      type: object
      required: [composition_id, plan_id, section, offset, total, items, next_offset]
      properties:
        composition_id: {type: string}
        plan_id: {type: string}
        section: {type: integer, minimum: 0, maximum: 3}
        offset: {type: integer, minimum: 0, maximum: 65536}
        total: {type: integer, minimum: 0, maximum: 65536}
        items: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/CompositionEvidenceItem'}}
        next_offset: {type: [integer, 'null'], minimum: 0}
    SynthesisDecision:
      type: object
      additionalProperties: false
      required: [decision, note]
      properties:
        decision: {type: string, enum: [unreviewed, keep, exclude]}
        note: {type: string, maxLength: 2048, description: At most 2048 UTF-8 bytes}
    SynthesisReviewRequest:
      type: object
      additionalProperties: false
      required: [id, batch, batch_id, response_sha256, expected_revision, section_checked, decisions]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        batch: {type: integer, minimum: 0, maximum: 100000}
        batch_id: {type: string}
        response_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        expected_revision: {type: integer, minimum: 0, maximum: 255}
        section_checked: {type: boolean}
        decisions: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/SynthesisDecision'}}
    SynthesisReview:
      type: object
      required: [analysis_id, batch, batch_id, response_sha256, revision, section_checked, decisions, author, updated_at]
      properties:
        analysis_id: {type: string}
        batch: {type: integer, minimum: 0}
        batch_id: {type: string}
        response_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        revision: {type: integer, minimum: 0, maximum: 256}
        section_checked: {type: boolean}
        decisions: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/SynthesisDecision'}}
        author: {type: string, description: Empty only for unsaved revision zero}
        updated_at: {type: string, description: UTC RFC3339 timestamp or empty for revision zero}
    SynthesisModelIdentity:
      type: object
      required: [model_id, model_sha256, runtime, language, context_tokens, response_tokens, protocol]
      properties:
        model_id: { type: string }
        model_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        runtime:
          type: object
          required: [name, revision]
          properties: { name: { type: string }, revision: { type: string }, sha256: { type: string } }
        language: { type: string }
        context_tokens: { type: integer, minimum: 1024 }
        response_tokens: { type: integer, minimum: 256 }
        protocol: { type: string, const: document-synthesis-candidates-v1 }
    SynthesisGap:
      type: object
      required: [source, code]
      properties: { source: { type: integer, minimum: 0, maximum: 15 }, unit_id: { type: string }, code: { type: string } }
    DocumentSynthesis:
      type: object
      required: [id, plan, model, primary_bytes, state, attempt, completed_batches, completed_units, unit_cursor, next_byte, review_required, created_at, updated_at]
      properties:
        id: { type: string }
        model: { $ref: '#/components/schemas/SynthesisModelIdentity' }
        primary_bytes: { type: integer, minimum: 1024, maximum: 8192 }
        state: { type: string, enum: [queued, running, interrupted, cancelled, failed, awaiting_review] }
        attempt: { type: integer, minimum: 0 }
        completed_batches: { type: integer, minimum: 0 }
        completed_units: { type: integer, minimum: 0 }
        unit_cursor: { type: integer, minimum: 0 }
        next_byte: { type: integer, minimum: 0 }
        review_required: { type: boolean }
        error_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        plan:
          type: object
          required: [id, version, workflow, sources, units, gaps]
          properties:
            id: { type: string }
            version: { type: string, const: document-analysis-v1 }
            workflow: { type: string, enum: [summary, requirements] }
            sources: { type: array, minItems: 1, maxItems: 16, items: { $ref: '#/components/schemas/AnalysisSourceRef' } }
            gaps: { type: array, items: { $ref: '#/components/schemas/SynthesisGap' } }
            units:
              type: array
              items:
                type: object
                required: [ordinal, source, unit_id, span, blocks]
                properties:
                  ordinal: { type: integer, minimum: 0 }
                  source: { type: integer, minimum: 0, maximum: 15 }
                  unit_id: { type: string }
                  span: { $ref: '#/components/schemas/DocumentSpan' }
                  blocks: { type: integer, minimum: 0 }
    SynthesisQuote:
      type: object
      required: [text, citation]
      properties:
        text: { type: string, maxLength: 8192 }
        citation: { $ref: '#/components/schemas/AnalysisCitation' }
    SynthesisCandidate:
      type: object
      required: [text, evidence, conditions, exceptions, verification]
      properties:
        text: { type: string, maxLength: 4096 }
        verification: { type: string, const: source_identity_only }
        evidence: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/SynthesisQuote' } }
        conditions: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/SynthesisQuote' } }
        exceptions: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/SynthesisQuote' } }
    SynthesisReceipt:
      type: object
      required: [method, batch_id, model_identity, unit_ordinal, primary, end_of_unit, prompt_tokens, response_sha256, result]
      properties:
        validation: { type: string, enum: [source-values-v2], description: Absent on historical receipts using literal numeric validation; old decisions are preserved. }
        method: { type: string, enum: [model, empty_source] }
        batch_id: { type: string }
        model_identity: { type: string }
        unit_ordinal: { type: integer, minimum: 0 }
        primary: { $ref: '#/components/schemas/DocumentSpan' }
        end_of_unit: { type: boolean }
        prompt_tokens: { type: integer, minimum: 0 }
        response_sha256: { type: string }
        result:
          type: object
          required: [batch_id, candidates, gaps, no_findings_reported, semantic_review_required]
          properties:
            batch_id: { type: string }
            candidates: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/SynthesisCandidate' } }
            gaps: { type: array, items: { $ref: '#/components/schemas/SynthesisGap' } }
            no_findings_reported: { type: boolean }
            semantic_review_required: { type: boolean }
    DocumentSynthesisResults:
      type: object
      required: [analysis_id, offset, next_offset, total_batches, receipts]
      properties:
        analysis_id: { type: string }
        offset: { type: integer, minimum: 0 }
        next_offset: { type: [integer, 'null'], minimum: 0 }
        total_batches: { type: integer, minimum: 0 }
        receipts: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/SynthesisReceipt' } }
    DocumentSynthesisHistory:
      type: object
      required: [analyses, next_offset]
      properties:
        next_offset: { type: [integer, 'null'], minimum: 1, maximum: 256 }
        analyses:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, state, documents, created_at, updated_at]
            properties:
              id: { type: string }
              state: { type: string, enum: [queued, running, interrupted, cancelled, failed, awaiting_review] }
              documents: { type: array, minItems: 1, maxItems: 16, items: { type: string } }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
    DocumentAnalysisHistory:
      type: object
      required: [analyses, next_offset]
      properties:
        next_offset: { type: [integer, 'null'], minimum: 1, maximum: 256 }
        analyses:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, state, documents, created_at, updated_at]
            properties:
              id: { type: string }
              state: { type: string, enum: [queued, running, interrupted, cancelled, failed, complete, incomplete] }
              documents: { type: array, minItems: 2, maxItems: 2, items: { type: string } }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
    DocumentAnalysis:
      type: object
      required: [id, plan, pairs, state, attempt, completed_steps, completed_units, review_required, created_at, updated_at]
      properties:
        id: { type: string }
        state: { type: string, enum: [queued, running, interrupted, cancelled, failed, complete, incomplete] }
        attempt: { type: integer, minimum: 0 }
        completed_steps: { type: integer, minimum: 0 }
        completed_units: { type: integer, minimum: 0 }
        review_required: { type: boolean }
        error_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pairs: { type: array, items: { $ref: '#/components/schemas/AnalysisUnitPair' } }
        plan:
          type: object
          required: [id, version, workflow, sources, units, gaps]
          properties:
            id: { type: string }
            version: { type: string, const: document-analysis-v1 }
            workflow: { type: string, const: comparison }
            sources: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/AnalysisSourceRef' } }
            units:
              type: array
              items:
                type: object
