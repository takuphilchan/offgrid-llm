        start_byte: { type: integer, minimum: 0 }
        end_byte: { type: integer, minimum: 0 }
    DocumentNavigationEntry:
      type: object
      required: [block_id, unit_id, block_offset, kind, title, needs_review]
      properties:
        block_id: { type: string }
        unit_id: { type: string }
