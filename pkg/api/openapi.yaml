        readers: { type: array, maxItems: 128, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 } }
        editors: { type: array, maxItems: 128, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 256 } }
