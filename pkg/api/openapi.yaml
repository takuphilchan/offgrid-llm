openapi: 3.1.0
info:
  title: OffGrid Local API
  version: 1.0.0
  description: Stable contract shared by the OffGrid service, web UI, desktop app, CLI, and external agents.
servers:
  - url: http://127.0.0.1:11611
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /v1/search:
    get:
      operationId: searchPublicModels
      description: Explicit online search of public GGUF repositories. Requires model permissions. No hardware size cap.
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Repository metadata; file lists are fetched on selection, not for every result.
          content:
            application/json:
              schema:
                type: object
                required: [total, results]
                properties:
                  total: { type: integer }
                  results: { type: array, items: { $ref: '#/components/schemas/DiscoveredModel' } }
        '400': { description: Invalid search query or limit. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: Upstream search unavailable; this is not an empty successful search. }
  /v1/search/files:
    get:
      operationId: listPublicModelFiles
      parameters:
        - { name: repo, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: GGUF choices with repository-scoped local IDs and exact sizes when available; first 1000 tree entries.
          content:
            application/json:
              schema:
                type: object
                required: [repo, files]
                properties:
                  repo: { type: string }
                  files: { type: array, items: { $ref: '#/components/schemas/DiscoveredFile' } }
        '400': { description: Invalid repository name. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: Upstream file discovery unavailable. }
  /api/v2/system:
    get:
      operationId: getSystemIdentity
      security: []
      responses:
        '200':
          description: Public product identity and implemented client contracts, without private runtime state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemIdentity' }
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Runtime health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/users/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authentication state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: Session cleared
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string } }
  /v1/models:
    get:
      operationId: listModels
      responses:
        '200':
          description: Installed models
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Model' }
  /v1/catalog:
    get:
      operationId: listCatalog
      responses:
        '200':
          description: Curated model catalog
          content:
            application/json:
              schema:
                type: object
                required: [total, models]
                properties:
                  total: { type: integer }
                  models:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogModel' }
  /v1/models/download:
    post:
      operationId: downloadModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelDownloadRequest' }
      responses:
        '200':
          description: Download accepted
          content:
            application/json:
              schema:
                type: object
                required: [success, status, file_name]
                properties:
                  success: { type: boolean }
                  status: { type: string }
                  file_name: { type: string }
                  message: { type: string }
        '409': { $ref: '#/components/responses/Error' }
  /v1/models/download/progress:
    get:
      operationId: getDownloadProgress
      responses:
        '200':
          description: Download state keyed by destination filename
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: '#/components/schemas/DownloadProgress' }
  /v1/models/download/cancel:
    post:
      operationId: cancelDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name]
              properties: { file_name: { type: string } }
      responses:
        '200':
          description: Cancellation result
          content:
            application/json:
              schema:
                type: object
                required: [success, cancelled]
                properties:
                  success: { type: boolean }
                  cancelled: { type: boolean }
                  message: { type: string }
  /v1/models/delete:
    delete:
      operationId: deleteModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id]
              properties: { model_id: { type: string } }
      responses:
        '200':
          description: Model deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: { success: { type: boolean }, message: { type: string } }
  /v1/models/verify:
    get:
      operationId: verifyModel
      parameters:
        - in: query
          name: model
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Full-file SHA-256 result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
  /v1/sessions:
    get:
      operationId: listSessions
      description: Lists owned conversations; sessions:all administrators and local single-user mode can also access unowned legacy conversations.
      responses:
        '200':
          description: Durable conversations
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/ChatSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSession
      description: Creates a conversation owned by the authenticated caller. Names are installation-wide unique; an existing name returns 409 without overwriting history. Client-supplied ownership is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
                model_id: { type: string }
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}:
    parameters:
      - $ref: '#/components/parameters/SessionName'
    get:
      operationId: getSession
      description: Returns 404 for an absent conversation or one owned by another user unless the caller has sessions:all.
      responses:
        '200':
          description: Durable conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSession
      description: Requires ownership or sessions:all; other users' conversations return 404. Returns 409 immediately while generation or another mutation is active; deletion never waits to erase a newly completed turn.
      responses:
        '200':
          description: Conversation deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: { success: { type: boolean }, message: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/generate:
    parameters:
      - $ref: '#/components/parameters/SessionName'
    post:
      operationId: generateSessionTurn
      description: Requires session ownership (or sessions:all) and chat permission. Requested knowledge additionally requires rag permission. With stream=true, sends SSE phase and delta events immediately, followed by done only after atomic persistence, or error without saving a partial exchange. Transport closure is not completion. Retrieval failures after SSE starts are error events. JSON generation returns 503 for unavailable retrieval and 422 for no evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1 }
                model_id: { type: string }
                use_knowledge_base: { type: boolean, default: false }
                stream: { type: boolean, default: false }
                durable: { type: boolean, default: false, description: Persist admission and run independently of the stream connection. Reconnect using the turn endpoints. }
                request_id: { type: string, maxLength: 128, description: Required for durable streaming. Reusing the current ID with identical input attaches to existing work; conflicting or superseded reuse returns 409. }
                profile: { type: string, enum: [interactive, extended], default: interactive, description: Streaming chat context profile. Interactive uses min(OFFGRID_CHAT_CONTEXT, effective service context); extended uses the service context. History is not truncated. }
                max_tokens: { type: integer, minimum: 1, maximum: 4096, default: 1024, description: Streaming response token budget. }
      responses:
        '200':
          description: Complete persisted turn as JSON, or SSE events ending with persisted done or error
          content:
            text/event-stream:
              description: Each SSE data field is a SessionStreamEvent JSON object. Heartbeat comments carry no data.
              x-event-schema: { $ref: '#/components/schemas/SessionStreamEvent' }
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [session, message]
                properties:
                  session: { $ref: '#/components/schemas/ChatSession' }
                  message: { $ref: '#/components/schemas/SessionMessage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/turn:
    parameters:
      - $ref: '#/components/parameters/SessionName'
    get:
      operationId: getSessionTurn
      responses:
        '200':
          description: Latest saved turn, or null. Restarted work is interrupted, never automatically replayed.
          content:
            application/json:
              schema:
                type: object
                required: [turn]
                properties:
                  turn:
                    anyOf:
                      - $ref: '#/components/schemas/SessionTurn'
                      - type: 'null'
        '404': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/turn/events:
    parameters:
      - $ref: '#/components/parameters/SessionName'
      - { name: id, in: query, required: true, schema: { type: string } }
    get:
      operationId: followSessionTurn
      description: Authorized snapshot recovery. Replays the entire current partial output, followed by live deltas. A new attachment must replace its previous partial output, not append a replay. Slow/disconnected readers do not control execution.
      responses:
        '200':
          description: Session phase/delta/done/error SSE stream
          content:
            text/event-stream:
              schema: { type: string }
        '409': { $ref: '#/components/responses/Error' }
  /v1/sessions/{name}/turn/cancel:
    parameters:
      - $ref: '#/components/parameters/SessionName'
    post:
      operationId: cancelSessionTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties: { id: { type: string } }
      responses:
        '200': { description: Cancellation requested for this exact turn. Refresh for terminal state. }
        '409': { $ref: '#/components/responses/Error' }
  /v1/documents/source:
    get:
      operationId: getDocumentSource
      description: Requires knowledge read permission. Returns retained extracted text, not the original file. Available while inference is disabled.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Safe text preview (maximum 200000 Unicode characters)
          content:
            application/json:
              schema:
                type: object
                required: [document, content, truncated]
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  content: { type: string }
                  truncated: { type: boolean }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      description: Requested knowledge requires rag permission in addition to chat. Disabled/failed retrieval returns 503 and no matching evidence returns 422 before inference or streaming begins. Turn off use_knowledge_base explicitly to request an ordinary answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: OpenAI-compatible non-streaming response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/documents:
    get:
      operationId: listDocuments
      responses:
        '200':
          description: Indexed documents
          content:
            application/json:
              schema:
                type: object
                required: [documents, count]
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                  count: { type: integer }
        '503': { $ref: '#/components/responses/Error' }
  /v1/rag/status:
    get:
      operationId: getRAGStatus
      description: Remains available when knowledge storage fails; reports enabled false and stats.storage_available false with an actionable error. No volatile fallback is used.
      responses:
        '200':
          description: Retrieval readiness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RAGStatus' }
  /v1/rag/enable:
    post:
      operationId: enableRAG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [embedding_model]
              properties: { embedding_model: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Knowledge retrieval enabled and activation persisted
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties: { success: { type: boolean }, message: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/documents/ingest:
    post:
      operationId: ingestDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        '200':
          description: Document indexed
          content:
            application/json:
              schema:
                type: object
                required: [success, document]
                properties: { success: { type: boolean }, document: { $ref: '#/components/schemas/Document' } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/documents/reindex:
    post:
      operationId: reindexDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id]
              properties: { document_id: { type: string } }
      responses:
        '200':
          description: Document reindexed
          content:
            application/json:
              schema:
                type: object
                required: [success, document]
                properties: { success: { type: boolean }, document: { $ref: '#/components/schemas/Document' } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/agents/run:
    post:
      operationId: runAgent
      description: Starts a checkpointed run. Use async for a background task and poll by run ID. New runs cannot contain preapproved tools; approve the pending call on its existing run instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRunRequest' }
      responses:
        '200':
          description: Governed agent run status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '202':
          description: Persisted background run accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/agents/tasks:
    get:
      operationId: listAgentTasks
      responses:
        '200':
          description: Durable agent task states
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AgentTask' } }
        '503': { $ref: '#/components/responses/Error' }
  /v1/agents/tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getAgentRun
      responses:
        '200':
          description: Authoritative run snapshot, including pending approval or uncertain tool call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAgentRun
      description: Owner-only removal of completed, failed or cancelled history. Active workers, pending approvals, interrupted and uncertain outcomes return 409. A durable scrubbed tombstone prevents event projections restoring history. Separate audit logs, backups and tool-created files are not erased.
      responses:
        '200':
          description: Removed from task and activity history
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties: { success: { type: boolean } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/agents/tasks/{id}/events:
    get:
      operationId: streamAgentProgress
      summary: Stream durable agent snapshots without owning execution
      description: Starts with the latest saved snapshot, then sends changed snapshots and heartbeat comments. Reconnect to recover the latest bounded preview; this is not an event-history replay endpoint. Disconnect does not cancel work. Only the run owner can subscribe.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE data frames contain AgentRunResponse plus type=status, done, approval_required or error. A preview is provisional, never a completed answer. Terminal snapshots close the stream.
          content:
            text/event-stream:
              schema: { type: string }
        '404': { description: Run not found or not owned by the current actor }
        '503': { description: Agent storage unavailable }
  /v1/agents/tasks/{id}/{action}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: action
        required: true
        schema: { type: string, enum: [approve, deny, cancel, resume, reconcile] }
    post:
      operationId: changeAgentRun
      description: Requires the initiating actor. Approve/deny require the pending approval_id. Resume never replays an uncertain tool call; reconcile requires its call_id and a human-verified result. Expired approvals can be refreshed with resume. Reconciliation records a result without executing the tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                approval_id: { type: string }
                call_id: { type: string }
                result: { type: string }
                async: { type: boolean, default: false }
      responses:
        '200':
          description: Persisted run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '202':
          description: Continuation accepted on the same run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/agents/tools:
    get:
      operationId: listAgentTools
      parameters:
        - in: query
          name: all
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Agent tool catalog
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    patch:
      operationId: setAgentToolEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, enabled]
              properties: { name: { type: string }, enabled: { type: boolean } }
      responses:
        '200': { description: Tool state persisted }
  /v1/agents/mcp:
    get:
      operationId: listMCPServers
      responses:
        '200': { description: Connected MCP servers }
    post:
      operationId: connectMCPServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties: { name: { type: string }, url: { type: string, format: uri } }
      responses:
        '200': { description: MCP server connected and persisted }
  /v1/agents/mcp/test:
    post:
      operationId: testMCPServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties: { url: { type: string, format: uri } }
      responses:
        '200': { description: MCP connection test result }
  /v1/capabilities:
    get:
      operationId: listCapabilities
      responses:
        '200': { description: Governed capability descriptors }
  /v1/integrations:
    get:
      operationId: listExternalAgentIntegrations
      parameters:
        - in: query
          name: model
          schema: { type: string }
          description: Installed chat model to evaluate for integration readiness.
      responses:
        '200':
          description: First-party external agent provider integrations and their runtime readiness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationList' }
  /v1/integrations/{id}/setup:
    get:
      operationId: getExternalAgentIntegrationSetup
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, enum: [hermes, openclaw] }
        - in: query
          name: model
          schema: { type: string }
        - in: query
          name: base_url
          schema: { type: string, format: uri }
        - in: query
          name: max_output_tokens
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Ready-to-copy native provider setup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSetupResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/computer/status:
    get:
      operationId: getComputerStatus
      responses:
        '200':
          description: Computer-use driver and safety-controller status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputerStatus' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionName:
      in: path
      name: name
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    DiscoveredModel:
      type: object
      required: [id, author, name, downloads, likes]
      properties:
        id: { type: string }
        author: { type: string }
        name: { type: string }
        downloads: { type: integer }
        likes: { type: integer }
    DiscoveredFile:
      type: object
      required: [id, file, size_bytes, quant, supported]
      properties:
        id: { type: string }
        file: { type: string }
        size_bytes: { type: integer }
        quant: { type: string }
        supported: { type: boolean }
        reason: { type: string }
    SystemIdentity:
      type: object
      required: [product, version, revision, api_version, ui_build_id, capabilities]
      properties:
        product: { type: string, const: offgrid }
        version: { type: string }
        revision: { type: string }
        api_version: { type: integer, const: 2 }
        ui_build_id: { type: string, description: SHA-256 of the served UI index; empty when not installed. }
        capabilities: { type: array, items: { type: string } }
    ChatStreamPhase:
      type: string
      enum: [queued, retrieving, loading, processing, generating, saving]
    ChatTimings:
      type: object
      required: [total_ms, ready_ms, queue_ms, load_ms, prompt_ms, first_text_ms, generation_ms, context_window]
      properties:
        total_ms: { type: integer }
        ready_ms: { type: integer }
        queue_ms: { type: integer }
        load_ms: { type: integer }
        prompt_ms: { type: integer }
        first_text_ms: { type: integer }
        generation_ms: { type: integer }
        context_window: { type: integer }
        completion_tokens: { type: integer }
        tokens_per_second: { type: number }
    SessionStreamEvent:
      oneOf:
        - type: object
          required: [type, phase]
          properties:
            type: { type: string, enum: [phase] }
            phase: { $ref: '#/components/schemas/ChatStreamPhase' }
        - type: object
          required: [type, delta]
          properties:
            type: { type: string, enum: [delta] }
            delta: { type: string }
        - type: object
          required: [type, session, message, metrics, finish_reason]
          properties:
            type: { type: string, enum: [done] }
            session: { $ref: '#/components/schemas/ChatSession' }
            message: { $ref: '#/components/schemas/SessionMessage' }
            metrics: { $ref: '#/components/schemas/ChatTimings' }
            finish_reason: { type: string, enum: [stop, length] }
        - type: object
          required: [type, error]
          properties:
            type: { type: string, enum: [error] }
            error: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              required: [message]
              properties:
                message: { type: string }
                type: { type: string }
                code: { type: string }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string }
        version: { type: string }
        uptime: { type: string }
        uptime_seconds: { type: integer, format: int64 }
        models: { type: object, additionalProperties: true }
        inference: { type: object, additionalProperties: true }
        system: { type: object, additionalProperties: true }
    PublicUser:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string }
    CurrentUser:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: { type: boolean }
        guest: { type: boolean }
        user:
          oneOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: 'null'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [user, expires_at, auth_method]
      properties:
        user: { $ref: '#/components/schemas/PublicUser' }
        token: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
        auth_method: { type: string }
    Model:
      type: object
      required: [id]
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer, format: int64 }
        owned_by: { type: string }
        type: { type: string }
        size: { type: integer, format: int64 }
        size_gb: { type: string }
        loaded: { type: boolean }
        context_window: { type: integer, minimum: 1 }
        context_length: { type: integer, minimum: 1, description: OpenAI-compatible alias for context_window. }
        capabilities:
          type: array
          items: { type: string }
        capability_status:
          type: object
          additionalProperties: { type: string, enum: [declared, tested, unsupported, unknown] }
    IntegrationStatus:
      type: object
      required: [id, provider_id, plugin_id, name, description, transport, documentation_url, minimum_context, recommended_context, requires_tools, capabilities, ready, status, context_window, warnings]
      properties:
        id: { type: string }
        provider_id: { type: string, const: offgrid }
        plugin_id: { type: string }
        name: { type: string }
        description: { type: string }
        transport: { type: string, const: openai-chat-completions }
        documentation_url: { type: string, format: uri }
        minimum_context: { type: integer, minimum: 1 }
        recommended_context: { type: integer, minimum: 1 }
        requires_tools: { type: boolean }
        capabilities: { type: array, items: { type: string } }
        ready: { type: boolean }
        status: { type: string, enum: [ready, needs_configuration] }
        model_id: { type: string }
        context_window: { type: integer, minimum: 1 }
        warnings: { type: array, items: { type: string } }
    IntegrationList:
      type: object
      required: [provider, base_url, integrations]
      properties:
        provider: { type: string, const: offgrid }
        base_url: { type: string, format: uri }
        integrations:
          type: array
          items: { $ref: '#/components/schemas/IntegrationStatus' }
    IntegrationSetup:
      type: object
      required: [provider_id, plugin_id, install_command, format, config_file, content, verify]
      properties:
        provider_id: { type: string, const: offgrid }
        plugin_id: { type: string }
        install_command: { type: string }
        format: { type: string }
        config_file: { type: string }
        content: { type: string }
        environment: { type: object, additionalProperties: { type: string } }
        verify: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
    IntegrationSetupResponse:
      type: object
      required: [integration, setup]
      properties:
        integration: { $ref: '#/components/schemas/IntegrationStatus' }
        setup: { $ref: '#/components/schemas/IntegrationSetup' }
    CatalogModel:
      type: object
      required: [id, name, description, category, parameters, size, size_bytes, repo, file, quant, min_ram_gb, recommended, provider, type, license]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        parameters: { type: string }
        size: { type: string }
        size_bytes: { type: integer, format: int64 }
        repo: { type: string }
        file: { type: string }
        quant: { type: string }
        min_ram_gb: { type: integer }
        recommended: { type: boolean }
        provider: { type: string }
        type: { type: string }
        license: { type: string }
    ModelDownloadRequest:
      type: object
      required: [repository]
      properties:
        enable_knowledge: { type: boolean, default: false, description: Requires knowledge management permission as well as model management. Persist activation intent and enable knowledge after installation without relying on an attached page. Empty repository is allowed only for an already installed model. }
        repository: { type: string }
        file_name: { type: string }
        quantization: { type: string }
        model_id:
          type: string
          description: Stable catalog ID used for the collision-free local filename.
          pattern: '^[A-Za-z0-9._-]+$'
          maxLength: 128
    DownloadProgress:
      type: object
      required: [file_name, bytes_total, bytes_done, percent, speed, started_at, status]
      properties:
        repository: { type: string }
        source_file: { type: string }
        model_id: { type: string }
        quantization: { type: string }
        enable_knowledge: { type: boolean }
        file_name: { type: string }
        bytes_total: { type: integer, format: int64 }
        bytes_done: { type: integer, format: int64 }
        percent: { type: number, minimum: 0, maximum: 100 }
        speed: { type: number, minimum: 0 }
        started_at: { type: integer, format: int64 }
        status: { type: string, enum: [downloading, finalizing, complete, failed, cancelled] }
        error: { type: string }
    Verification:
      type: object
      required: [model_id, file_name, size, size_gb, sha256, verified]
      properties:
        model_id: { type: string }
        file_name: { type: string }
        size: { type: integer, format: int64 }
        size_gb: { type: string }
        sha256: { type: string }
        verified: { type: boolean }
        message: { type: string }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, developer, user, assistant, tool] }
        content: { type: string }
        tool_call_id: { type: string }
        tool_calls:
          type: array
          items:
            type: object
            required: [id, type, function]
            properties:
              id: { type: string }
              type: { type: string, const: function }
              function:
                type: object
                required: [name, arguments]
                properties:
                  name: { type: string }
                  arguments: { type: string }
    SessionMessage:
      allOf:
        - $ref: '#/components/schemas/ChatMessage'
        - type: object
          required: [timestamp]
          properties: { timestamp: { type: string, format: date-time } }
    SessionTurn:
      type: object
      required: [id, prompt, model, profile, knowledge, max_tokens, status, phase, output]
      properties:
        id: { type: string }
        prompt: { type: string }
        model: { type: string }
        profile: { type: string }
        knowledge: { type: boolean }
        max_tokens: { type: integer }
        status: { type: string, enum: [pending, running, completed, failed, cancelled, interrupted] }
        phase: { type: string }
        output: { type: string }
        error: { type: string }
        finish_reason: { type: string }
        metrics: { $ref: '#/components/schemas/ChatTimings' }
    ChatSession:
      type: object
      required: [name, model_id, messages, created_at, updated_at]
      properties:
        turn: { $ref: '#/components/schemas/SessionTurn' }
        name: { type: string }
        owner_id:
          type: string
          readOnly: true
          description: Authenticated owner assigned by the service. Absent for legacy/local sessions, which require sessions:all in authenticated mode.
        model_id: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/SessionMessage' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        seed: { type: integer, format: int64 }
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ChatMessage' }
        stream: { type: boolean, default: false }
        stream_options:
          type: object
          properties:
            include_usage: { type: boolean, default: false }
        tools:
          type: array
          items:
            type: object
            required: [type, function]
            properties:
              type: { type: string, const: function }
              function:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  description: { type: string }
                  parameters: { type: object, additionalProperties: true }
        tool_choice: {}
        use_knowledge_base: { type: boolean, default: false }
    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer, format: int64 }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [index, message]
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason: { type: [string, 'null'] }
    Document:
      type: object
      required: [id, name, content_type, size, chunk_count, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        chunk_count: { type: integer }
        content_hash: { type: string }
        index_status: { type: string }
        last_error: { type: string }
        indexed_at: { type: string, format: date-time }
        source_retained: { type: boolean }
        created_at: { type: string, format: date-time }
    RAGStatus:
      type: object
      required: [enabled, stats]
      properties:
        enabled: { type: boolean }
        embedding_model: { type: string }
        stats: { type: object, additionalProperties: true }
    ToolApproval:
      type: object
      required: [id, run_id, call_id, actor, tool, arguments, canonical_arguments, expires_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        call_id: { type: string }
        actor: { type: string }
        tool: { type: string }
        arguments: { type: object, additionalProperties: true }
        canonical_arguments: { type: string, description: Exact canonical JSON for review without JavaScript numeric precision loss. }
        capability: { type: object, additionalProperties: true }
        expires_at: { type: string, format: date-time }
    AgentRunRequest:
      type: object
      required: [model, prompt]
      properties:
        model: { type: string }
        prompt: { type: string, minLength: 1 }
        style: { type: string, enum: [react, cot, plan-execute] }
        max_iterations: { type: integer, minimum: 1, maximum: 50 }
        async: { type: boolean, default: false }
        stream: { type: boolean, default: false, description: Streams run status and completed steps; disconnecting does not cancel execution. }
        system_prompt: { type: string }
    AgentStep:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        content: { type: string }
        tool_name: { type: string }
        tool_args: { type: string }
        tool_result: { type: string }
        timestamp: { type: string, format: date-time }
    AgentProgress:
      type: object
      required: [phase, iteration, preview, truncated, started_at, updated_at]
      properties:
        phase: { type: string, enum: [queued, loading, processing, generating, preparing_tool, tool, approval] }
        iteration: { type: integer }
        tool: { type: string }
        preview: { type: string, description: Bounded public model response preview, separate from completed output and model context. }
        truncated: { type: boolean }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentRunResponse:
      type: object
      required: [output, task_id, run_id, steps, status, pending_approval, resumable]
      properties:
        output: { type: string }
        task_id: { type: string }
        run_id: { type: string }
        status: { type: string, enum: [pending, running, waiting_for_approval, interrupted, uncertain, completed, failed, cancelled] }
        error: { type: string }
        pending_approval:
          anyOf:
            - { $ref: '#/components/schemas/ToolApproval' }
            - { type: 'null' }
        resumable: { type: boolean, description: Whether this run has a safe checkpoint for explicit resume. Legacy history without checkpoints is read-only. }
        started_at: { type: [string, 'null'], format: date-time }
        progress:
          anyOf:
            - { $ref: '#/components/schemas/AgentProgress' }
            - { type: 'null' }
        uncertain_call_id: { type: string }
        uncertain_call:
          type: object
          required: [tool, arguments]
          properties:
            tool: { type: string }
            arguments: { type: object, additionalProperties: true }
        steps: { type: array, items: { $ref: '#/components/schemas/AgentStep' } }
    AgentTask:
      type: object
      required: [id, prompt, status, created_at]
      properties:
        deletable: { type: boolean, description: Whether this actor may remove this terminal run or interrupted record without recovery state; the server rechecks ownership and execution state at deletion time. }
        id: { type: string }
        prompt: { type: string }
        status: { type: string }
        model: { type: string }
        actor: { type: string }
        pending_approval: { $ref: '#/components/schemas/ToolApproval' }
        result: { type: string }
        error: { type: string }
        steps: { type: array, items: { $ref: '#/components/schemas/AgentStep' } }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    ComputerStatus:
      type: object
      required: [available, emergency_stop, active_sessions]
      properties:
        available: { type: boolean }
        emergency_stop: { type: boolean }
        active_sessions: { type: integer, minimum: 0 }
