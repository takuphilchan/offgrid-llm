      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
    DocumentAnalysisAccepted:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    DocumentWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        source_index: { type: integer }
    DocumentSpan:
      type: object
      required: [start_byte, end_byte]
