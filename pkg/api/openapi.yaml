        total_blocks: { type: integer }
        offset: { type: integer }
        next_offset: { type: [integer, 'null'] }
        relationship_offset: { type: integer }
        next_relationship_offset: { type: [integer, 'null'] }
        total_relationships: { type: integer }
        navigation: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/DocumentNavigationEntry' } }
        navigation_offset: { type: integer, minimum: 0 }
        next_navigation_offset: { type: [integer, 'null'] }
        total_navigation: { type: integer, minimum: 0 }
        can_correct: { type: boolean }
    Document:
      type: object
      required: [id, name, content_type, size, chunk_count, created_at]
      properties:
        collection_id: { type: string, description: Current access collection; informational only, never grants permission. }
        collection_revision: { type: integer, minimum: 1, description: Current document binding revision, distinct from the collection audience revision. }
        extraction_revision: { type: string, description: Immutable structured extraction identity. Absent for legacy records until explicitly rebuilt. }
        evidence: { $ref: '#/components/schemas/DocumentEvidence' }
        id: { type: string }
        name: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        chunk_count: { type: integer }
        content_hash: { type: string }
        index_status: { type: string }
        last_error: { type: string }
        indexed_at: { type: string, format: date-time }
        source_retained: { type: boolean }
        original_retained: { type: boolean, description: Original uploaded bytes exist separately from extracted source text. Legacy documents may have text without an original. }
        created_at: { type: string, format: date-time }
    DocumentAttachmentImport:
      type: object
      additionalProperties: false
      required: [attachment]
      description: Explicitly copy a saved Chat source into an owned Knowledge import. Requires both source session access and Knowledge management permission. Does not start extraction. Without an Idempotency-Key, repeated acceptance of the same source returns the same import. Ordinary attachment upload never publishes to Knowledge.
      properties:
        attachment:
          type: object
          additionalProperties: false
          required: [session, id, sha256]
          properties:
            session: { type: string, minLength: 1, maxLength: 256 }
            id: { type: string, pattern: '^file-[a-f0-9]{32}$' }
            revision: { type: string, pattern: '^[a-f0-9]{64}$', description: Pins the extraction copied with its correction ancestry. }
            sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    DocumentRetention:
      type: object
