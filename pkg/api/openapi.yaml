        heading_level: { type: integer, minimum: 0, maximum: 9 }
        needs_review: { type: boolean }
    DocumentUnit:
      type: object
      required: [id, kind, index, span, state, parser_revision]
      properties:
        id: { type: string }
        kind: { type: string, enum: [page, slide, sheet, section] }
        index: { type: integer, minimum: 1 }
