              type: array
              items:
                type: object
                required: [source, code]
                properties:
                  source: { type: integer, minimum: 0, maximum: 1 }
                  unit_id: { type: string }
                  code: { type: string }
    AnalysisPreview:
      type: object
      description: At most 512 UTF-8 bytes from the start of a validated source citation. A preview never replaces the full citation.
      required: [text, span, text_sha256, truncated]
      properties:
        text: { type: string, maxLength: 512 }
        span: { $ref: '#/components/schemas/DocumentSpan' }
        text_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        truncated: { type: boolean }
    DocumentAnalysisResults:
      type: object
      required: [analysis_id, step, offset, next_offset, total_changes, result]
