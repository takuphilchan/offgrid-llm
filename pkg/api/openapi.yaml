          items:
            type: object
            properties:
              before: { $ref: '#/components/schemas/AnalysisPreview' }
              after: { $ref: '#/components/schemas/AnalysisPreview' }
        result:
          type: object
          required: [pair, changes, unchanged_lines, before_lines, after_lines, compared_cells, ambiguous_cells]
          properties:
            pair: { $ref: '#/components/schemas/AnalysisUnitPair' }
            unchanged_lines: { type: integer, minimum: 0 }
            before_lines: { type: integer, minimum: 0 }
            after_lines: { type: integer, minimum: 0 }
            compared_cells: { type: integer, minimum: 0 }
            ambiguous_cells: { type: integer, minimum: 0 }
            changes:
              type: array
              maxItems: 100
              items:
                type: object
                required: [kind]
                properties:
                  kind: { type: string, enum: [text_removed, text_added, cell_modified, cell_removed, cell_added] }
