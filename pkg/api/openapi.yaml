        span: { $ref: '#/components/schemas/DocumentSpan' }
        state: { type: string }
        parser_revision: { type: string }
        hidden: { type: boolean }
        merged_ranges: { type: array, items: { type: string } }
        block_count: { type: integer, minimum: 0 }
        review_blocks: { type: integer, minimum: 0 }
        figure_blocks: { type: integer, minimum: 0 }
        metadata_omitted: { type: boolean, description: Merged-range metadata exceeds this bounded reader projection; retained in the immutable extraction. }
    DocumentBlock:
      type: object
      required: [id, unit_id, kind, span, method, text, text_sha256, truncated, editable, metadata_omitted]
      properties:
        revisions:
          type: array
          maxItems: 2048
          description: Native tracked alternatives and provenance, excluded from current searchable text.
          items:
            type: object
            required: [id, kind, text]
            properties:
              id: { type: string }
              kind: { type: string, enum: [insertion, deletion, move_from, move_to, properties] }
              text: { type: string }
              author: { type: string }
              date: { type: string }
        form_field:
          type: object
          required: [name, value, kind]
          properties:
            label: { type: string }
            options:
              type: array
              maxItems: 4096
              items:
                type: object
                required: [index, label, selected]
                properties:
                  index: { type: integer, minimum: 0 }
                  label: { type: string }
                  selected: { type: boolean }
            name: { type: string }
            value: { type: string }
            kind: { type: string, enum: [unknown, button, checkbox, radio, combo, list, text, signature] }
            checked: { type: boolean }
            hidden: { type: boolean }
            native_bounds:
              type: array
              minItems: 4
              maxItems: 4
              items: { type: number }
              description: PDF user-space left, bottom, right, top in points; not screen coordinates.
        id: { type: string }
        unit_id: { type: string }
        kind: { type: string, enum: [heading, paragraph, list, table, row, cell, footnote, endnote, form_field, figure, caption, header, footer] }
        span: { $ref: '#/components/schemas/DocumentSpan' }
        method: { type: string, enum: [native, ocr, mixed, legacy, review, model] }
        heading_level: { type: integer, minimum: 1, maximum: 9 }
        review_state: { type: string }
        source_part: { type: string }
        figure:
          type: object
          required: [kind]
          properties:
            kind: { type: string }
            part: { type: string, description: Internal original-package part identity; never a filesystem path or a fetched URL. }
            relationship_id: { type: string }
            external: { type: boolean }
            name: { type: string }
            title: { type: string }
            description: { type: string, description: Authored alternative text, not verified image interpretation. }
        table:
          type: object
          required: [rows, columns]
          properties:
            rows: { type: integer, minimum: 0 }
            columns: { type: integer, minimum: 0 }
            first_row_style: { type: boolean, description: Formatting flag only; does not establish semantic headers. }
            first_column_style: { type: boolean }
        text: { type: string }
        text_sha256: { type: string, description: SHA-256 of the complete exact block text; never a hash of its truncated preview. }
        truncated: { type: boolean }
        editable: { type: boolean }
        metadata_omitted: { type: boolean, description: Oversized cell/warning metadata is omitted from this bounded projection. }
        warnings: { type: array, items: { $ref: '#/components/schemas/DocumentWarning' } }
        bounds:
          type: object
          required: [x, y, width, height, unit]
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }
            unit: { type: string, enum: [points, pixels, normalized] }
        cell:
          type: object
          required: [reference]
          properties:
            reference: { type: string }
            row_span: { type: integer, minimum: 1 }
            column_span: { type: integer, minimum: 1 }
            horizontal_merge: { type: boolean }
            vertical_merge: { type: boolean }
            value_type: { type: string }
            value: { type: string }
            display: { type: string }
            number_format: { type: string }
            number_format_id: { type: integer, minimum: 0 }
            display_state: { type: string, description: Stored text or a deterministic format projection; unrendered retains the raw value and does not claim original display fidelity. }
            date_system: { type: string, enum: ['1900', '1904'] }
            formula: { type: string }
            formula_type: { type: string }
            formula_reference: { type: string }
            shared_formula_index: { type: integer, minimum: 0 }
            formula_anchor: { type: string, description: Cell holding the shared formula definition; relative references are not evaluated or silently rewritten. }
            cached_value: { type: string }
            result_state: { type: string }
            merged_range: { type: string }
            hidden: { type: boolean }
            hidden_reasons: { type: array, items: { type: string, enum: [sheet, row, column] } }
    DocumentRelationship:
      type: object
      required: [from, to, kind]
      properties:
        from: { type: string }
        to: { type: string }
        kind: { type: string, enum: [parent, heading_for, header_for, footnote_for, caption_for, notes_for, continuation, alternative] }
    DocumentRuntimeIdentity:
      type: object
      required: [name, revision]
      properties:
        name: { type: string, maxLength: 256 }
        revision: { type: string, maxLength: 256 }
        sha256: { type: string, maxLength: 64 }
    DocumentStructurePage:
      type: object
      required: [document_id, revision, format, method, units, blocks, relationships, total_blocks, offset, next_offset, relationship_offset, next_relationship_offset, total_relationships, can_correct]
      properties:
        attachment_revision: { type: string }
        document_id: { type: string }
        revision: { type: string }
        parent_revision: { type: string }
        parsers: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/DocumentRuntimeIdentity' } }
        language_packs: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/DocumentRuntimeIdentity' } }
        provenance_omitted: { type: boolean, description: Some runtime identities exceeded the bounded reader projection. }
        original_sha256: { type: string }
        format: { type: string }
        method: { type: string }
        author: { type: string }
        created_at: { type: string, format: date-time }
        coverage: { $ref: '#/components/schemas/DocumentEvidence' }
        units: { type: array, items: { $ref: '#/components/schemas/DocumentUnit' } }
