        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59 }
        weekdays: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 }, description: 'Sunday=0; gaps skipped, repeated wall times use the first instant.' }
    AgentCalendarPreview:
      type: object
      required: [calendar, as_of, occurrences]
      properties:
        calendar: { $ref: '#/components/schemas/AgentCalendar' }
        as_of: { type: string, format: date-time }
        occurrences: { type: array, minItems: 3, maxItems: 3, items: { type: string, format: date-time } }
    AgentScheduleSettings:
      type: object
      additionalProperties: false
      required: [name, prompt, calendar, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        prompt: { type: string, minLength: 1, maxLength: 32000 }
        calendar: { $ref: '#/components/schemas/AgentCalendar' }
        enabled: { type: boolean }
    AgentScheduleWrite:
      type: object
      additionalProperties: false
      required: [settings, profile_id, profile_revision]
      properties:
        expected_revision: { type: integer, minimum: 0, description: Zero for creation; exact reviewed revision for update. }
        settings: { $ref: '#/components/schemas/AgentScheduleSettings' }
        profile_id: { type: string }
        profile_revision: { type: integer, minimum: 1 }
        execution: { $ref: '#/components/schemas/ExecutionReference' }
        max_iterations: { type: integer, minimum: 1, maximum: 50 }
    AgentSchedule:
      type: object
      required: [version, id, revision, digest, settings, next_at, created_at, model, max_iterations, profile]
      properties:
        version: { type: integer, enum: [1] }
        id: { type: string }
        revision: { type: integer, minimum: 1 }
        digest: { type: string }
        settings: { $ref: '#/components/schemas/AgentScheduleSettings' }
        next_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        model: { type: string }
        max_iterations: { type: integer }
        profile:
          type: object
          required: [id, revision, digest, name]
          properties:
            id: { type: string }
            revision: { type: integer }
            digest: { type: string }
            name: { type: string }
        execution: { oneOf: [{ $ref: '#/components/schemas/ExecutionReference' }, { type: 'null' }] }
        execution_workspace: { oneOf: [{ $ref: '#/components/schemas/ExecutionWorkspace' }, { type: 'null' }] }
    AgentScheduleOrigin:
      type: object
      required: [version, schedule, revision, occurrence, due_at]
      properties:
        version: { type: integer, enum: [1] }
        schedule: { type: string }
        revision: { type: integer, minimum: 1 }
        occurrence: { type: string }
        due_at: { type: string, format: date-time }
    AgentScheduleOccurrence:
      type: object
      required: [id, schedule, revision, due_at, state, request_id, request_digest, covered_until, created_at]
      properties:
        id: { type: string }
        schedule: { type: string }
        revision: { type: integer }
        due_at: { type: string, format: date-time }
        state: { type: string, enum: [claimed, admitted, completed, failed, cancelled, interrupted, blocked, missed] }
        reason: { type: string }
        job_id: { type: string, description: Existing canonical root; inspection only. }
        request_id: { type: string }
        request_digest: { type: string }
        covered_until: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    AgentMemoryWrite:
      type: object
      additionalProperties: false
      required: [operation, expected_revision, label, content]
      properties:
        operation: { type: string, minLength: 1, maxLength: 251, description: Stable user-edit idempotency identity; changed payload reuse is rejected. }
        id: { type: string }
        expected_revision: { type: integer, minimum: 0 }
        label: { type: string, minLength: 1, maxLength: 128 }
        content: { type: string, minLength: 1, maxLength: 8192 }
    AgentProfileDeletionReview:
      type: object
      required: [revision, jobs, memory, blocked_jobs, dependencies, token]
      properties:
        revision: { type: integer, minimum: 1 }
        jobs: { type: integer, minimum: 0 }
        memory: { type: integer, minimum: 0 }
        blocked_jobs: { type: integer, minimum: 0 }
        dependencies: { type: integer, minimum: 0 }
        token: { type: string, pattern: '^[a-f0-9]{64}$' }
    AgentProfileSettings:
      type: object
      additionalProperties: false
      required: [name, model, max_iterations]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 512 }
        instructions: { type: string, maxLength: 8192, description: Behavior only; cannot override broker or host authority. String limits are enforced in UTF-8 bytes. }
        model: { type: string }
        knowledge: { type: array, maxItems: 32, uniqueItems: true, items: { type: string }, description: Authorized existing Knowledge document IDs. }
        tools:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/AgentToolReference' }
        computer: { type: boolean, description: Makes host access discoverable; does not grant it. }
        execution: { $ref: '#/components/schemas/ExecutionPermissions', description: Optional ceiling for an explicitly selected host grant. Omitted inherits; never creates access. }
        skills: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/AgentSkillReference' }, description: Explicit owned immutable revisions. Content and scripts never grant authority. }
        max_iterations: { type: integer, minimum: 1, maximum: 50 }
        delegates: { type: array, maxItems: 4, uniqueItems: true, items: { type: string }, description: Owned direct child-profile IDs; pinned at task admission, no nested delegation or desktop input. }
    AgentProfileWrite:
      type: object
      additionalProperties: false
      required: [settings]
      properties:
        expected_revision: { type: integer, minimum: 0, description: Omit or zero for creation; exact current revision required for edits. }
        settings: { $ref: '#/components/schemas/AgentProfileSettings' }
    AgentProfile:
      type: object
      required: [id, workspace, actor, revision, digest, settings, archived, created_at]
      properties:
        id: { type: string }
        workspace: { type: string }
        actor: { type: string }
        revision: { type: integer, minimum: 1 }
        digest: { type: string }
        settings: { $ref: '#/components/schemas/AgentProfileSettings' }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
    AgentProfileValidation:
      type: object
      required: [ready, issues]
      properties:
        ready: { type: boolean, const: false }
        issues: { $ref: '#/components/schemas/EffectiveAgentProfile/properties/issues' }
    EffectiveAgentProfile:
      type: object
      required: [profile, ready, issues, capabilities]
      properties:
        profile: { $ref: '#/components/schemas/AgentProfile' }
        ready: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [kind, reference, code, message]
            properties:
              kind: { type: string }
              reference: { type: string }
              code: { type: string }
              message: { type: string }
        capabilities: { type: object, additionalProperties: { $ref: '#/components/schemas/AgentCapabilityIdentity' } }
        children: { type: object, additionalProperties: { $ref: '#/components/schemas/EffectiveAgentProfile' } }
    AgentStep:
      type: object
      properties:
        id: { type: integer }
        call_id: { type: string, readOnly: true, description: Runner-assigned invocation identity on canonical successful action records. Not supplied by the model. }
        type: { type: string }
        content: { type: string }
        tool_name: { type: string }
        tool_args: { type: string }
        provenance: { type: string, description: human_reported identifies a user reconciliation report, not independent tool verification. Legacy missing provenance makes no verification claim. }
        tool_result: { type: string, description: 'Canonical tool output. Native read failures encode NativeReadFailure JSON; do not infer effects from arbitrary provider text.' }
        authorization: { type: string, description: Durable record of exact approval or the immutable automatic session policy used for this action. }
        timestamp: { type: string, format: date-time }
    NativeReadFailure:
      type: object
      required: [status, code, message, effects, verified]
      description: Service-authored operation-local failure; earlier mutations remain recorded and are never replayed.
      properties:
        status: { type: string, enum: [failed] }
        code: { type: string }
        message: { type: string }
        effects: { type: string, enum: [none] }
        verified: { type: boolean, enum: [false] }
        recovery: { type: string }
        readiness: { $ref: '#/components/schemas/NativeApplicationReadiness' }
    NativeApplicationReadiness:
      type: string
      enum: [ready, starting, surface_unavailable, unsupported_identity, observation_unavailable]
    AgentProgress:
      type: object
      required: [phase, iteration, preview, truncated, started_at, updated_at]
      properties:
        phase: { type: string, enum: [queued, loading, processing, generating, preparing_tool, tool, approval] }
        iteration: { type: integer }
        tool: { type: string }
        preview: { type: string, description: Bounded public model response preview, separate from completed output and model context. }
        truncated: { type: boolean }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskActivity:
      type: object
      required: [sequence, task_id, status, completed_steps, snapshot_sha256, recorded_at]
      properties:
        sequence: { type: integer, format: int64 }
        task_id: { type: string }
        status: { type: string }
        phase: { type: string }
        tool: { type: string }
        iteration: { type: integer }
        completed_steps: { type: integer }
        approval_id: { type: string }
        executing_call: { type: string }
        snapshot_sha256: { type: string }
        verification_state: { type: string, description: Assessment from the same committed snapshot; absent for legacy or unknown versions. }
        recorded_at: { type: string, format: date-time }
    AgentInputRequest:
      type: object
      required: [id, call_id, kind, mode, target]
      properties:
        id: { type: string }
        call_id: { type: string }
        kind: { type: string, enum: [computer, workspace, worker_question, worker_clarification] }
        mode: { type: string, enum: [app, browser, desktop, read, edit, trusted, clarification] }
        target: { type: string, description: Model-proposed label only; never a host identity or consent grant. }
        url: { type: string, description: Proposed HTTPS address for local review. }
        previous_session: { type: string, description: Revoked session identity; never reusable authority. }
    TaskPlanItem:
      type: object
      required: [id, title, state]
      properties:
        id: { type: string }
        title: { type: string }
        state: { type: string, enum: [pending, active, done] }
        evidence_steps: { type: array, items: { type: integer } }
    TaskChild:
      type: object
      required: [id, spec]
      properties:
        id: { type: string }
        worker_id: { type: string, description: Stable resumable worker session; absent for legacy child runs. }
        invalidated: { type: boolean, description: The assignment or prerequisite result was superseded; retained output is evidence only. }
        status: { type: string, description: Last persisted child status, enum: [pending, running, waiting_for_approval, waiting_for_input, waiting_for_children, interrupted, uncertain, completed, failed, cancelled] }
        phase: { type: string, description: Last persisted public progress phase }
        spec:
          type: object
          required: [key, goal, depends_on, tools]
          properties:
            key: { type: string }
            goal: { type: string }
            depends_on: { type: array, items: { type: string } }
            tools: { type: array, items: { type: string } }
    TaskResourceUsage:
      type: object
      description: Run accounting. Root attempts inherit prior root charges; do not sum attempts. Child allocations include pending reservations and retained spent slots. Context preparation is part of the inference allowance, not an additional time charge.
      required: [model_call_limit, model_calls, child_call_allocations, charged_output_tokens, measured_output_tokens, charged_inference_ns, measured_inference_ns, context_preparations, measured_context_preparation_ns]
      properties:
        model_call_limit: { type: integer }
        model_calls: { type: integer }
        child_call_allocations: { type: integer }
        tools:
          type: object
          description: Service-observed invocation accounting; does not measure a process after its start invocation returns. Legacy reservations are conservative, not measured historical tool calls.
          required: [version, calls_per_decision, per_call_ns, reserved_calls, legacy_reserved_calls, charged_ns, measured_ns, unsettled_calls]
          properties:
            version: { type: integer }
            calls_per_decision: { type: integer }
            per_call_ns: { type: integer, format: int64 }
            reserved_calls: { type: integer }
            legacy_reserved_calls: { type: integer }
            charged_ns: { type: integer, format: int64 }
            measured_ns: { type: integer, format: int64 }
            unsettled_calls: { type: integer }
        processes:
          type: object
          description: Owned-process supervised elapsed time, not CPU time. Start reservations remain charged until authenticated terminal timing is received. Missing legacy timing does not mean zero usage. Invocation and process timings overlap and must not be summed as elapsed latency.
          required: [version, per_decision_ns, starts_per_decision, reserved_starts, legacy_reserved_starts, charged_ns, measured_ns, unsettled_starts]
          properties:
            version: { type: integer }
            per_decision_ns: { type: integer, format: int64 }
            starts_per_decision: { type: integer }
            reserved_starts: { type: integer }
            legacy_reserved_starts: { type: integer }
            charged_ns: { type: integer, format: int64 }
            measured_ns: { type: integer, format: int64 }
            unsettled_starts: { type: integer }
        storage:
          type: object
          description: Root work reservation for private worker copies in logical file bytes, not physical disk allocation or an OS quota. Unknown preparation retains its full reservation; only confirmed artifact release refunds it. Measurements are last observed retained content, not a live disk scan.
          required: [version, limit_bytes, charged_bytes, retained_copies, measured_bytes, unmeasured_copies]
          properties:
            version: { type: integer }
            limit_bytes: { type: integer, format: int64 }
            charged_bytes: { type: integer, format: int64 }
            retained_copies: { type: integer }
            measured_bytes: { type: integer, format: int64 }
            unmeasured_copies: { type: integer }
        input:
          type: object
          description: Absent for historical runs without input accounting; absence does not mean zero usage.
          required: [window, charged_tokens, measured_tokens, unmeasured_calls]
          properties:
            window: { type: integer }
            charged_tokens: { type: integer, format: int64 }
            measured_tokens: { type: integer, format: int64 }
            unmeasured_calls: { type: integer }
        charged_output_tokens: { type: integer, format: int64 }
        measured_output_tokens: { type: integer, format: int64 }
        charged_inference_ns: { type: integer, format: int64 }
        measured_inference_ns: { type: integer, format: int64 }
        context_preparations: { type: integer }
        measured_context_preparation_ns: { type: integer, format: int64 }
    TaskContext:
      type: object
      required: [window, estimated_tokens, compactions, archived_messages]
      properties:
        window: { type: integer }
        estimated_tokens: { type: integer, description: Conservative byte-based estimate, not tokenizer output }
        measured_prompt_tokens: { type: integer, description: Last runtime-reported prompt usage }
        compactions: { type: integer }
        archived_messages: { type: integer }
    OutcomeExpectation:
      type: object
      additionalProperties: false
      required: [id, title, kind]
      properties:
        id: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 512 }
        kind: { type: string, maxLength: 64, description: 'V1: application_open, control_text_equals, control_checked_equals. V2 additionally supports document_blank, document_text_equals and document_edit_matches. Other kinds remain unverified.' }
        application_id: { type: string }
        target_id: { type: string }
        element: { type: string }
        text: { type: string, maxLength: 16000, description: 'Exact text; server additionally enforces 4000 UTF-8 bytes for legacy control checks and 16000 UTF-8 bytes for document checks.' }
        checked: { type: boolean }
        document: { type: string, maxLength: 256, description: V2 observed document reference; never a window or title. }
        snapshot: { type: string, maxLength: 256, description: V2 exact host snapshot reference. }
        command: { type: string, maxLength: 256, description: V2 observed blank-creation command; no guessed future document. }
        edit_mode: { type: string, enum: [insert_text, replace_selection, replace_value], description: V2 noninterchangeable edit semantics. }
    OutcomeDocumentBinding:
      type: object
      additionalProperties: false
      required: [id, generation, container, editor, revision, snapshot]
      description: Service-authored v2 identity derived from canonical host evidence; never accepted as an input grant.
      properties:
        id: { type: string }
        generation: { type: string }
        container: { type: string }
        editor: { type: string }
        revision: { type: string }
        snapshot: { type: string }
        action_id: { type: string, description: Exactly one canonical native action. }
        operation: { type: string, enum: [new_document, new_tab, insert_text, replace_selection, replace_value] }
        preimage_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        expected_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    OutcomeBinding:
      type: object
      additionalProperties: false
      required: [session, target_sha256, observation, step]
      description: Server result only. Creation binds its resulting document after dispatch, never from model arguments.
      properties:
        session: { type: string }
        target_sha256: { type: string }
        identity: { type: string }
        observation: { type: string }
        step: { type: integer, minimum: 1 }
        document: { $ref: '#/components/schemas/OutcomeDocumentBinding' }
    OutcomeCheck:
      type: object
      required: [expectation, provenance, revision, state]
      properties:
        action_derived_call_id: { type: string, maxLength: 128, readOnly: true, description: Service-authored typed-action identity. Independent verification establishes a historical action milestone; not permission or proof that the entire request is complete. }
        expectation: { $ref: '#/components/schemas/OutcomeExpectation' }
        provenance: { type: string, enum: [caller_explicit, model_proposed] }
        revision: { type: integer }
        state: { type: string, enum: [pending, verified, unavailable] }
        reason: { type: string }
        evidence_steps: { type: array, items: { type: integer } }
        checked_at: { type: string, format: date-time }
        binding: { $ref: '#/components/schemas/OutcomeBinding' }
    WorkflowVerification:
      type: object
      description: Versioned check assessment, independent of execution status. Clients must treat unknown versions as unavailable, not certified.
      required: [version, revision, state, checks, instruction_id, instruction_sha256]
      properties:
        version: { type: integer, description: Known versions are 1 and 2. Preserve unknown versions but do not certify or execute them. }
        revision: { type: integer }
        instruction_id: { type: string }
        instruction_sha256: { type: string }
        state: { type: string, enum: [pending, partial, unverified, checks_passed] }
        checks: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/OutcomeCheck' } }
        history: { type: array, items: { type: object, additionalProperties: true } }
    ExecutionPairing:
      type: object
      additionalProperties: false
      required: [code, actor, workspace, protocol, version, expires_at]
      properties:
        code: { type: string, pattern: '^[0-9a-f]{64}$', description: Single-use secret; never send to a model or log. }
        actor: { type: string }
        workspace: { type: string }
        protocol: { type: integer, const: 1 }
        version: { type: string }
        expires_at: { type: string, format: date-time }
    ExecutionReference:
      type: object
      additionalProperties: false
      description: An address, not a grant. Requires a currently connected host with matching local approval. Never silently resolves against the service filesystem.
      required: [host, session, grant, revision]
      properties:
        host: { type: string, minLength: 1, maxLength: 256 }
        session: { type: string, minLength: 1, maxLength: 256 }
        grant: { type: string, minLength: 1, maxLength: 256 }
        revision: { type: integer, minimum: 1 }
    ExecutionPermissions:
      type: object
      additionalProperties: false
      required: [read, write, processes]
      properties:
        read: { type: boolean }
        write: { type: boolean }
        processes: { type: boolean }
    ExecutionWorkspace:
      type: object
      required: [reference, backend, root, directory, permissions]
      properties:
        project_context: { type: boolean, description: Approved host supports stable folder identity and bounded project configuration retrieval. }
        prepared_workers: { type: boolean, description: Admission-time host support for independently prepared workers. This metadata is not authority; live host policy is rechecked before preparation. }
        reference: { $ref: '#/components/schemas/ExecutionReference' }
        backend: { type: string }
        root: { type: string, description: Provider-local approved root, not a portable service path. }
        directory: { type: string, description: Session-local directory relative to the approved root. }
        permissions:
          type: object
          required: [read, write, processes]
          properties:
            read: { type: boolean }
            write: { type: boolean }
            processes: { type: boolean }
    AgentRunResponse:
      type: object
      required: [output, task_id, run_id, steps, status, pending_approval, resumable]
      properties:
        response_preview_allowed: { type: boolean, description: Whether the current generating snapshot may be displayed as provisional response text. Never a verified or completed answer. Absent or false means wait for committed output. Source workflows and computer actions remain buffered. }
        work_id: { type: string, description: Stable work identity, independent of this execution attempt. }
        schedule: { $ref: '#/components/schemas/AgentScheduleOrigin' }
        origin:
          type: object
          required: [workspace, conversation, turn_id]
          properties:
            workspace: { type: string }
            conversation: { type: string }
            turn_id: { type: string }
        admission_held: { type: boolean, description: Execution blocked until the conversation association is durable. Clients cannot release this hold. }
        can_recover_execution: { type: boolean, description: Saved original host intent may be inspected through recover-execution. Readiness is not authority or proof of a conclusive receipt. }
        execution: { $ref: '#/components/schemas/ExecutionReference' }
        execution_workspace: { $ref: '#/components/schemas/ExecutionWorkspace', description: Immutable admission-time host/root/backend/directory and capability ceiling. A snapshot is not current host readiness or a grant. }
        profile:
          type: object
          required: [id, revision, digest, name]
          properties:
            id: { type: string }
            revision: { type: integer, minimum: 1 }
            digest: { type: string }
            name: { type: string }
        verification: { $ref: '#/components/schemas/WorkflowVerification' }
        requested_computer_approval_mode: { type: string, enum: [ask_every_time, scoped_changes, full_task], description: User-selected policy from submission; not a computer access grant. }
        requested_computer_scope: { type: string, enum: [desktop, selected_window] }
        computer_scope: { type: string, enum: [desktop] }
        outcome: { type: string, enum: [answer_only], description: The model answered without executing external tools. Absence makes no verification claim. }
        prompt: { type: string, description: Included in the owner-scoped job GET only, not the event stream. }
        model: { type: string }
        error_code: { type: string }
        artifacts:
          type: array
          items:
            type: object
            required: [name, format, sha256, bytes, verified, check]
            properties:
              name: { type: string }
              format: { type: string, enum: [text, markdown, json, csv] }
              sha256: { type: string }
              bytes: { type: integer }
              rows: { type: integer }
              columns: { type: integer }
              verified: { type: boolean }
              check: { type: string, enum: [stored_bytes_sha256_and_format] }
        parent_id: { type: string }
        children: { type: [array, 'null'], items: { $ref: '#/components/schemas/TaskChild' } }
        can_steer: { type: boolean, description: Running parent work queues corrections for the next safe boundary; delegated work fences child dispatch and waits for operations to settle. Paused work stays paused. Children and unresolved parent effects cannot accept new instructions. Rechecked at admission. }
        instruction_version: { type: integer, minimum: 0, description: Applied instruction version; retained results from earlier versions are evidence rather than current completion. }
        control_epoch: { type: integer, minimum: 0, description: Persisted control generation advanced by accepted corrections and lifecycle commands. }
        conversation_configuration: { $ref: '#/components/schemas/AgentConversationConfiguration' }
        resource_usage: { $ref: '#/components/schemas/TaskResourceUsage' }
        plan: { type: [array, 'null'], items: { $ref: '#/components/schemas/TaskPlanItem' } }
        context:
          anyOf:
            - { $ref: '#/components/schemas/TaskContext' }
            - { type: 'null' }
        last_access:
          anyOf:
            - { $ref: '#/components/schemas/AgentInputRequest' }
            - { type: 'null' }
        instructions:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/TaskInstruction' }
        pending_instructions:
          type: [array, 'null']
          description: Durably accepted but not yet applied. Does not cancel an action already dispatched. Retained on pause/restart/uncertainty without implicit resume.
          items: { $ref: '#/components/schemas/TaskInstruction' }
        pending_input:
          anyOf:
            - { $ref: '#/components/schemas/AgentInputRequest' }
            - { type: 'null' }
        event_cursor: { type: string, pattern: '^[0-9]{1,19}$', description: Persisted activity cursor. Only advance it after applying the snapshot. }
        computer_session: { type: string }
        computer_approval_mode: { type: string, enum: [ask_every_time, scoped_changes, full_task] }
        computer_expected_text: { type: string }
        computer_session_expired: { type: boolean, description: Restart invalidated local consent. Historical work may be inspected or reconciled, but cannot resume against the old target. }
        output: { type: string }
        task_id: { type: string }
        run_id: { type: string }
        status: { type: string, enum: [pending, running, waiting_for_approval, waiting_for_input, waiting_for_children, interrupted, uncertain, completed, failed, cancelled] }
        error: { type: string }
        pending_approval:
          anyOf:
            - { $ref: '#/components/schemas/ToolApproval' }
            - { type: 'null' }
        resumable: { type: boolean, description: Whether this run has a safe checkpoint for explicit resume. Legacy history without checkpoints is read-only. }
        started_at: { type: [string, 'null'], format: date-time }
        progress:
          anyOf:
            - { $ref: '#/components/schemas/AgentProgress' }
            - { type: 'null' }
        uncertain_call_id: { type: string }
        uncertain_call:
          type: object
          required: [tool, arguments]
          properties:
            tool: { type: string }
            arguments: { type: object, additionalProperties: true }
        steps: { type: array, items: { $ref: '#/components/schemas/AgentStep' } }
    TaskInstruction:
      type: object
      required: [request_id, text, at]
      properties:
        request_id: { type: string }
        text: { type: string }
        at: { type: string, format: date-time }
    WorkItem:
      type: object
      required: [id, title, status, created_at, deletable]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 180 }
        status: { type: string }
        created_at: { type: string, format: date-time }
        model: { type: string }
        outcome: { type: string, enum: [answer_only] }
        deletable: { type: boolean }
        archivable: { type: boolean }
        archived_at: { type: string, format: date-time }
        protection: { type: string, enum: [unknown_effects, pending_approval, unsettled_action, recovery_checkpoint, active_work, child_work, ownership] }
        origin:
          type: object
          required: [workspace, conversation, turn_id]
          properties:
            workspace: { type: string }
            conversation: { type: string }
            turn_id: { type: string }
    WorkPage:
      type: object
      required: [items, counts, removable_count, has_more, scope]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/WorkItem' } }
        counts:
          type: object
          required: [attention, running, history, all]
          properties:
            attention: { type: integer, minimum: 0 }
            running: { type: integer, minimum: 0 }
            history: { type: integer, minimum: 0 }
            all: { type: integer, minimum: 0 }
            archived: { type: integer, minimum: 0 }
        removable_count: { type: integer, minimum: 0, description: Eligible items matching the current bucket and search across all pages. }
        next_cursor: { type: string }
        has_more: { type: boolean }
        scope: { type: string, enum: [actor_jobs] }
    AgentTask:
      type: object
      required: [id, prompt, status, created_at]
      properties:
        archived_at: { type: string, format: date-time, nullable: true }
        workflow: { $ref: '#/components/schemas/WorkflowVerification' }
        outcome: { type: string, enum: [answer_only], description: A model answer without executed external work, not evidence that an application task completed. }
        deletable: { type: boolean, description: Whether this actor may remove this terminal run or interrupted record without recovery state; the server rechecks ownership and execution state at deletion time. }
        id: { type: string }
        parent_id: { type: string }
        prompt: { type: string }
        status: { type: string }
        model: { type: string }
        actor: { type: string }
        pending_approval: { $ref: '#/components/schemas/ToolApproval' }
        result: { type: string }
        error: { type: string }
        error_code: { type: string, description: Stable machine-readable failure code for recovery and automation. }
        steps: { type: array, items: { $ref: '#/components/schemas/AgentStep' } }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    ComputerStatus:
      type: object
      required: [available, emergency_stop, active_sessions]
      properties:
        available: { type: boolean }
        emergency_stop: { type: boolean }
        active_sessions: { type: integer, minimum: 0 }
    ComputerCapabilities:
      type: object
      required: [protocol_version, preview, available, reason_code, local_only, approval_mode, approval_modes, drivers]
      properties:
        protocol_version: { type: integer, minimum: 1 }
        preview: { type: boolean }
        available: { type: boolean }
        reason_code: { type: string }
        local_only: { type: boolean }
        approval_mode: { type: string, enum: [supervised] }
        approval_modes:
          type: array
          items: { type: string, enum: [ask_every_time, scoped_changes, full_task] }
        drivers:
          type: array
          items:
            type: object
            required: [id, available, qualified]
            properties:
              id: { type: string }
              available: { type: boolean }
              qualified: { type: boolean }
