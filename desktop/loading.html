<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <title>OffGrid LLM - Starting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            color-scheme: dark;
            --background: #101011;
            --surface: #222223;
            --text: #f5f5f4;
            --muted: #b9b9b7;
            --faint: #989896;
            --border: rgba(255, 255, 255, .2);
            --action: #f5f5f4;
            --on-action: #111112;
        }

        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --background: #f7f7f6;
                --surface: #efefed;
                --text: #171717;
                --muted: #535351;
                --faint: #696967;
                --border: rgba(0, 0, 0, .2);
                --action: #171717;
                --on-action: #ffffff;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            color: var(--text);
        }
        
        .logo svg {
            width: 100%;
            height: 100%;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }
        
        .status {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 32px;
        }
        
        .spinner-container {
            position: relative;
            width: 48px;
            height: 48px;
            margin-bottom: 24px;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 2px solid var(--border);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .progress-text {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            max-width: 300px;
        }
        
        .version {
            position: absolute;
            bottom: 24px;
            font-size: 11px;
            color: var(--faint);
        }
        
        /* Error state */
        .error-container {
            display: none;
            text-align: center;
        }
        
        .error-container.visible {
            display: block;
        }
        
        .error-icon {
            width: 48px;
            height: 48px;
            color: var(--text);
            margin-bottom: 16px;
        }
        
        .error-message {
            color: var(--text);
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .retry-btn {
            background: var(--action);
            color: var(--on-action);
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .retry-btn:hover {
            opacity: .85;
        }

        .retry-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
</head>
<body>
    <div id="loading-state">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5"/>
                <path d="M2 12l10 5 10-5"/>
            </svg>
        </div>
        <h1>OffGrid LLM</h1>
        <p class="status" id="status-text">Connecting to OffGrid...</p>
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>
        <p class="progress-text" id="progress-text">Checking service and interface compatibility</p>
    </div>
    
    <div id="error-state" class="error-container">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p class="error-message" id="error-message">Server failed to start</p>
        <button class="retry-btn" onclick="retryConnection()">Retry</button>
    </div>
    <p class="version" id="version"></p>
    
    <script>
        // Show error state
        function showError(message) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').classList.add('visible');
            document.getElementById('error-message').textContent = message || 'Server failed to start';
        }
        
        // Retry connection
        async function retryConnection(navigate = true) {
            document.getElementById('error-state').classList.remove('visible');
            document.getElementById('loading-state').style.display = 'block';
            document.getElementById('status-text').textContent = 'Checking service compatibility...';
            try {
                if (!window.electron?.getBackendInfo) {
                    showError('The desktop bridge is unavailable. Restart the desktop application.');
                    return;
                }
                const backend = await window.electron.getBackendInfo();
                if (backend.state === 'ready') {
                    // Do not reload this loading file forever after a successful
                    // retry. The main process checked this exact backend origin.
                    if (navigate) window.location.assign(`${backend.url}/ui/`);
                } else {
                    showError(backend.reason || 'OffGrid is not ready. Check the service and retry.');
                }
            } catch {
                showError('Cannot check the OffGrid service. Restart the desktop application or retry.');
            }
        }
        
        // Set version if available
        if (window.electron && window.electron.getVersion) {
            window.electron.getVersion().then(version => {
                document.getElementById('version').textContent = 'OffGrid ' + version;
            }).catch(() => {});
        }
        // Initial navigation remains owned by the main-process startup wait.
        void retryConnection(false);
    </script>
</body>
</html>
