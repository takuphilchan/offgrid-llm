# Docker Compose - GPU Optimized Configuration
# For systems with NVIDIA GPUs
# Requires: nvidia-container-toolkit installed

services:
  offgrid-gpu:
    image: ${OFFGRID_IMAGE:-takuphilchan/offgrid-llm}:${OFFGRID_VERSION:-latest}-gpu
    pull_policy: missing
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OFFGRID_PORT:-11611}:11611"
    volumes:
      - offgrid-models:/var/lib/offgrid/models
      - offgrid-data:/var/lib/offgrid/data
    environment:
      OFFGRID_PORT: 11611
      OFFGRID_HOST: 0.0.0.0
      OFFGRID_ALLOW_UNAUTHENTICATED_REMOTE: "true"
      OFFGRID_MODELS_DIR: /var/lib/offgrid/models
      OFFGRID_DATA_DIR: /var/lib/offgrid/data
      OFFGRID_BIN_DIR: /var/lib/offgrid/bin
      OFFGRID_ENABLE_GPU: "true"
      # 0 asks llama.cpp to fit GPU layers to the model, KV cache, and VRAM.
      OFFGRID_GPU_LAYERS: ${OFFGRID_GPU_LAYERS:-0}
      OFFGRID_MAX_CONTEXT: ${OFFGRID_MAX_CONTEXT:-4096}
      OFFGRID_CHAT_CONTEXT: ${OFFGRID_CHAT_CONTEXT:-8192}
      # A residency limit, not an estimate based on GGUF file sizes alone.
      OFFGRID_MAX_MODELS: ${OFFGRID_MAX_MODELS:-1}
      OFFGRID_ADAPTIVE_CONTEXT: ${OFFGRID_ADAPTIVE_CONTEXT:-true}
      OFFGRID_KV_CACHE_TYPE: ${OFFGRID_KV_CACHE_TYPE:-q8_0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11611/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  offgrid-models:
    driver: local
  offgrid-data:
    driver: local
