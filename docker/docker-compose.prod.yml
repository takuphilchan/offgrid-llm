# Docker Compose - Production Configuration
# With SSL, monitoring, and high availability

services:
  offgrid:
    image: ${OFFGRID_IMAGE:-takuphilchan/offgrid-llm}:${OFFGRID_VERSION:-latest}
    pull_policy: missing
    init: true
    restart: unless-stopped
    expose:
      - "11611"
    volumes:
      - offgrid-models:/var/lib/offgrid/models
      - offgrid-data:/var/lib/offgrid/data
    environment:
      OFFGRID_PORT: 11611
      OFFGRID_HOST: 0.0.0.0
      OFFGRID_REQUIRE_AUTH: "true"
      OFFGRID_MULTI_USER: "true"
      OFFGRID_MODELS_DIR: /var/lib/offgrid/models
      OFFGRID_DATA_DIR: /var/lib/offgrid/data
      OFFGRID_BIN_DIR: /var/lib/offgrid/bin
      OFFGRID_GPU_LAYERS: 0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11611/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - monitoring

  nginx:
    image: nginx:1.27-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      offgrid:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # Optional: Prometheus monitoring
  prometheus:
    image: prom/prometheus:v2.55.1
    pull_policy: missing
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - backend
      - monitoring

  # Optional: Grafana dashboards
  grafana:
    image: grafana/grafana:11.4.0
    pull_policy: missing
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - monitoring
      - frontend

volumes:
  offgrid-models:
    driver: local
  offgrid-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
  monitoring:
    driver: bridge
