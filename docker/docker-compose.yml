# OffGrid LLM - Docker Compose Configuration
# Quick Start: docker compose up -d
# Documentation: See DOCKER_README.md and docs/setup/docker.md

services:
  offgrid:
    image: ${OFFGRID_IMAGE:-takuphilchan/offgrid-llm}:${OFFGRID_VERSION:-latest}
    pull_policy: missing
    init: true
    restart: unless-stopped
    ports:
      # Safe default: available only from this Docker host.
      - "127.0.0.1:${OFFGRID_PORT:-11611}:11611"
    volumes:
      # Persist models between container restarts
      - offgrid-models:/var/lib/offgrid/models
      # Persist session data
      - offgrid-data:/var/lib/offgrid/data
      # Optional: Mount local models directory (uncomment to use)
      # - ./models:/var/lib/offgrid/models
    environment:
      OFFGRID_PORT: 11611
      OFFGRID_HOST: 0.0.0.0
      # Explicit opt-in: this quick-start profile is unauthenticated.
      # Do not expose port 11611 beyond a trusted local network.
      OFFGRID_ALLOW_UNAUTHENTICATED_REMOTE: "true"
      OFFGRID_MODELS_DIR: /var/lib/offgrid/models
      OFFGRID_DATA_DIR: /var/lib/offgrid/data
      OFFGRID_BIN_DIR: /var/lib/offgrid/bin
      # GPU layers (0 = CPU only, increase for GPU)
      OFFGRID_GPU_LAYERS: 0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11611/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  offgrid-models:
    driver: local
  offgrid-data:
    driver: local
