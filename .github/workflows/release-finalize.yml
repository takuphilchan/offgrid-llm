name: Finalize existing release

# A repair branch retries publication without rebuilding artifacts that are
# already on the release. The tag and every expected asset must exist first.
on:
  push:
    branches:
      - 'release-finalize/v*'

permissions:
  contents: write

jobs:
  finalize:
    name: Verify assets, checksums, and release notes
    runs-on: ubuntu-latest
    steps:
      - name: Check out release automation
        uses: actions/checkout@v6

      - name: Resolve and verify existing release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/heads/release-finalize/}"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a release-finalize/vX.Y.Z branch"
            exit 1
          fi
          git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify published multi-platform container
        shell: bash
        run: |
          bash .github/scripts/verify-release-containers.sh \
            "${{ steps.release.outputs.version }}"

      - name: Verify and publish existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/finalize-release.sh \
            "${{ steps.release.outputs.version }}" "${{ github.repository }}"
