name: Release safety

on:
  workflow_run:
    workflows: ['Continuous integration']
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/workflows/release-safety.yml']

permissions:
  contents: read
  actions: write

jobs:
  stop-failed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Do not check out or execute code/artifacts from the triggering run.
      - name: Stop releases whose exact source failed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          # A deleted CI run is missing evidence, not a passing gate. Hold any
          # active tagged release with no CI record and request a fresh check.
          active="$(gh api "repos/$REPO/actions/workflows/release-unified.yml/runs?per_page=20")"
          while IFS=$'\t' read -r release_id sha tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            count="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq '.total_count')"
            if [[ "$count" == 0 ]]; then
              gh api --method POST "repos/$REPO/actions/runs/$release_id/cancel"
              gh workflow run ci.yml --repo "$REPO" --ref "$tag"
              echo "::warning::Held release $release_id and requested CI for $tag: no CI evidence remains for $sha"
            fi
          done < <(jq -r '.workflow_runs[] | select(.status != "completed") | [.id,.head_sha,.head_branch] | @tsv' <<< "$active")
          if [[ "$EVENT" == workflow_run ]]; then
            candidates="$(gh api "repos/$REPO/actions/runs/$CI_RUN_ID" --jq '[.]')"
          else
            candidates="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?per_page=20" --jq '.workflow_runs | group_by(.head_sha) | map(max_by(.run_number, .run_attempt))')"
          fi
          while IFS=$'\t' read -r ci_id sha; do
            [[ -n "$ci_id" ]] || continue
            failed_jobs="$(gh api "repos/$REPO/actions/runs/$ci_id/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "failure") | .id]')"
            [[ "$failed_jobs" != '[]' ]] || continue
            releases="$(gh api "repos/$REPO/actions/workflows/release-unified.yml/runs?head_sha=$sha&per_page=100")"
            while read -r release_id; do
              [[ -n "$release_id" ]] || continue
              gh api --method POST "repos/$REPO/actions/runs/$release_id/cancel"
              echo "Stopped release run $release_id: CI $ci_id failed for $sha"
            done < <(jq -r '.workflow_runs[] | select(.status != "completed") | .id' <<< "$releases")
            # Failed CI already has publicly accessible logs for signed-in users.
            # Surface bounded error lines as annotations for unauthenticated
            # diagnostics too; never emit tokens or download private workspaces.
            detail="$(while read -r job_id; do
              gh run view "$ci_id" --repo "$REPO" --job "$job_id" --log-failed 2>/dev/null | tail -n 35 | cut -f3- | sed -E 's/^[^ ]+ //' | cut -c 1-350 || true
            done < <(jq -r '.[]' <<< "$failed_jobs"))"
            if [[ -n "$detail" ]]; then
              detail="${detail//'%'/'%25'}"
              detail="${detail//$'\r'/'%0D'}"
              detail="${detail//$'\n'/'%0A'}"
              echo "::warning title=Failed CI $ci_id::$detail"
            fi
          done < <(jq -r '.[] | select((.head_branch == "main" or (.head_branch | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) and (.status == "in_progress" or .conclusion == "failure")) | [.id,.head_sha] | @tsv' <<< "$candidates")
