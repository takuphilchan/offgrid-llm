name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go, contract, UI, and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            desktop/package-lock.json
            computer/package-lock.json

      - name: Validate release automation
        run: |
          # Existing inline release scripts have ShellCheck debt. Validate
          # workflow syntax here and lint the new standalone script directly.
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/*.yml
          shellcheck .github/scripts/finalize-release.sh .github/scripts/resolve-release-context.sh .github/scripts/verify-release-containers.sh
          node dev/scripts/test-finalize-release.mjs
          node dev/scripts/test-release-asset-access.mjs
          node dev/scripts/test-release-context.mjs
          node dev/scripts/test-release-ci.mjs
          node dev/scripts/test-release-containers.mjs

      - name: Test Go packages
        run: go test ./...

      - name: Race-test privacy, storage, and request lifecycle
        run: go test -race ./internal/sessions ./internal/rag ./internal/server ./internal/users ./internal/cache ./internal/agents ./internal/runs ./internal/storage ./internal/serviceclient

      - name: Generate and build web UI
        working-directory: web/app
        run: |
          npm ci
          npm run api:check
          npm run check
          npm run build

      - name: Build runtime for integration and desktop packaging
        run: |
          mkdir -p build/linux
          version=$(node -p "require('./desktop/package.json').version")
          go build -trimpath -ldflags "-X main.Version=v$version" -o build/linux/offgrid ./cmd/offgrid

      - name: Run browser integration tests
        id: browser-tests
        shell: bash
        run: |
          mkdir -p /tmp/offgrid-ci/models /tmp/offgrid-ci/data
          OFFGRID_HOST=127.0.0.1 \
          OFFGRID_PORT=11611 \
          OFFGRID_MODELS_DIR=/tmp/offgrid-ci/models \
          OFFGRID_DATA_DIR=/tmp/offgrid-ci/data \
          OFFGRID_UI_DIR="$PWD/web/dist" \
          ./build/linux/offgrid serve >/tmp/offgrid-ci/server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11611/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              cat /tmp/offgrid-ci/server.log
              exit 1
            fi
            sleep 1
          done
          cd web/app
          npx playwright install --with-deps chromium
          OFFGRID_E2E_URL=http://127.0.0.1:11611 npm run test:e2e -- --reporter=line,github

      - name: Preserve failed browser diagnostics
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-diagnostics
          # This service uses isolated CI data, never a user's workspace.
          path: |
            web/app/test-results/
            /tmp/offgrid-ci/server.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Electron package
        working-directory: desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y libatspi2.0-dev libgtk-3-dev libjson-glib-dev at-spi2-core dbus-x11 xvfb xauth openbox
          npm ci --prefix ../computer --ignore-scripts
          npm ci
          node --check main.js
          node --check preload.js
          npm test
          npx electron-builder --dir --linux

      - name: Test real Linux AT-SPI controls in an isolated desktop
        env:
          OFFGRID_NATIVE_ISOLATED_DESKTOP: '1'
        run: xvfb-run -a dbus-run-session -- bash dev/scripts/test-native-linux.sh

      - name: Test browser companion contracts
        working-directory: computer
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Exercise packaged Linux desktop startup and recovery
        run: |
          # An unpacked archive does not have a root-owned setuid sandbox helper.
          # Configure this isolated CI package without disabling Chromium sandboxing.
          sudo chown root:root desktop/dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 desktop/dist/linux-unpacked/chrome-sandbox
          xvfb-run -a node dev/scripts/test-desktop-startup.mjs desktop/dist/linux-unpacked/offgrid-llm-desktop
          xvfb-run -a node dev/scripts/test-packaged-browser.mjs desktop/dist/linux-unpacked/offgrid-llm-desktop
          xvfb-run -a node dev/scripts/test-desktop-theme.mjs desktop/dist/linux-unpacked/offgrid-llm-desktop

      - name: Preserve desktop startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-startup-linux
          path: |
            /tmp/offgrid-desktop-startup-*/
            /tmp/offgrid-packaged-browser-*/
            /tmp/offgrid-desktop-theme-*/
          if-no-files-found: ignore
          retention-days: 7

  native-contracts:
    name: Native client and storage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test native CLI, persistence, and agent contracts
        # These tests use subprocesses and real local files, not OS emulation.
        # They do not substitute for installed-app or hardware qualification.
        run: go test ./cmd/offgrid ./cmd/offgrid-computer ./internal/computer ./internal/serviceclient ./internal/storage ./internal/rag ./internal/sessions ./internal/agents ./internal/models
      - name: Test isolated Windows UI Automation and local stop controls
        if: runner.os == 'Windows'
        env:
          OFFGRID_TEST_NATIVE_WINDOWS: '1'
        run: go test -p 1 -v -timeout 90s ./internal/computer ./cmd/offgrid-computer -run TestNative -count=1
      - name: Test desktop compatibility and IPC trust policy
        working-directory: desktop
        run: npm test

      - name: Build the shared renderer and matching native runtime
        shell: bash
        run: |
          cd web/app
          npm ci
          npm run build
          cd ../..
          version=$(node -p "require('./desktop/package.json').version")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p build/windows
            go build -trimpath -ldflags "-X main.Version=v$version" -o build/windows/offgrid.exe ./cmd/offgrid
          else
            mkdir -p build/macos
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOARCH="$arch" go build -trimpath -ldflags "-X main.Version=v$version" -o "build/macos/offgrid-$arch" ./cmd/offgrid
            done
          fi

      - name: Exercise packaged native desktop startup and recovery
        shell: bash
        env:
          # This is an isolated functional test, not signing qualification.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd desktop
          npm ci --prefix ../computer --ignore-scripts
          npm ci
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            npx electron-builder --dir --win --x64 --publish never
            node ../dev/scripts/test-desktop-startup.mjs 'dist/win-unpacked/OffGrid LLM Desktop.exe'
            node ../dev/scripts/test-packaged-browser.mjs 'dist/win-unpacked/OffGrid LLM Desktop.exe'
            node ../dev/scripts/test-desktop-theme.mjs 'dist/win-unpacked/OffGrid LLM Desktop.exe'
          else
            arch=$(node -p process.arch)
            npx electron-builder --dir --mac "--$arch" --publish never
            package_dir=mac
            if [[ "$arch" == arm64 ]]; then package_dir=mac-arm64; fi
            node ../dev/scripts/test-desktop-startup.mjs "dist/$package_dir/OffGrid LLM Desktop.app/Contents/MacOS/OffGrid LLM Desktop"
            node ../dev/scripts/test-packaged-browser.mjs "dist/$package_dir/OffGrid LLM Desktop.app/Contents/MacOS/OffGrid LLM Desktop"
            node ../dev/scripts/test-desktop-theme.mjs "dist/$package_dir/OffGrid LLM Desktop.app/Contents/MacOS/OffGrid LLM Desktop"
          fi

      - name: Build isolated Windows installer test package
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npx electron-builder --config installer-test.cjs --win nsis --x64 --publish never

      - name: Test Windows installation, reinstall and uninstall
        if: runner.os == 'Windows'
        # Native wizard capture uses Windows PowerShell's System.Drawing bridge.
        shell: powershell
        run: |
          ./dev/scripts/test-windows-installer-probe.ps1
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          ./dev/scripts/test-windows-installer.ps1 -InstallerPath "build/windows-installer-smoke/OffGrid Desktop Install Test-Setup-$version.exe"

      - name: Locate desktop diagnostics
        if: failure()
        id: desktop-diagnostics
        shell: bash
        run: node -e 'const temp=require("node:os").tmpdir().replaceAll("\\", "/"); console.log("path=" + temp + "/offgrid-desktop-startup-*/"); console.log("browser_path=" + temp + "/offgrid-packaged-browser-*/")' >> "$GITHUB_OUTPUT"

      - name: Preserve desktop startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-startup-${{ matrix.os }}
          path: |
            ${{ steps.desktop-diagnostics.outputs.path }}
            ${{ steps.desktop-diagnostics.outputs.browser_path }}
          if-no-files-found: ignore
          retention-days: 7
