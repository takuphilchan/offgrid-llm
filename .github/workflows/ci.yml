name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tool-parser:
    name: Pinned native tool parser and grammar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test patch admission
        run: python3 -m unittest scripts/test/test_llama_patch.py
      - name: Build and test pinned CPU parser without models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/llama-parser
          git -C build/llama-parser init
          git -C build/llama-parser remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C build/llama-parser fetch --depth 1 origin b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9
          git -C build/llama-parser checkout --detach FETCH_HEAD
          sh runtimes/llama-cpp/apply-patches.sh "$PWD/build/llama-parser"
          cmake -S build/llama-parser -B build/llama-parser/build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_UI=OFF
          cmake --build build/llama-parser/build --parallel 3 --target test-chat-auto-parser
          cd build/llama-parser
          build/bin/test-chat-auto-parser

  python-sdk:
    name: Python SDK and worker protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated test and build tools
        run: python -m pip install pytest setuptools wheel
      - name: Test client and worker protocol without a live service
        env:
          PYTHONPATH: sdk/python
        run: python -m pytest -q sdk/python/tests/test_client.py runtimes/python/tests
      - name: Test external provider catalog without network or installed agents
        run: python -m unittest scripts/test/test_hermes_provider.py scripts/test/test_external_model_matrix.py scripts/test/test_external_agent_oracle.py scripts/test/test_external_agent_fixture.py scripts/test/test_tool_result_fidelity.py scripts/test/test_verification_hooks.py
      - name: Build and verify public client wheel
        shell: bash
        run: |
          mkdir -p build/python-ci/wheels
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir build/python-ci/wheels sdk/python
          python scripts/test/check-python-package.py build/python-ci/wheels/offgrid-*.whl
      - name: Compile Python sources
        run: python -m compileall -q sdk/python runtimes/python

  test:
    name: Go, contract, UI, and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
            apps/computer/package-lock.json

      - name: Validate release automation
        run: |
          # Existing inline release scripts have ShellCheck debt. Validate
          # workflow syntax here and lint the new standalone script directly.
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= .github/workflows/*.yml
          shellcheck .github/scripts/finalize-release.sh .github/scripts/resolve-release-context.sh .github/scripts/verify-release-containers.sh
          node scripts/release/test-finalize-release.mjs
          node scripts/release/test-release-asset-access.mjs
          node scripts/release/test-release-context.mjs
          node scripts/release/test-release-ci.mjs
          node scripts/release/test-release-containers.mjs

      - name: Check maintained documentation
        run: |
          node --test scripts/maintenance/check-docs.test.mjs
          node --test scripts/maintenance/check-community-templates.test.mjs
          node scripts/maintenance/check-docs.mjs

      - name: Check frozen provider-workflow scoring contract
        run: node --test scripts/test/score-provider-workflows.test.mjs

      - name: Check repository generated-output boundaries
        run: |
          node --test scripts/maintenance/check-repository-hygiene.test.mjs
          node scripts/maintenance/check-repository-hygiene.mjs

      - name: Check maintained application source paths
        run: |
          node --test scripts/maintenance/check-application-layout.test.mjs
          node scripts/maintenance/check-application-layout.mjs

      - name: Check maintained developer and Python source paths
        run: |
          node --test scripts/maintenance/check-developer-layout.test.mjs
          node scripts/maintenance/check-developer-layout.mjs

      - name: Check handwritten source-size ratchet
        run: |
          node --test scripts/maintenance/check-source-size.test.mjs
          node scripts/maintenance/check-source-size.mjs

      - name: Check Unix installer entry points without installation
        run: |
          bash scripts/maintenance/test-installer-entrypoints.sh
          bash scripts/maintenance/test-executor-install.sh

      - name: Test Go packages
        run: go test ./...

      - name: Race-test privacy, storage, and request lifecycle
        run: go test -race ./internal/sessions ./internal/rag ./internal/server ./internal/users ./internal/cache ./internal/agents ./internal/runs ./internal/storage ./internal/serviceclient ./internal/models ./internal/audio ./internal/computer ./internal/execution ./internal/inference ./internal/integrations/... ./internal/cli ./internal/power ./internal/degradation ./cmd/offgrid ./cmd/offgrid-executor

      - name: Generate and build web UI
        working-directory: apps/web
        run: |
          npm ci
          npm run api:check
          npm run check
          npm run build

      - name: Test first-party OpenClaw provider controls
        run: node --test scripts/test/test-openclaw-provider.mjs scripts/test/test-verification-hooks.mjs

      - name: Build runtime for integration and desktop packaging
        run: |
          mkdir -p build/linux
          version=$(node -p "require('./apps/desktop/package.json').version")
          go build -trimpath -ldflags "-X main.Version=v$version" -o build/linux/offgrid ./cmd/offgrid

      - name: Run browser integration tests
        id: browser-tests
        shell: bash
        run: |
          mkdir -p /tmp/offgrid-ci/models /tmp/offgrid-ci/data
          OFFGRID_HOST=127.0.0.1 \
          OFFGRID_PORT=11611 \
          OFFGRID_MODELS_DIR=/tmp/offgrid-ci/models \
          OFFGRID_DATA_DIR=/tmp/offgrid-ci/data \
          OFFGRID_UI_DIR="$PWD/apps/web/dist" \
          ./build/linux/offgrid serve >/tmp/offgrid-ci/server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11611/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              cat /tmp/offgrid-ci/server.log
              exit 1
            fi
            sleep 1
          done
          cd apps/web
          npx playwright install --with-deps chromium
          OFFGRID_E2E_URL=http://127.0.0.1:11611 npm run test:e2e -- --reporter=line,github

      - name: Test real-service speech acquisition and restart recovery
        run: |
          go build -tags modeltestfixtures -o build/linux/offgrid-model-fixtures ./cmd/offgrid
          node scripts/test/test-web-workspace.mjs build/linux/offgrid-model-fixtures --model-fixtures model-acquisition.spec.ts --workers=1
          node scripts/test/test-web-workspace.mjs build/linux/offgrid-model-fixtures --model-fixtures model-restart.spec.ts --workers=1

      - name: Preserve failed browser diagnostics
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-diagnostics
          # This service uses isolated CI data, never a user's workspace.
          path: |
            apps/web/test-results/
            /tmp/offgrid-ci/server.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Electron package
        working-directory: apps/desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y libatspi2.0-dev libgtk-3-dev libjson-glib-dev at-spi2-core dbus-x11 xvfb xauth openbox
          npm ci --prefix ../computer --ignore-scripts
          npm ci
          node --check main.js
          node --check preload.js
          npm test
          npx electron-builder --dir --linux

      - name: Test real Linux AT-SPI controls in an isolated desktop
        env:
          OFFGRID_NATIVE_ISOLATED_DESKTOP: '1'
        run: xvfb-run -a dbus-run-session -- bash scripts/test/test-native-linux.sh

      - name: Test browser companion contracts
        working-directory: apps/computer
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Exercise packaged Linux desktop startup and recovery
        run: |
          # An unpacked archive does not have a root-owned setuid sandbox helper.
          # Configure this isolated CI package without disabling Chromium sandboxing.
          sudo chown root:root apps/desktop/dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 apps/desktop/dist/linux-unpacked/chrome-sandbox
          xvfb-run -a node scripts/test/test-desktop-startup.mjs apps/desktop/dist/linux-unpacked/offgrid-llm-desktop
          xvfb-run -a node scripts/test/test-packaged-browser.mjs apps/desktop/dist/linux-unpacked/offgrid-llm-desktop
          xvfb-run -a node scripts/test/test-desktop-theme.mjs apps/desktop/dist/linux-unpacked/offgrid-llm-desktop

      - name: Preserve desktop startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-startup-linux
          path: |
            /tmp/offgrid-desktop-startup-*/
            /tmp/offgrid-packaged-browser-*/
            /tmp/offgrid-desktop-theme-*/
          if-no-files-found: ignore
          retention-days: 7

  native-contracts:
    name: Native client and storage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test native CLI, persistence, and agent contracts
        # These tests use subprocesses and real local files, not OS emulation.
        # They do not substitute for installed-app or hardware qualification.
        run: go test ./cmd/offgrid ./cmd/offgrid-computer ./cmd/offgrid-executor ./internal/execution ./internal/computer ./internal/serviceclient ./internal/storage ./internal/rag ./internal/sessions ./internal/agents ./internal/models ./internal/integrations/...
      - name: Test isolated Windows UI Automation and local stop controls
        if: runner.os == 'Windows'
        env:
          OFFGRID_TEST_NATIVE_WINDOWS: '1'
        run: go test -p 1 -v -timeout 90s ./internal/computer ./cmd/offgrid-computer -run TestNative -count=1
      - name: Test desktop compatibility and IPC trust policy
        working-directory: apps/desktop
        run: npm test

      - name: Build the shared renderer and matching native runtime
        shell: bash
        run: |
          cd apps/web
          npm ci
          npm run build
          cd ../..
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p build/windows
            go build -trimpath -ldflags "-X main.Version=v$version" -o build/windows/offgrid.exe ./cmd/offgrid
          else
            mkdir -p build/macos
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOARCH="$arch" go build -trimpath -ldflags "-X main.Version=v$version" -o "build/macos/offgrid-$arch" ./cmd/offgrid
            done
          fi

      - name: Exercise packaged native desktop startup and recovery
        shell: bash
        env:
          # This is an isolated functional test, not signing qualification.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd apps/desktop
          npm ci --prefix ../computer --ignore-scripts
          npm ci
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            npx electron-builder --dir --win --x64 --publish never
            node ../../scripts/test/test-desktop-startup.mjs 'dist/win-unpacked/OffGrid LLM Desktop.exe'
            node ../../scripts/test/test-packaged-browser.mjs 'dist/win-unpacked/OffGrid LLM Desktop.exe'
            node ../../scripts/test/test-desktop-theme.mjs 'dist/win-unpacked/OffGrid LLM Desktop.exe'
            node ../../scripts/test/test-desktop-access.mjs 'dist/win-unpacked/OffGrid LLM Desktop.exe'
          else
            arch=$(node -p process.arch)
            npx electron-builder --dir --mac "--$arch" --publish never
            package_dir=mac
            if [[ "$arch" == arm64 ]]; then package_dir=mac-arm64; fi
            node ../../scripts/test/test-desktop-startup.mjs "dist/$package_dir/OffGrid LLM Desktop.app/Contents/MacOS/OffGrid LLM Desktop"
            node ../../scripts/test/test-packaged-browser.mjs "dist/$package_dir/OffGrid LLM Desktop.app/Contents/MacOS/OffGrid LLM Desktop"
            node ../../scripts/test/test-desktop-theme.mjs "dist/$package_dir/OffGrid LLM Desktop.app/Contents/MacOS/OffGrid LLM Desktop"
          fi

      - name: Build isolated Windows installer test package
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: npx electron-builder --config installer-test.cjs --win nsis --x64 --publish never

      - name: Test Windows installation, reinstall and uninstall
        if: runner.os == 'Windows'
        # Native wizard capture uses Windows PowerShell's System.Drawing bridge.
        shell: powershell
        run: |
          ./scripts/release/test-windows-installer-probe.ps1
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          ./scripts/release/test-windows-installer.ps1 -InstallerPath "build/windows-installer-smoke/OffGrid Desktop Install Test-Setup-$version.exe"

      - name: Locate desktop diagnostics
        if: failure()
        id: desktop-diagnostics
        shell: bash
        run: |
          node -e 'const temp=require("node:os").tmpdir().replaceAll("\\", "/"); console.log("path=" + temp + "/offgrid-desktop-startup-*/"); console.log("browser_path=" + temp + "/offgrid-packaged-browser-*/"); console.log("installer_path=" + temp + "/offgrid-install-*/diagnostics/"); console.log("probe_path=" + temp + "/offgrid-wizard-probe-*/")' >> "$GITHUB_OUTPUT"

      - name: Preserve desktop startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-startup-${{ matrix.os }}
          # Only isolated test diagnostics, not installed packages or user data.
          path: |
            ${{ steps.desktop-diagnostics.outputs.path }}
            ${{ steps.desktop-diagnostics.outputs.browser_path }}
            ${{ steps.desktop-diagnostics.outputs.installer_path }}
            ${{ steps.desktop-diagnostics.outputs.probe_path }}
          if-no-files-found: ignore
          retention-days: 7
