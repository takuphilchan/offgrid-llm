name: Isolated Windows terminal diagnostic
on:
  push:
    branches: [diagnostic/terminal-ci-20261112]
permissions:
  contents: read
jobs:
  shell:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix apps/desktop --ignore-scripts --no-audit --no-fund
      - name: Verify command context with canonical temporary paths
        run: node scripts/test/test-terminal-command-windows.cjs --isolated-native-test
