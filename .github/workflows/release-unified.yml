name: Release

on:
  push:
    tags: ['v*']
    branches:
      - 'release-build/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GO_VERSION: '1.26.6'
  # Linux and macOS bundles passed at this pinned revision in v0.3.1.
  LLAMA_CPP_COMMIT: e9fa0781f1c25fc4fe8c86be1edc6970661ad6f0
  # The v0.3.0 Windows bundle was built successfully from this exact revision.
  # The older generic pin above failed on the Windows MSVC runner in v0.3.1.
  LLAMA_CPP_WINDOWS_COMMIT: 718f7b4175bf8b6af6f5eac09fee10754b3ecddd

jobs:
  release-context:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - name: Check out release automation
        uses: actions/checkout@v6

      - name: Resolve and verify release tag
        id: release
        shell: bash
        run: |
          bash .github/scripts/resolve-release-context.sh \
            "${GITHUB_EVENT_NAME}" "${GITHUB_REF}" "${{ inputs.version || '' }}"
          version="$(sed -n 's/^version=//p' "${GITHUB_OUTPUT}")"
          git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null

  publish-containers:
    name: Publish and verify containers
    needs: release-context
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release-context.outputs.version }}
      source_ref: ${{ needs.release-context.outputs.source_ref }}
      publish_gpu: true
    secrets: inherit

  # Create release first
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: release-context
    
    steps:
      - name: Create draft release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.release-context.outputs.version }}"
          if gh release view "${version}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${version} already exists; preserving its assets for this rerun."
          else
            gh release create "${version}" \
              --repo "${{ github.repository }}" \
              --verify-tag \
              --title "OffGrid LLM ${version}" \
              --notes "Release is being built. Artifacts will appear after verification." \
              --draft
          fi

  build-ui:
    name: Build Web UI
    runs-on: ubuntu-latest
    needs: [release-context, create-release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.source_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - name: Install and build UI
        working-directory: web/app
        run: |
          npm ci
          npm run api:check
          npm run check
          npm run build
      - name: Upload UI bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-ui
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  # Build complete bundles with offgrid + llama-server
  build-bundles:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [release-context, create-release, build-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux CPU builds on Ubuntu 22.04 (GLIBC 2.35 - wide compatibility)
          - name: linux-amd64-cpu-avx2
            os: ubuntu-22.04
            platform: linux
            arch: amd64
            variant: cpu
            cpu_features: avx2
            gpu_flags: ""
            cpu_flags: "-march=x86-64-v3 -mno-avx512f"
            
          - name: linux-amd64-cpu-avx512
            os: ubuntu-22.04
            platform: linux
            arch: amd64
            variant: cpu
            cpu_features: avx512
            gpu_flags: ""
            cpu_flags: "-march=x86-64-v4"
            
          - name: linux-arm64-cpu
            os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            variant: cpu
            cpu_features: neon
            gpu_flags: ""
            cpu_flags: "-march=armv8-a"
          
          # Linux Vulkan builds on Ubuntu 24.04 (GLIBC 2.38 - GPU acceleration)
          - name: linux-amd64-vulkan-avx2
            os: ubuntu-24.04
            platform: linux
            arch: amd64
            variant: vulkan
            cpu_features: avx2
            gpu_flags: "-DGGML_VULKAN=ON"
            cpu_flags: "-march=x86-64-v3 -mno-avx512f"
            
          - name: linux-amd64-vulkan-avx512
            os: ubuntu-24.04
            platform: linux
            arch: amd64
            variant: vulkan
            cpu_features: avx512
            gpu_flags: "-DGGML_VULKAN=ON"
            cpu_flags: "-march=x86-64-v4"
            
          # macOS variants
          - name: darwin-arm64-metal
            os: macos-15
            platform: darwin
            arch: arm64
            variant: metal
            cpu_features: apple-silicon
            gpu_flags: "-DGGML_METAL=ON"
            cpu_flags: "-mcpu=apple-m1"
            
          - name: darwin-amd64-cpu
            os: macos-15-intel
            platform: darwin
            arch: amd64
            variant: cpu
            cpu_features: avx2
            gpu_flags: ""
            cpu_flags: "-march=x86-64-v3 -mno-avx512f"
            
          # Windows variants
          - name: windows-amd64-cpu
            os: windows-latest
            platform: windows
            arch: amd64
            variant: cpu
            cpu_features: avx2
            gpu_flags: ""
            cpu_flags: "-march=x86-64-v3 -mno-avx512f"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.source_ref }}

      - name: Download UI bundle
        uses: actions/download-artifact@v7
        with:
          name: web-ui
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version
        id: version
        shell: bash
        run: |
          echo "version=${{ needs.release-context.outputs.version }}" >> "${GITHUB_OUTPUT}"

      - name: Reuse verified release bundle on rerun
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          extension=.tar.gz
          if [ "${{ matrix.platform }}" = "windows" ]; then extension=.zip; fi
          asset_name="offgrid-${version}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}-${{ matrix.cpu_features }}${extension}"
          existing_assets="$(gh api "repos/${{ github.repository }}/releases/tags/${version}" \
            --jq '.assets[] | select(.state == "uploaded" and .size > 0 and (.digest | test("^sha256:[0-9a-f]{64}$"))) | .name')"
          if grep -Fxq "${asset_name}" <<< "${existing_assets}"; then
            echo "Verified release asset ${asset_name} already exists; skipping its rebuild"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate runner architecture
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          case "${{ matrix.arch }}:${host_arch}" in
            amd64:x86_64|amd64:amd64|arm64:arm64|arm64:aarch64)
              echo "Runner architecture ${host_arch} matches ${{ matrix.arch }}"
              ;;
            *)
              echo "::error::Runner architecture ${host_arch} cannot produce the ${{ matrix.arch }} runtime bundle"
              exit 1
              ;;
          esac

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux' && steps.existing.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git
          
          # Install Vulkan SDK if needed
          if [ "${{ matrix.variant }}" = "vulkan" ]; then
            # Install Vulkan SDK from LunarG for glslc
            # Detect Ubuntu version and use correct repo
            UBUNTU_CODENAME=$(lsb_release -cs)
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list "https://packages.lunarg.com/vulkan/lunarg-vulkan-${UBUNTU_CODENAME}.list"
            sudo apt-get update
            sudo apt-get install -y vulkan-sdk
          fi

      - name: Install dependencies (macOS)
        if: matrix.platform == 'darwin' && steps.existing.outputs.skip != 'true'
        run: |
          brew install cmake

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows' && steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Clone llama.cpp
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "windows" ]; then
            llama_commit="${LLAMA_CPP_WINDOWS_COMMIT}"
          else
            llama_commit="${LLAMA_CPP_COMMIT}"
          fi
          mkdir -p /tmp/llama.cpp
          cd /tmp/llama.cpp
          git init
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin "${llama_commit}"
          git checkout --detach FETCH_HEAD
          echo "LLAMA_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build llama-server
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          
          # Detect host architecture and validate CPU flags compatibility
          HOST_ARCH="$(uname -m)"
          MATRIX_CPU_FLAGS="${{ matrix.cpu_flags }}"
          MATRIX_CPU_FEATURES="${{ matrix.cpu_features }}"
          
          echo "Host architecture: $HOST_ARCH"
          echo "Matrix CPU flags: $MATRIX_CPU_FLAGS"
          echo "Matrix CPU features: $MATRIX_CPU_FEATURES"
          
          # Global architecture flags also affect build-time executables. Keep
          # x86 tuning on GGML targets so helpers remain runnable even when a
          # hosted build runner does not support the release's instruction set.
          CPU_FLAGS=""
          GGML_CPU_ARGS=()
          HAS_GGML_CPU_ARGS=false
          
          case "$HOST_ARCH" in
            x86_64|amd64)
              GGML_CPU_ARGS+=(
                -DGGML_SSE42=ON
                -DGGML_AVX=ON
                -DGGML_AVX2=ON
                -DGGML_F16C=ON
                -DGGML_FMA=ON
                -DGGML_BMI2=ON
              )
              if [ "$MATRIX_CPU_FEATURES" = "avx512" ]; then
                GGML_CPU_ARGS+=("-DGGML_AVX512=ON")
                echo "Enabling AVX-512 for GGML runtime targets only"
              else
                GGML_CPU_ARGS+=("-DGGML_AVX512=OFF")
                echo "Enabling AVX2 for GGML runtime targets only"
              fi
              HAS_GGML_CPU_ARGS=true
              ;;
            aarch64|arm64)
              if echo "$MATRIX_CPU_FLAGS" | grep -qE 'arm|aarch64|armv|apple'; then
                CPU_FLAGS="$MATRIX_CPU_FLAGS"
                echo "Using ARM CPU flags: $CPU_FLAGS"
              else
                echo "Skipping incompatible CPU flags for ARM host"
              fi
              ;;
            *)
              echo "Unknown architecture: $HOST_ARCH - skipping CPU flags"
              ;;
          esac
          
          # Build CMake command with validated flags
          # Use static linking for maximum GLIBC compatibility (works on GLIBC 2.17+)
          CMAKE_ARGS=(
            -S /tmp/llama.cpp
            -B /tmp/llama.cpp/build
            -DBUILD_SHARED_LIBS=OFF
            -DCMAKE_BUILD_TYPE=Release
            -DGGML_NATIVE=OFF
            -DGGML_STATIC=ON
            -DLLAMA_CURL=OFF
          )
          # macOS ships Bash 3.2. With `set -u`, expanding an empty array is an
          # unbound-variable error. ARM builds have no x86 GGML arguments, so
          # only expand the array after the x86 branch populated it.
          if [ "$HAS_GGML_CPU_ARGS" = true ]; then
            CMAKE_ARGS+=("${GGML_CPU_ARGS[@]}")
          fi
          
          # Add static linking flags for Linux to avoid GLIBC version requirements
          if [ "${{ matrix.platform }}" = "linux" ]; then
            STATIC_FLAGS="-static-libgcc -static-libstdc++"
            if [ -n "$CPU_FLAGS" ]; then
              CMAKE_ARGS+=("-DCMAKE_C_FLAGS=$CPU_FLAGS $STATIC_FLAGS")
              CMAKE_ARGS+=("-DCMAKE_CXX_FLAGS=$CPU_FLAGS $STATIC_FLAGS")
            else
              CMAKE_ARGS+=("-DCMAKE_C_FLAGS=$STATIC_FLAGS")
              CMAKE_ARGS+=("-DCMAKE_CXX_FLAGS=$STATIC_FLAGS")
            fi
            CMAKE_ARGS+=("-DCMAKE_EXE_LINKER_FLAGS=$STATIC_FLAGS")
            echo "Using static linking for Linux (GLIBC compatibility)"
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            # The Windows runner selects MSVC. GCC -march/-mno-* options are
            # ignored by cl.exe, so use its supported AVX2 codegen switch.
            CMAKE_ARGS+=("-DCMAKE_C_FLAGS=/arch:AVX2")
            CMAKE_ARGS+=("-DCMAKE_CXX_FLAGS=/arch:AVX2 /EHsc")
            echo "Using MSVC AVX2 flags for the Windows bundle"
          elif [ -n "$CPU_FLAGS" ]; then
            CMAKE_ARGS+=("-DCMAKE_C_FLAGS=$CPU_FLAGS")
            CMAKE_ARGS+=("-DCMAKE_CXX_FLAGS=$CPU_FLAGS")
            echo "CMake will use CPU optimizations: $CPU_FLAGS"
          else
            echo "CMake will use default compiler flags (no CPU-specific optimizations)"
          fi
          
          # Add GPU flags if present
          if [ -n "${{ matrix.gpu_flags }}" ]; then
            CMAKE_ARGS+=("${{ matrix.gpu_flags }}")
          fi
          
          printf 'CMake argument: %q\n' "${CMAKE_ARGS[@]}"
          cmake "${CMAKE_ARGS[@]}"
          if [ "${{ matrix.platform }}" = "windows" ] || [ "${{ matrix.variant }}" = "vulkan" ]; then
            # MSBuild and Vulkan shader compilation can exhaust hosted runner
            # memory with unrestricted parallelism.
            build_jobs=2
          else
            build_jobs="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          fi
          echo "Building llama-server with ${build_jobs} parallel jobs"
          build_log="/tmp/llama-server-build.log"
          if ! cmake --build /tmp/llama.cpp/build --config Release --parallel "$build_jobs" --target llama-server 2>&1 | tee "$build_log"; then
            diagnostics="$(grep -Ei '(^|[[:space:]])(fatal )?error|error C[0-9]+|error LNK[0-9]+|killed signal' "$build_log" | tail -20 || true)"
            if [ -n "$diagnostics" ]; then
              while IFS= read -r line; do echo "::error::${line}"; done <<< "$diagnostics"
            else
              tail -40 "$build_log"
              echo "::error::llama-server build failed without a compiler diagnostic; inspect the log tail above"
            fi
            exit 1
          fi

      - name: Build whisper.cpp
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          # Use stable release tag to avoid upstream bugs in main branch
          git clone --depth 1 --branch v1.7.5 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          cd /tmp/whisper.cpp
          echo "WHISPER_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          
          mkdir build && cd build
          
          # Build with static linking for Linux (GLIBC compatibility)
          # Use GGML_NATIVE=OFF to avoid CPU feature detection issues on macOS ARM runners
          CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            STATIC_FLAGS="-static-libgcc -static-libstdc++"
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_C_FLAGS=\"$STATIC_FLAGS\" -DCMAKE_CXX_FLAGS=\"$STATIC_FLAGS\""
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_EXE_LINKER_FLAGS=\"$STATIC_FLAGS\""
          fi
          
          eval cmake .. $CMAKE_ARGS
          cmake --build . --config Release -j $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

      - name: Download Piper
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p /tmp/piper
          cd /tmp/piper
          
          PLATFORM="${{ matrix.platform }}"
          ARCH="${{ matrix.arch }}"
          
          # Construct download URL based on platform/arch
          if [ "$PLATFORM" = "linux" ]; then
            if [ "$ARCH" = "amd64" ]; then
              PIPER_URL="https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz"
            else
              PIPER_URL="https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_aarch64.tar.gz"
            fi
          elif [ "$PLATFORM" = "darwin" ]; then
            if [ "$ARCH" = "arm64" ]; then
              PIPER_URL="https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_macos_aarch64.tar.gz"
            else
              PIPER_URL="https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_macos_x64.tar.gz"
            fi
          elif [ "$PLATFORM" = "windows" ]; then
            PIPER_URL="https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip"
          fi
          
          echo "Downloading Piper from: $PIPER_URL"
          
          # Retry logic for transient network errors (502, etc)
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 -o piper-archive "$PIPER_URL"; then
              echo "Download successful on attempt $i"
              break
            else
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
          
          if [ ! -f piper-archive ]; then
            echo "Failed to download Piper after 5 attempts"
            exit 1
          fi
          
          if [[ "$PIPER_URL" == *.zip ]]; then
            unzip piper-archive
          else
            tar -xzf piper-archive
          fi

      - name: Build offgrid binary
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        env:
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          
          go build \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}" \
            -o offgrid${{ matrix.platform == 'windows' && '.exe' || '' }} \
            ./cmd/offgrid

      - name: Create bundle
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE_NAME="offgrid-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}-${{ matrix.cpu_features }}"
          
          mkdir -p "$BUNDLE_NAME"
          mkdir -p "$BUNDLE_NAME/audio/whisper"
          mkdir -p "$BUNDLE_NAME/audio/piper"
          
          # Copy main binaries
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp offgrid.exe "$BUNDLE_NAME/"
            cp /tmp/llama.cpp/build/bin/Release/llama-server.exe "$BUNDLE_NAME/" 2>/dev/null || \
              cp /tmp/llama.cpp/build/bin/llama-server.exe "$BUNDLE_NAME/"
            
            # Copy whisper binary
            cp /tmp/whisper.cpp/build/bin/Release/whisper-cli.exe "$BUNDLE_NAME/audio/whisper/" 2>/dev/null || \
              cp /tmp/whisper.cpp/build/bin/whisper-cli.exe "$BUNDLE_NAME/audio/whisper/" 2>/dev/null || true
            
            # Copy piper
            cp -r /tmp/piper/piper/* "$BUNDLE_NAME/audio/piper/" 2>/dev/null || \
              cp /tmp/piper/piper.exe "$BUNDLE_NAME/audio/piper/" 2>/dev/null || true
          else
            cp offgrid "$BUNDLE_NAME/"
            cp /tmp/llama.cpp/build/bin/llama-server "$BUNDLE_NAME/"
            
            # Copy whisper binary and libs
            cp /tmp/whisper.cpp/build/bin/whisper-cli "$BUNDLE_NAME/audio/whisper/"
            cp /tmp/whisper.cpp/build/src/*.so* "$BUNDLE_NAME/audio/whisper/" 2>/dev/null || \
              cp /tmp/whisper.cpp/build/src/*.dylib "$BUNDLE_NAME/audio/whisper/" 2>/dev/null || true
            cp /tmp/whisper.cpp/build/ggml/src/*.so* "$BUNDLE_NAME/audio/whisper/" 2>/dev/null || \
              cp /tmp/whisper.cpp/build/ggml/src/*.dylib "$BUNDLE_NAME/audio/whisper/" 2>/dev/null || true
            
            # Create whisper wrapper script
            if [ "${{ matrix.platform }}" = "linux" ]; then
              printf '%s\n' '#!/bin/bash' 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' 'export LD_LIBRARY_PATH="$SCRIPT_DIR:$LD_LIBRARY_PATH"' 'exec "$SCRIPT_DIR/whisper-cli" "$@"' > "$BUNDLE_NAME/audio/whisper/whisper"
            elif [ "${{ matrix.platform }}" = "darwin" ]; then
              printf '%s\n' '#!/bin/bash' 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' 'export DYLD_LIBRARY_PATH="$SCRIPT_DIR:$DYLD_LIBRARY_PATH"' 'exec "$SCRIPT_DIR/whisper-cli" "$@"' > "$BUNDLE_NAME/audio/whisper/whisper"
            fi
            chmod +x "$BUNDLE_NAME/audio/whisper/whisper" "$BUNDLE_NAME/audio/whisper/whisper-cli"
            
            # Copy piper
            cp -r /tmp/piper/piper/* "$BUNDLE_NAME/audio/piper/" 2>/dev/null || \
              cp /tmp/piper/piper "$BUNDLE_NAME/audio/piper/" 2>/dev/null || true
            chmod +x "$BUNDLE_NAME/audio/piper/"* 2>/dev/null || true
          fi
          
          # Create install script
          if [ "${{ matrix.platform }}" != "windows" ]; then
            cat > "$BUNDLE_NAME/install.sh" << 'EOF'
          #!/bin/bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          AUDIO_DIR="$HOME/.offgrid-llm/audio"
          
          echo "Installing OffGrid LLM..."
          
          # Install main binaries
          sudo cp "$SCRIPT_DIR/offgrid" /usr/local/bin/offgrid
          sudo cp "$SCRIPT_DIR/llama-server" /usr/local/bin/llama-server
          sudo chmod +x /usr/local/bin/offgrid /usr/local/bin/llama-server
          
          # Install audio components
          echo "Installing audio components..."
          mkdir -p "$AUDIO_DIR/whisper" "$AUDIO_DIR/piper"
          
          if [ -d "$SCRIPT_DIR/audio/whisper" ]; then
            cp -r "$SCRIPT_DIR/audio/whisper/"* "$AUDIO_DIR/whisper/"
            chmod +x "$AUDIO_DIR/whisper/"* 2>/dev/null || true
            echo "✓ Whisper (speech-to-text) installed"
          fi
          
          if [ -d "$SCRIPT_DIR/audio/piper" ]; then
            cp -r "$SCRIPT_DIR/audio/piper/"* "$AUDIO_DIR/piper/"
            chmod +x "$AUDIO_DIR/piper/"* 2>/dev/null || true
            echo "✓ Piper (text-to-speech) installed"
          fi
          
          # Install web UI
          WEB_DIR="/var/lib/offgrid/web/ui"
          if [ -d "$SCRIPT_DIR/web/ui" ]; then
            sudo mkdir -p "$WEB_DIR"
            sudo cp -r "$SCRIPT_DIR/web/ui/"* "$WEB_DIR/"
            echo "✓ Web UI installed"
          fi
          
          echo ""
          echo "✓ OffGrid LLM installed successfully!"
          echo ""
          echo "Get started:"
          echo "  offgrid --version"
          echo "  offgrid serve              # Start server with Web UI"
          echo "  offgrid search llama       # Search for models"
          EOF
            chmod +x "$BUNDLE_NAME/install.sh"
          fi
          
          # Copy the generated web UI to bundle
          if [ -d "web/dist" ]; then
            mkdir -p "$BUNDLE_NAME/web/ui"
            cp -r web/dist/* "$BUNDLE_NAME/web/ui/"
          fi
          
          # Create README
          cat > "$BUNDLE_NAME/README.md" << EOF
          # OffGrid LLM ${VERSION}
          
          **Platform:** ${{ matrix.name }}
          **llama.cpp:** ${{ env.LLAMA_COMMIT }}
          **whisper.cpp:** ${{ env.WHISPER_COMMIT }}
          
          ## Installation
          EOF
          
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cat >> "$BUNDLE_NAME/README.md" << 'EOF'
          ### Windows
          1. Extract this archive
          2. Run the installer or manually copy binaries to your PATH
          
          ```powershell
          # Copy main binaries
          Copy-Item offgrid.exe C:\Program Files\OffGrid\
          Copy-Item llama-server.exe C:\Program Files\OffGrid\
          
          # Audio binaries are in audio\ folder
          ```
          EOF
          else
            cat >> "$BUNDLE_NAME/README.md" << 'EOF'
          ### Linux / macOS
          ```bash
          ./install.sh
          ```
          
          This installs:
          - offgrid and llama-server to /usr/local/bin
          - whisper.cpp and piper to ~/.offgrid-llm/audio/
          - Web UI to /var/lib/offgrid/web/ui/
          EOF
          fi
          
          cat >> "$BUNDLE_NAME/README.md" << 'EOF'
          
          ## Getting Started
          
          ```bash
          # Verify installation
          offgrid --version
          
          # Start server with Web UI
          offgrid serve
          
          # Search for models
          offgrid search llama --limit 5
          
          # Download a model
          offgrid download-hf bartowski/Llama-3.2-3B-Instruct-GGUF \
            --file Llama-3.2-3B-Instruct-Q4_K_M.gguf
          
          # Start chatting
          offgrid run Llama-3.2-3B-Instruct-Q4_K_M
          ```
          
          ## Features
          
          - **LLM Inference**: Chat with local AI models
          - **Speech-to-Text**: Transcribe audio with whisper.cpp
          - **Text-to-Speech**: Generate speech with Piper
          - **Web UI**: Access at http://localhost:11611/ui
          
          ## Documentation
          
          https://github.com/takuphilchan/offgrid-llm
          EOF
          
          # Create checksums (use shasum on macOS, sha256sum on Linux)
          cd "$BUNDLE_NAME"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            sha256sum offgrid.exe llama-server.exe > checksums.sha256 2>/dev/null || \
              shasum -a 256 offgrid.exe llama-server.exe > checksums.sha256
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            shasum -a 256 offgrid llama-server > checksums.sha256
          else
            sha256sum offgrid llama-server > checksums.sha256
          fi
          cd ..
          
          # Create archive
          if [ "${{ matrix.platform }}" = "windows" ]; then
            powershell Compress-Archive -Path "$BUNDLE_NAME" -DestinationPath "${BUNDLE_NAME}.zip"
            echo "ASSET_PATH=${BUNDLE_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czf "${BUNDLE_NAME}.tar.gz" "$BUNDLE_NAME"
            echo "ASSET_PATH=${BUNDLE_NAME}.tar.gz" >> $GITHUB_ENV
          fi
          
          echo "BUNDLE_NAME=${BUNDLE_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: ${{ env.ASSET_PATH }}
          retention-days: 7

      - name: Upload to release
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          asset_name="$(basename "${ASSET_PATH}")"
          if gh release view "${version}" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' | grep -Fxq "${asset_name}"; then
            echo "Release asset ${asset_name} already exists; keeping it."
          else
            gh release upload "${version}" "${ASSET_PATH}" \
              --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build desktop app
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    needs: [release-context, create-release, build-ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            build_script: build:linux
            
          - os: macos
            runner: macos-latest
            build_script: build:mac
            
          - os: windows
            runner: windows-latest
            build_script: build:win

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.source_ref }}

      - name: Download UI bundle
        uses: actions/download-artifact@v7
        with:
          name: web-ui
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get version
        id: version
        shell: bash
        run: |
          echo "version=${{ needs.release-context.outputs.version }}" >> "${GITHUB_OUTPUT}"

      - name: Build CLI binaries for bundling
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')

          mkdir -p build/linux build/macos build/windows

          if [ "${{ matrix.os }}" = "linux" ]; then
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}" \
              -o build/linux/offgrid ./cmd/offgrid
          elif [ "${{ matrix.os }}" = "macos" ]; then
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}" \
              -o build/macos/offgrid-amd64 ./cmd/offgrid
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}" \
              -o build/macos/offgrid-arm64 ./cmd/offgrid
          else
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME}" \
              -o build/windows/offgrid.exe ./cmd/offgrid
          fi

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Clean electron-builder cache
        if: matrix.os == 'macos'
        shell: bash
        run: |
          # Remove electron-builder cache that might have old DMG settings
          rm -rf ~/Library/Caches/electron-builder
          rm -rf ~/.cache/electron-builder
          rm -rf desktop/node_modules/dmg-builder/.cache
          echo "Electron-builder cache cleaned"

      - name: Prepare architecture-specific binaries (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          # List what we have
          ls -la build/macos/
          
          # Electron-builder will build each arch separately, so we'll handle this in the build
          echo "macOS binaries prepared: offgrid-amd64 and offgrid-arm64"

      - name: Build desktop app
        working-directory: desktop
        run: |
          echo "Building desktop app for ${{ matrix.os }}..."
          npm run ${{ matrix.build_script }}
          echo "Build completed. Listing dist directory:"
        shell: bash
          
      - name: List build output
        working-directory: desktop
        shell: bash
        run: |
          if [ -d "dist" ]; then
            echo "Contents of dist/ directory:"
            ls -lah dist/
          else
            echo "dist/ directory not found!"
          fi
          
      - name: Verify build artifacts exist
        working-directory: desktop/dist
        shell: bash
        run: |
          echo "Checking for build artifacts..."
          ls -la
          
          if [ "${{ matrix.os }}" = "linux" ]; then
            if ! ls *.AppImage *.deb 2>/dev/null | grep -q .; then
              echo "ERROR: No Linux desktop artifacts found!"
              exit 1
            else
              echo "SUCCESS: Found Linux desktop artifacts"
            fi
          elif [ "${{ matrix.os }}" = "macos" ]; then
            if ! ls *.zip 2>/dev/null | grep -q .; then
              echo "ERROR: No macOS desktop artifacts found!"
              exit 1
            else
              echo "SUCCESS: Found macOS desktop artifacts"
            fi
          elif [ "${{ matrix.os }}" = "windows" ]; then
            if ! ls *.exe 2>/dev/null | grep -q .; then
              echo "ERROR: No Windows desktop artifacts found!"
              exit 1
            else
              echo "SUCCESS: Found Windows desktop artifacts"
            fi
          fi

      - name: Find and upload artifacts
        id: artifacts
        shell: bash
        working-directory: desktop/dist
        run: |
          if [ "${{ matrix.os }}" = "linux" ]; then
            # Upload all Linux artifacts (AppImage and .deb)
            for file in *.AppImage *.deb; do
              if [ -f "$file" ]; then
                echo "Found: $file"
                echo "$file" >> ../../artifacts-list.txt
              fi
            done
          elif [ "${{ matrix.os }}" = "macos" ]; then
            # Upload all macOS artifacts.
            for file in *.zip; do
              if [ -f "$file" ]; then
                echo "Found: $file"
                echo "$file" >> ../../artifacts-list.txt
              fi
            done
          else
            # Upload all Windows artifacts (.exe installers and portable)
            for file in *.exe; do
              if [ -f "$file" ]; then
                echo "Found: $file"
                echo "$file" >> ../../artifacts-list.txt
              fi
            done
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: desktop/dist/*
          retention-days: 7

      - name: Upload to release
        shell: bash
        working-directory: desktop/dist
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          repo="${{ github.repository }}"
          existing_assets="$(gh release view "${version}" --repo "${repo}" --json assets --jq '.assets[].name')"
          upload_if_missing() {
            local file="$1"
            # GitHub replaces spaces in uploaded filenames with dots. Electron
            # outputs files with spaces, so compare the name GitHub stores.
            local asset_name="${file// /.}"
            if grep -Fxq "${asset_name}" <<< "${existing_assets}"; then
              echo "Release asset ${asset_name} already exists; keeping it."
            else
              gh release upload "${version}" "${file}" --repo "${repo}"
            fi
          }
          echo "Current directory contents:"
          ls -lah
          echo ""
          echo "Looking for files to upload..."
          
          # Determine file pattern based on OS
          if [ "${{ matrix.os }}" = "linux" ]; then
            PATTERN="\( -name \"*.AppImage\" -o -name \"*.deb\" \)"
          elif [ "${{ matrix.os }}" = "macos" ]; then
            PATTERN="-name \"*.zip\""
          else
            PATTERN="-name \"*.exe\""
          fi
          
          # Count files first
          FILE_COUNT=0
          if [ "${{ matrix.os }}" = "linux" ]; then
            FILE_COUNT=$(find . -maxdepth 1 \( -name "*.AppImage" -o -name "*.deb" \) -type f | wc -l)
          elif [ "${{ matrix.os }}" = "macos" ]; then
            FILE_COUNT=$(find . -maxdepth 1 -name "*.zip" -type f | wc -l)
          else
            FILE_COUNT=$(find . -maxdepth 1 -name "*.exe" -type f | wc -l)
          fi
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No files found to upload for ${{ matrix.os }}!"
            exit 1
          fi
          
          echo "Found $FILE_COUNT file(s) to upload"
          echo ""
          
          # Upload files using while loop (portable across all shells)
          if [ "${{ matrix.os }}" = "linux" ]; then
            find . -maxdepth 1 \( -name "*.AppImage" -o -name "*.deb" \) -type f | while IFS= read -r filepath; do
              file="${filepath#./}"
              echo "Uploading: $file ($(du -h "$file" | cut -f1))"
              if upload_if_missing "$file"; then
                echo "✓ Successfully uploaded: $file"
              else
                echo "✗ Failed to upload: $file"
                exit 1
              fi
            done
          elif [ "${{ matrix.os }}" = "macos" ]; then
            find . -maxdepth 1 -name "*.zip" -type f | while IFS= read -r filepath; do
              file="${filepath#./}"
              echo "Uploading: $file ($(du -h "$file" | cut -f1))"
              if upload_if_missing "$file"; then
                echo "✓ Successfully uploaded: $file"
              else
                echo "✗ Failed to upload: $file"
                exit 1
              fi
            done
          else
            find . -maxdepth 1 -name "*.exe" -type f | while IFS= read -r filepath; do
              file="${filepath#./}"
              echo "Uploading: $file ($(du -h "$file" | cut -f1))"
              if upload_if_missing "$file"; then
                echo "✓ Successfully uploaded: $file"
              else
                echo "✗ Failed to upload: $file"
                exit 1
              fi
            done
          fi
          
          echo ""
          echo "All files uploaded successfully!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create release notes and checksums
  finalize-release:
    name: Finalize Release
    runs-on: ubuntu-latest
    needs: [release-context, build-bundles, build-desktop, publish-containers]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version
        id: version
        run: |
          echo "version=${{ needs.release-context.outputs.version }}" >> "${GITHUB_OUTPUT}"

      - name: Verify assets, generate checksums, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/verify-release-containers.sh \
            "${{ steps.version.outputs.version }}"
          bash .github/scripts/finalize-release.sh \
            "${{ steps.version.outputs.version }}" "${{ github.repository }}"
