name: Publish container image

on:
  push:
    tags:
      - "v*"
    branches:
      - 'release-container/v*'
  workflow_dispatch:
    inputs:
      version:
        description: Image label for a manual pre-release build
        required: true
        default: edge
      publish_gpu:
        description: Also publish the Linux AMD64 NVIDIA CUDA image
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  IMAGE_NAME: takuphilchan/offgrid-llm
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'takuphilchan' }}

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            value="${{ inputs.version }}"
            source_ref="${GITHUB_REF}"
          elif [[ "${GITHUB_REF}" == refs/heads/release-container/v* ]]; then
            source_ref="${GITHUB_REF#refs/heads/release-container/}"
            if [[ ! "${source_ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Expected a release-container/vX.Y.Z branch"
              exit 1
            fi
            value="${source_ref#v}"
          else
            value="${GITHUB_REF_NAME#v}"
            source_ref="${GITHUB_REF}"
          fi
          {
            echo "value=${value}"
            echo "source_ref=${source_ref}"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.source_ref }}
          fetch-depth: 0

      - name: Record source revision
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Apply reviewed GPU packaging fix on repair branch
        if: startsWith(github.ref, 'refs/heads/release-container/v')
        shell: bash
        run: |
          set -euo pipefail
          # The application remains pinned to its immutable release tag. Only
          # the repaired Dockerfile comes from the reviewed repair branch.
          git show "${GITHUB_SHA}:docker/Dockerfile.gpu" > docker/Dockerfile.gpu

      - name: Reuse published versioned images on repair branch
        if: startsWith(github.ref, 'refs/heads/release-container/v')
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          for flavor in cpu gpu; do
            tag="${{ steps.version.outputs.value }}"
            if [[ "${flavor}" == gpu ]]; then tag="${tag}-gpu"; fi
            status="$(curl --silent --show-error --max-time 20 --retry 3 \
              --output "${RUNNER_TEMP}/offgrid-${flavor}-tag.json" \
              --write-out '%{http_code}' \
              "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${tag}/")"
            case "${status}" in
              200)
                if [[ "${flavor}" == cpu ]]; then
                  if jq -e '.images | any(.[]; .os == "linux" and .architecture == "amd64") and any(.[]; .os == "linux" and .architecture == "arm64")' \
                    "${RUNNER_TEMP}/offgrid-${flavor}-tag.json" >/dev/null; then
                    echo "cpu=true" >> "${GITHUB_OUTPUT}"
                  fi
                elif jq -e '.images | any(.[]; .os == "linux" and .architecture == "amd64")' \
                  "${RUNNER_TEMP}/offgrid-${flavor}-tag.json" >/dev/null; then
                  echo "gpu=true" >> "${GITHUB_OUTPUT}"
                fi
                ;;
              404) ;;
              *) echo "::error::Docker Hub lookup for ${tag} returned HTTP ${status}"; exit 1 ;;
            esac
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Add a repository Actions secret named DOCKERHUB_TOKEN containing a Docker Hub read/write access token."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ startsWith(github.ref, 'refs/heads/release-container/v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }},enable=${{ !startsWith(github.ref, 'refs/heads/release-container/v') }}
          labels: |
            org.opencontainers.image.title=OffGrid LLM
            org.opencontainers.image.description=Private, local-first LLM inference, agents, and knowledge retrieval

      - name: Build smoke-test image
        if: steps.existing.outputs.cpu != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: offgrid-llm:smoke-test
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ steps.source.outputs.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container startup and CLI
        if: steps.existing.outputs.cpu != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm offgrid-llm:smoke-test version
          docker run -d --name offgrid-smoke -p 127.0.0.1:11611:11611 offgrid-llm:smoke-test
          trap 'docker logs offgrid-smoke || true; docker rm -f offgrid-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:11611/health >/dev/null; then
              exit 0
            fi
            echo "Waiting for container health (${attempt}/30)"
            sleep 2
          done
          echo "Container did not become healthy" >&2
          exit 1

      - name: Build and push multi-platform image
        if: steps.existing.outputs.cpu != 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ steps.source.outputs.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: steps.existing.outputs.cpu != 'true'
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate NVIDIA image metadata
        if: (github.event_name == 'push' || inputs.publish_gpu) && steps.existing.outputs.gpu != 'true'
        id: meta_gpu
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-gpu,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ startsWith(github.ref, 'refs/heads/release-container/v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }},enable=${{ !startsWith(github.ref, 'refs/heads/release-container/v') }}
          labels: |
            org.opencontainers.image.title=OffGrid LLM (NVIDIA CUDA)
            org.opencontainers.image.description=Private, local-first LLM inference with NVIDIA CUDA acceleration
            org.offgrid.packaging.revision=${{ github.sha }}

      - name: Build and push NVIDIA image
        if: (github.event_name == 'push' || inputs.publish_gpu) && steps.existing.outputs.gpu != 'true'
        id: push_gpu
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_gpu.outputs.tags }}
          labels: ${{ steps.meta_gpu.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ steps.source.outputs.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=max,scope=gpu
          provenance: mode=max
          sbom: true

      - name: Attest NVIDIA image
        if: (github.event_name == 'push' || inputs.publish_gpu) && steps.existing.outputs.gpu != 'true'
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push_gpu.outputs.digest }}
          push-to-registry: true
