name: Publish container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a manual build (for example 0.3.0-rc.1)
        required: true
        default: dev
      publish_gpu:
        description: Also publish the Linux AMD64 NVIDIA CUDA image
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  IMAGE_NAME: takuphilchan/offgrid-llm

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            value="${{ inputs.version }}"
          else
            value="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=OffGrid LLM
            org.opencontainers.image.description=Private, local-first LLM inference, agents, and knowledge retrieval

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: offgrid-llm:smoke-test
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container startup and CLI
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm offgrid-llm:smoke-test version
          docker run -d --name offgrid-smoke -p 127.0.0.1:11611:11611 offgrid-llm:smoke-test
          trap 'docker logs offgrid-smoke || true; docker rm -f offgrid-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:11611/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy" >&2
          exit 1

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest published image
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate NVIDIA image metadata
        if: github.event_name == 'push' || inputs.publish_gpu
        id: meta_gpu
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-gpu,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=OffGrid LLM (NVIDIA CUDA)
            org.opencontainers.image.description=Private, local-first LLM inference with NVIDIA CUDA acceleration

      - name: Build and push NVIDIA image
        if: github.event_name == 'push' || inputs.publish_gpu
        id: push_gpu
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_gpu.outputs.tags }}
          labels: ${{ steps.meta_gpu.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.created }}
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=max,scope=gpu
          provenance: mode=max
          sbom: true

      - name: Attest NVIDIA image
        if: github.event_name == 'push' || inputs.publish_gpu
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push_gpu.outputs.digest }}
          push-to-registry: true
